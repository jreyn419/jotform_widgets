      var itemsDiv = document.getElementById('cat_items_' + key.replace(/[^a-zA-Z0-9]/g, '_'));
      if (itemsDiv) {
        itemsDiv.style.display = collapsedCategories[key] ? 'none' : 'block';
      }
      var icon = document.getElementById('cat_icon_' + key.replace(/[^a-zA-Z0-9]/g, '_'));
      if (icon) {
        icon.style.transform = collapsedCategories[key] ? 'rotate(0deg)' : 'rotate(90deg)';
      }
      advanceFocus(focusedKey, false);
    }

    function tagArea(areaName) {
      if (!sealableAreas[areaName]) return;
      if (!isAreaAllOk(areaName) && !isAreaSealable(areaName)) return;
      var now = new Date();
      taggedAreas[areaName] = {
        taggedDate: now.toISOString().split('T')[0],
        taggedTimestamp: now.getTime(),
        checkedOn: localDateString(now)
      };

      // Sealing happens after the count, so collapse the sealed area and stay put
      var finishing = isEverythingComplete();
      if (finishing) {
        expandedArea = null;
        expandedGroup = null;
      }

      buildUI();

      if (finishing) {
        afterSealChange();
      } else if (expandedArea) {
        // buildUI's own auto-advance opened the next area; scroll it into view
        // accounting for any sticky group header above it.
        setTimeout(function() {
          var areaDiv = document.getElementById('area_' + expandedArea.replace(/[^a-zA-Z0-9]/g, '_'));
          if (areaDiv) {
            var scrollParent = document.getElementById('areasContainer');
            if (scrollParent) {
              var areaRect = areaDiv.getBoundingClientRect();
              var scrollRect = scrollParent.getBoundingClientRect();
              // Measure the sticky group header height if this area is inside a group
              var groupHeaderHeight = 0;
              var parentGroup = areaDiv.closest('.area-group');
              if (parentGroup) {
                var groupHeader = parentGroup.querySelector('.area-header');
                if (groupHeader) groupHeaderHeight = groupHeader.getBoundingClientRect().height;
              }
              var targetScroll = scrollParent.scrollTop + (areaRect.top - scrollRect.top) - groupHeaderHeight;
              scrollParent.scrollTo({ top: Math.max(0, targetScroll), behavior: 'smooth' });
            } else {
              areaDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }
        }, 150);
      }
    }

    // Opening something inside a sealed container opens the container too
    function breakAncestorSeals(areaName) {
      var up = areaParent[areaName];
      while (up) {
        if (taggedAreas[up]) {
          brokenSeals.push({
            area: up,
            reason: 'child_broken',
            taggedDate: taggedAreas[up].taggedDate,
            brokenTimestamp: Date.now()
          });
          delete taggedAreas[up];
          if (INVENTORY[up]) {
            for (var catName in INVENTORY[up]) {
              var items = INVENTORY[up][catName];
              for (var i = 0; i < items.length; i++) {
                var key = generateKey(up, catName, items[i].name);
                itemStates[key] = { actual: 0 };
                delete restockStatus[key];
              }
            }
          }
        }
        up = areaParent[up];
      }
    }

    // Reset an area's own items for a recount
    function resetAreaItems(areaName) {
      if (!INVENTORY[areaName]) return;
      for (var catName in INVENTORY[areaName]) {
        var items = INVENTORY[areaName][catName];
        for (var i = 0; i < items.length; i++) {
          var key = generateKey(areaName, catName, items[i].name);
          itemStates[key] = { actual: 0 };
          delete restockStatus[key];
        }
      }
    }

    // Break a seal: log it, reset the area for a recount, open everything
    // sealed around it, and with breakInside also everything sealed within it
    function applySealBreak(areaName, reason, breakInside) {
      var tagInfo = taggedAreas[areaName];
      brokenSeals.push({
        area: areaName,
        reason: reason || 'review',
        taggedDate: tagInfo ? tagInfo.taggedDate : null,
        brokenTimestamp: Date.now()
      });
      delete taggedAreas[areaName];
      resetAreaItems(areaName);
      breakAncestorSeals(areaName);

      if (breakInside) {
        var inside = descendantAreas(areaName);
        for (var c = 0; c < inside.length; c++) {
          var childName = inside[c];
          if (taggedAreas[childName]) {
            brokenSeals.push({
              area: childName,
              reason: 'parent_broken',
              taggedDate: taggedAreas[childName].taggedDate,
              brokenTimestamp: Date.now()
            });
            delete taggedAreas[childName];
          }
          // Reset what is inside regardless: it is part of the same unit
          resetAreaItems(childName);
        }
      }
    }

    function breakSeal(areaName, reason) {
      // For containers, offer to also break the seals inside
      if (areaHierarchy[areaName]) {
        var hasSealableChildren = false;
        var children = descendantAreas(areaName);
        for (var c = 0; c < children.length; c++) {
          if (sealableAreas[children[c]]) { hasSealableChildren = true; break; }
        }

        if (hasSealableChildren) {
          var choice = reason === 'missing'
            ? confirm('The seal for "' + areaName + '" is missing.\n\nPress OK to break ALL seals (this one and everything inside it).\nPress Cancel to break only this seal.')
            : confirm('Breaking the seal for "' + areaName + '".\n\nPress OK to break ALL seals (this one and everything inside it).\nPress Cancel to break only this seal.');

          // First confirm they actually want to break the parent
          var proceedMsg = reason === 'missing'
            ? 'This will reset items and require re-verification. Continue?'
            : 'Breaking the seal will reset items. You will need to re-verify. Continue?';
          if (!confirm(proceedMsg)) return;

          applySealBreak(areaName, reason, choice);
          buildUI();
          return;
        }
      }

      // Standard break seal for non-parent areas (or parents without sealable children)
      var message = reason === 'missing'
        ? 'The seal for this area is missing. All items will be reset and you will need to re-verify every item. Continue?'
        : 'Breaking the seal will reset all items in this area. You will need to re-verify every item. Continue?';
      if (!confirm(message)) {
        return;
      }
      applySealBreak(areaName, reason, false);
      buildUI();
    }

    // =====================================================
    // SEAL CHECK ON OPENING
    // =====================================================

    // Areas in display order: parents before what is inside them
    function areasInDisplayOrder() {
      var out = [];
      function visit(name) {
        out.push(name);
        var kids = areaHierarchy[name] || [];
        for (var i = 0; i < kids.length; i++) visit(kids[i]);
      }
      for (var areaName in INVENTORY) {
        if (!areaParent[areaName]) visit(areaName);
      }
      return out;
    }

    // Sealed areas the crew can see: nothing sealed around them
    function visibleSealedAreas() {
      var out = [];
      var all = areasInDisplayOrder();
      for (var i = 0; i < all.length; i++) {
        var name = all[i];
        if (!taggedAreas[name]) continue;
        var anc = areaAncestors(name);
        var hidden = false;
        for (var a = 0; a < anc.length; a++) {
          if (taggedAreas[anc[a]]) { hidden = true; break; }
        }
        if (!hidden) out.push(name);
      }
      return out;
    }

    // Visible seals not yet confirmed since the last submission
    function sealCheckPending() {
      var today = localDateString(new Date());
      var vis = visibleSealedAreas();
      var out = [];
      for (var i = 0; i < vis.length; i++) {
        if (taggedAreas[vis[i]].checkedOn !== today) out.push(vis[i]);
      }
      return out;
    }

    function sealCheckOpen() {
      return document.getElementById('sealCheckOverlay').classList.contains('open');
    }

    // Called once the restored state is in place: ask about seals from an
    // earlier day before the count starts
    function maybeStartSealCheck() {
      if (!stateReady) return;
      if (sealCheckPending().length === 0) {
        if (sealCheckOpen()) closeSealCheck();
        return;
      }
      renderSealCheck();
      document.getElementById('sealCheckOverlay').classList.add('open');
    }

    function closeSealCheck() {
      document.getElementById('sealCheckOverlay').classList.remove('open');
    }

    function renderSealCheck() {
      var body = document.getElementById('sealCheckContent');
      var footer = document.getElementById('sealCheckFooter');
      var pending = sealCheckPending();
      var html = '<div class="seal-intro">These areas were sealed last time. Is each seal still in place?</div>';
      for (var i = 0; i < pending.length; i++) {
        var name = pending[i];
        var ancestors = areaAncestors(name);
        var arg = JSON.stringify(name).replace(/"/g, '&quot;');
        html += '<div class="seal-row seal-check-row" style="padding-left:' + (20 + ancestors.length * 14) + 'px">' +
          '<div class="seal-row-info">' +
            '<div class="seal-row-name">' + escapeHtml(name) + '</div>' +
            (ancestors.length ? '<div class="seal-row-path">' + escapeHtml(ancestors.join(' \u203A ')) + '</div>' : '') +
            '<div class="seal-row-status">Sealed ' + escapeHtml(formatTagDate(taggedAreas[name].taggedDate)) + '</div>' +
          '</div>' +
          '<div class="seal-check-btns">' +
            '<button class="seal-row-btn no" onclick="answerSealCheck(' + arg + ', false)">Not sealed</button>' +
            '<button class="seal-row-btn" onclick="answerSealCheck(' + arg + ', true)">Still sealed</button>' +
          '</div>' +
        '</div>';
      }
      body.innerHTML = html;
      footer.style.display = pending.length > 1 ? 'block' : 'none';
    }

    // Still sealed: noted for today. Not sealed: the area opens for a recount,
    // and any seals that were inside it are asked about next.
    function answerSealCheck(areaName, stillSealed) {
      if (!taggedAreas[areaName]) return;
      if (stillSealed) {
        taggedAreas[areaName].checkedOn = localDateString(new Date());
      } else {
        applySealBreak(areaName, 'missing', false);
      }
      buildUI();
      saveState();
      if (sealCheckPending().length === 0) {
        closeSealCheck();
      } else {
        renderSealCheck();
      }
    }

    function confirmAllSealsPresent() {
      var pending = sealCheckPending();
      var today = localDateString(new Date());
      for (var i = 0; i < pending.length; i++) taggedAreas[pending[i]].checkedOn = today;
      buildUI();
      saveState();
      closeSealCheck();
    }

    function formatTagDate(dateStr) {
      var parts = dateStr.split('-');
      var months = ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'];
      return months[parseInt(parts[1], 10) - 1] + ' ' + parseInt(parts[2], 10) + ', ' + parts[0];
    }

    function daysSinceTagged(timestamp) {
      var now = new Date();
      var tagged = new Date(timestamp);
      var nowDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var tagDate = new Date(tagged.getFullYear(), tagged.getMonth(), tagged.getDate());
      return Math.floor((nowDate - tagDate) / (1000 * 60 * 60 * 24));
    }

    // Check if the monthly review day has passed since the area was tagged
    function isReviewOverdue(taggedTimestamp) {
      if (sealReviewDay <= 0) return false;
      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var tagged = new Date(taggedTimestamp);
      var tagDate = new Date(tagged.getFullYear(), tagged.getMonth(), tagged.getDate());

      // Find the most recent review date (on or before today)
      var mostRecentReview;
      if (now.getDate() >= sealReviewDay) {
        // Review day already occurred this month
        mostRecentReview = new Date(now.getFullYear(), now.getMonth(), sealReviewDay);
      } else {
        // Review day hasn't come yet this month; last one was previous month
        mostRecentReview = new Date(now.getFullYear(), now.getMonth() - 1, sealReviewDay);
      }

      // If the area was tagged before the most recent review date, it's overdue
      return tagDate < mostRecentReview;
    }

    // Get the next upcoming review date
    function getNextReviewDate() {
      if (sealReviewDay <= 0) return null;
      var now = new Date();
      if (now.getDate() < sealReviewDay) {
        return new Date(now.getFullYear(), now.getMonth(), sealReviewDay);
      } else {
        return new Date(now.getFullYear(), now.getMonth() + 1, sealReviewDay);
      }
    }

    function getOrdinalSuffix(day) {
      if (day >= 11 && day <= 13) return 'th';
      switch (day % 10) {
        case 1: return 'st';
        case 2: return 'nd';
        case 3: return 'rd';
        default: return 'th';
      }
    }
