    function updateAllStatuses() {
      updateOosBanner();
      var showSealButtons = sealPhaseActive();
      for (var areaName in INVENTORY) {
        var areaId = 'area_' + areaName.replace(/[^a-zA-Z0-9]/g, '_');
        var areaDiv = document.getElementById(areaId);
        var statusEl = document.getElementById('status_' + areaId);

        // Handle tagged areas
        if (taggedAreas[areaName]) {
          if (areaDiv && statusEl) {
            var header = areaDiv.querySelector('.area-header');
            header.classList.remove('has-issues', 'all-ok', 'tagged', 'review-needed');
            statusEl.classList.remove('issues', 'ok', 'tagged', 'review-needed');

            var tagInfo = taggedAreas[areaName];
            var reviewNeeded = isReviewOverdue(tagInfo.taggedTimestamp);

            if (reviewNeeded) {
              header.classList.add('tagged', 'review-needed');
              statusEl.classList.add('review-needed');
              statusEl.textContent = 'REVIEW DUE';
            } else {
              header.classList.add('tagged');
              statusEl.classList.add('tagged');
              statusEl.textContent = 'SEALED';
            }
          }
          continue;
        }

        // Normal (non-tagged) area status
        var areaOk = 0, areaTotal = 0;

        for (var catName in INVENTORY[areaName]) {
          var catOk = 0;
          var items = INVENTORY[areaName][catName];
          var metaKey = areaName + '::' + catName;
          var meta = categoryMeta[metaKey] || { level: 0, parent: null };

          for (var i = 0; i < items.length; i++) {
            var key = generateKey(areaName, catName, items[i].name);
            var actual = (itemStates[key] || { actual: 0 }).actual;
            var status = restockStatus[key] || {};
            var isComplete = actual >= items[i].required || ((status.restocked || status.outOfStock) && actual < items[i].required);
            if (isComplete) {
              catOk++;
              areaOk++;
            }
            areaTotal++;
          }

          // Update this category/subcategory status
          var catStatusId = 'cat_status_' + generateKey(areaName, catName, '').replace(/[^a-zA-Z0-9]/g, '_');
          var catStatusEl = document.getElementById(catStatusId);
          if (catStatusEl) {
            // For parent categories, aggregate subcategory counts too
            if (meta.level === 0) {
              var parentOk = catOk;
              var parentTotal = items.length;
              for (var subCat in INVENTORY[areaName]) {
                var subMeta = categoryMeta[areaName + '::' + subCat];
                if (subMeta && subMeta.level === 1 && subMeta.parent === catName) {
                  var subItems = INVENTORY[areaName][subCat];
                  for (var si = 0; si < subItems.length; si++) {
                    var subKey = generateKey(areaName, subCat, subItems[si].name);
                    var subActual = (itemStates[subKey] || { actual: 0 }).actual;
                    var subStatus = restockStatus[subKey] || {};
                    var subComplete = subActual >= subItems[si].required || ((subStatus.restocked || subStatus.outOfStock) && subActual < subItems[si].required);
                    if (subComplete) parentOk++;
                    parentTotal++;
                  }
                }
              }
              catStatusEl.textContent = '(' + parentOk + '/' + parentTotal + ')';
              setProgressStrip(catStatusEl.parentElement, parentOk, parentTotal);

              // Update parent category checkbox
              var catCb = catStatusEl.parentElement ? catStatusEl.parentElement.querySelector('.category-checkbox') : null;
              if (catCb) catCb.checked = (parentOk === parentTotal && parentTotal > 0);

              // Green tint for completed categories
              if (catStatusEl.parentElement) {
                catStatusEl.parentElement.classList.toggle('category-complete', parentOk === parentTotal && parentTotal > 0);
              }
            } else {
              catStatusEl.textContent = '(' + catOk + '/' + items.length + ')';
              setProgressStrip(catStatusEl.parentElement, catOk, items.length);

              // Update subcategory checkbox
              var catCb = catStatusEl.parentElement ? catStatusEl.parentElement.querySelector('.category-checkbox') : null;
              if (catCb) catCb.checked = (catOk === items.length && items.length > 0);

              // Green tint for completed subcategories
              if (catStatusEl.parentElement) {
                catStatusEl.parentElement.classList.toggle('category-complete', catOk === items.length && items.length > 0);
              }
            }
          }
        }

        if (areaDiv && statusEl) {
          var header = areaDiv.querySelector('.area-header');
          header.classList.remove('has-issues', 'all-ok', 'tagged', 'review-needed');
          statusEl.classList.remove('issues', 'ok', 'tagged', 'review-needed');

          statusEl.textContent = areaOk + '/' + areaTotal;
          setProgressStrip(header, areaOk, areaTotal);

          // A lone category's "all" pill sits on this header
          var areaCb = header.querySelector(':scope > .category-checkbox');
          if (areaCb) areaCb.checked = (areaOk === areaTotal && areaTotal > 0);

          if (areaOk === areaTotal) {
            header.classList.add('all-ok');
            statusEl.classList.add('ok');
          }
          // An unfinished area is neutral: unchecked is not an issue

          // Gauge readings override the header colour: red beats yellow beats counts
          header.classList.remove('gauge-red', 'gauge-yellow');
          statusEl.classList.remove('gauge-red', 'gauge-yellow');
          var worstZone = worstGaugeZoneInArea(areaName);
          if (worstZone === 'red') {
            header.classList.add('gauge-red');
            statusEl.classList.add('gauge-red');
            statusEl.textContent = 'OUT OF SERVICE';
          } else if (worstZone === 'yellow') {
            header.classList.add('gauge-yellow');
            statusEl.classList.add('gauge-yellow');
            statusEl.textContent = areaOk + '/' + areaTotal + ' \u00B7 NOTIFY';
          }
        }

        // Show/hide tag button (show if area is marked sealable and all conditions met)
        if (sealableAreas[areaName]) {
          var tagBtn = document.getElementById('tag_btn_' + areaName.replace(/[^a-zA-Z0-9]/g, '_'));
          if (tagBtn) {
            tagBtn.style.display = (showSealButtons && isAreaSealable(areaName)) ? 'block' : 'none';
          }
        }
      }

      // Update parent group statuses
      for (var parentName in areaHierarchy) {
        var children = areaHierarchy[parentName];
        var groupStatusEl = document.getElementById('status_group_' + parentName.replace(/[^a-zA-Z0-9]/g, '_'));
        var groupDiv = document.getElementById('area_group_' + parentName.replace(/[^a-zA-Z0-9]/g, '_'));
        if (!groupStatusEl || !groupDiv) continue;

        var groupHeader = groupDiv.querySelector(':scope > .area-header');
        if (!groupHeader) continue;
        groupHeader.classList.remove('has-issues', 'all-ok', 'tagged', 'review-needed');
        groupStatusEl.classList.remove('issues', 'ok', 'tagged', 'review-needed');

        // If parent itself is sealed
        if (taggedAreas[parentName]) {
          var parentReview = isReviewOverdue(taggedAreas[parentName].taggedTimestamp);
          if (parentReview) {
            groupHeader.classList.add('tagged', 'review-needed');
            groupStatusEl.classList.add('review-needed');
            groupStatusEl.textContent = 'REVIEW DUE';
          } else {
            groupHeader.classList.add('tagged');
            groupStatusEl.classList.add('tagged');
            groupStatusEl.textContent = 'SEALED';
          }
          continue;
        }

        // Parent not sealed — aggregate children + parent own items
        var totalChildren = 0;
        var sealedChildren = 0;
        var okChildren = 0;
        var anyReviewNeeded = false;

        for (var ci = 0; ci < children.length; ci++) {
          var childName = children[ci];
          if (!INVENTORY[childName]) continue;
          totalChildren++;

          if (taggedAreas[childName]) {
            sealedChildren++;
            if (isReviewOverdue(taggedAreas[childName].taggedTimestamp)) {
              anyReviewNeeded = true;
            }
          } else if (isAreaDone(childName)) {
            okChildren++;
          }
        }

        // Count parent's own items
        var parentOk = 0, parentTotal = 0;
        if (INVENTORY[parentName]) {
          for (var catName in INVENTORY[parentName]) {
            var items = INVENTORY[parentName][catName];
            for (var pi = 0; pi < items.length; pi++) {
              parentTotal++;
              var key = generateKey(parentName, catName, items[pi].name);
              var actual = (itemStates[key] || { actual: 0 }).actual;
              if (actual >= items[pi].required) parentOk++;
            }
          }
        }

        var allChildrenDone = (sealedChildren + okChildren === totalChildren) && totalChildren > 0;
        var parentItemsOk = parentOk === parentTotal;

        if (allChildrenDone && parentItemsOk) {
          if (anyReviewNeeded) {
            groupHeader.classList.add('tagged', 'review-needed');
            groupStatusEl.classList.add('review-needed');
            groupStatusEl.textContent = 'REVIEW DUE';
          } else {
            groupHeader.classList.add('all-ok');
            groupStatusEl.classList.add('ok');
            groupStatusEl.textContent = '✓';
          }
        } else {
          var parts = [];
          if (totalChildren > 0) parts.push((sealedChildren + okChildren) + '/' + totalChildren + ' areas');
          if (parentTotal > 0) parts.push(parentOk + '/' + parentTotal + ' items');
          groupStatusEl.textContent = parts.join(', ');
        }

        // Show/hide parent seal button
        if (sealableAreas[parentName]) {
          var tagBtn = document.getElementById('tag_btn_group_' + parentName.replace(/[^a-zA-Z0-9]/g, '_'));
          if (tagBtn) {
            tagBtn.style.display = (showSealButtons && isAreaSealable(parentName)) ? 'block' : 'none';
          }
        }
      }
    }
    
    function updateSummary() {
      // Helper to build a single shortage item's HTML
      function buildShortageItemHtml(item) {
        var status = restockStatus[item.key] || {};
        var itemClass = '';
        if (status.restocked) itemClass = 'restocked';
        else if (status.outOfStock) itemClass = 'out-of-stock';

        var qtyClass = 'shortage-item-qty';
        var qtyText = '\u00d7' + item.shortage;
        if (status.restocked || status.outOfStock) {
          qtyClass += ' handled';
        } else if (item.isPartial) {
          qtyClass += ' partial';
        }
        
        var h = '<div class="shortage-item ' + itemClass + '" data-key="' + escapeHtml(item.key) + '">';
        h += '<span class="' + qtyClass + '">' + qtyText + '</span>';
        h += '<div class="shortage-item-name">' + escapeHtml(item.name) + '</div>';
        
        if (status.restocked) {
          h += '<button class="action-btn undo" onclick="undoRestock(\'' + escapeHtml(item.key) + '\')">Undo</button>';
        } else if (status.outOfStock) {
          h += '<button class="action-btn undo" onclick="undoRestock(\'' + escapeHtml(item.key) + '\')">Undo</button>';
        } else {
          h += '<div class="shortage-item-actions">';
          h += '<button class="action-btn restock" onclick="markRestocked(\'' + escapeHtml(item.key) + '\')">✓ Restocked</button>';
          h += '<button class="action-btn out-of-stock" onclick="openOutOfStockDialog(\'' + escapeHtml(item.key) + '\', \'' + escapeHtml(item.name) + '\')">Out of Stock</button>';
          h += '</div>';
        }
        
        h += '</div>';
        return h;
      }

      var shortages = [];
      var okCount = 0, shortCount = 0, missingCount = 0;
      var unmarkedCount = 0; // count items nobody has counted, skipped or handled yet

      for (var areaName in INVENTORY) {
        if (taggedAreas[areaName]) continue; // Skip sealed areas
        for (var catName in INVENTORY[areaName]) {
          var items = INVENTORY[areaName][catName];
          for (var i = 0; i < items.length; i++) {
            var key = generateKey(areaName, catName, items[i].name);
            var actual = (itemStates[key] || { actual: 0 }).actual;
            var required = items[i].required;
            
            if (items[i].type === 'gauge' || items[i].type === 'check') {
              if (actual >= required) okCount++;
              continue;
            }

            if (actual >= required) {
              okCount++;
            } else {
              // An item nobody has counted yet is not a shortage, just unchecked
              var st = itemStates[key];
              if (!(st && st.touched) && !restockStatus[key]) { unmarkedCount++; continue; }
              var shortage = required - actual;
              if (actual > 0) {
                shortCount++;
              } else {
                missingCount++;
              }
              shortages.push({
                key: key,
                area: areaName,
                category: catName,
                name: items[i].name,
                required: required,
                actual: actual,
                shortage: shortage,
                isPartial: actual > 0
              });
            }
          }
        }
      }
      
      // A cylinder marked below its limit is a restock item too
      var lowCylinders = collectLowO2Cylinders();
      for (var lc = 0; lc < lowCylinders.length; lc++) {
        missingCount++;
        shortages.push({
          key: lowCylinders[lc].key,
          area: 'Oxygen Supply',
          category: lowCylinders[lc].areaName,
          name: lowCylinders[lc].name,
          required: 1,
          actual: 0,
          shortage: 1,
          isPartial: false
        });
      }

      // Update floating button
      var restockBtn = document.getElementById('restockBtn');
      var restockCount = document.getElementById('restockCount');
      var totalIssues = shortCount + missingCount;
      
      // Count how many are not yet handled
      var unhandledCount = 0;
      for (var j = 0; j < shortages.length; j++) {
        var status = restockStatus[shortages[j].key];
        if (!status || (!status.restocked && !status.outOfStock)) {
          unhandledCount++;
        }
      }
      
      restockCount.textContent = unhandledCount;

      // With the focus row on, the button only appears once the last item is marked
      var footer = document.querySelector('.restock-footer');
      if (footer) footer.classList.toggle('hidden', enableFocusRow && unmarkedCount > 0);

      restockBtn.classList.remove('all-ok', 'idle');
      if (unhandledCount > 0) {
        restockBtn.querySelector('.restock-icon').textContent = '!';
        restockBtn.querySelector('span:nth-child(2)').textContent = 'Restock';
      } else if (unmarkedCount === 0) {
        // Every item counted and nothing left short: the last step is sealing, then finishing
        restockBtn.classList.add('all-ok');
        var unsealedLeft = countUnsealedSealableAreas();
        if (unsealedLeft > 0) {
          restockBtn.querySelector('.restock-icon').innerHTML = '&#x1F512;';
          restockBtn.querySelector('span:nth-child(2)').textContent = 'Seal';
          restockCount.textContent = unsealedLeft;
        } else {
          restockBtn.querySelector('.restock-icon').textContent = '✓';
          restockBtn.querySelector('span:nth-child(2)').textContent = 'Finish';
        }
      } else {
        // Nothing left short yet: stay quiet
        restockBtn.classList.add('idle');
        restockBtn.querySelector('span:nth-child(2)').textContent = 'Restock';
      }
      
      var summaryContent = document.getElementById('summaryContent');
      var modalFooter = document.getElementById('modalFooter');
      
      if (shortages.length === 0) {
        summaryContent.innerHTML = '<div class="summary-empty"><div class="icon">✓</div><div>All items fully stocked!</div></div>';
        modalFooter.style.display = 'none';
      } else {
        modalFooter.style.display = 'block';
        
        // Build hierarchy: area -> category -> items
        // Respect the same structure as the main checklist
        var byArea = {};
        var areaOrder = [];
        for (var j = 0; j < shortages.length; j++) {
          var s = shortages[j];
          if (!byArea[s.area]) {
            byArea[s.area] = {};
            areaOrder.push(s.area);
          }
          if (!byArea[s.area][s.category]) {
            byArea[s.area][s.category] = [];
          }
          byArea[s.area][s.category].push(s);
        }
        
        var html = '';
        for (var ai = 0; ai < areaOrder.length; ai++) {
          var area = areaOrder[ai];
          var cats = byArea[area];

          var areaLabel = escapeHtml(areaPathLabel(area));

          html += '<div class="shortage-group">';
          html += '<div class="shortage-group-header">' + areaLabel + '</div>';
          
          // Group categories in display order: top-level, then subcategories under their parent
          var catOrder = [];
          var catChildren = {};
          for (var catName in cats) {
            var metaKey = area + '::' + catName;
            var meta = categoryMeta[metaKey] || { level: 0, parent: null };
            if (meta.level === 0) {
              catOrder.push(catName);
              if (!catChildren[catName]) catChildren[catName] = [];
            } else if (meta.parent) {
              if (!catChildren[meta.parent]) catChildren[meta.parent] = [];
              catChildren[meta.parent].push(catName);
            }
          }

          // Also include parent categories that have no direct shortages but have sub-shortages
          for (var catName in cats) {
            var metaKey = area + '::' + catName;
            var meta = categoryMeta[metaKey] || { level: 0, parent: null };
            if (meta.level === 1 && meta.parent) {
              if (catOrder.indexOf(meta.parent) === -1) {
                catOrder.push(meta.parent);
              }
              if (!catChildren[meta.parent]) catChildren[meta.parent] = [];
              if (catChildren[meta.parent].indexOf(catName) === -1) {
                catChildren[meta.parent].push(catName);
              }
            }
          }

          for (var ci = 0; ci < catOrder.length; ci++) {
            var topCat = catOrder[ci];
            var topCatItems = cats[topCat] || [];
            var subCats = catChildren[topCat] || [];
            var hasSubCats = subCats.length > 0;
            var hasDirectItems = topCatItems.length > 0;

            // Wrap each top-level category in its own container so sticky
            // subcategory headers are scoped to this category section and
            // don't stay stuck when scrolling into the next category.
            html += '<div class="shortage-cat-section">';

            // Show category header if there are direct items or subcategories,
            // unless it is the area's lone category, which has no header anywhere
            if ((hasDirectItems || hasSubCats) && loneCategoryOf(area) !== topCat) {
              html += '<div class="shortage-cat-header">' + escapeHtml(topCat) + '</div>';
            }

            // Direct items under this top-level category
            for (var k = 0; k < topCatItems.length; k++) {
              html += buildShortageItemHtml(topCatItems[k]);
            }

            // Subcategories
            for (var si = 0; si < subCats.length; si++) {
              var subCatName = subCats[si];
              var subCatItems = cats[subCatName] || [];
              if (subCatItems.length === 0) continue;

              var subMeta = categoryMeta[area + '::' + subCatName];
              var subDisplayName = (subMeta && subMeta.displayName) || subCatName;
              html += '<div class="shortage-subcat-header">' + escapeHtml(subDisplayName) + '</div>';

              for (var k = 0; k < subCatItems.length; k++) {
                html += buildShortageItemHtml(subCatItems[k]);
              }
            }

            html += '</div>'; // close shortage-cat-section
          }
          
          html += '</div>';
        }
        
        summaryContent.innerHTML = html;

        // Defer sticky offset measurement: double-rAF ensures layout is
        // fully settled even on slower mobile renderers inside iframes.
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            updateModalStickyOffsets();
          });
        });
      }

      saveState();
    }

    // Dynamically set sticky tops for modal area/category/subcategory headers
    function updateModalStickyOffsets() {
      var modalBody = document.getElementById('summaryContent');
      if (!modalBody) return;

      // Only measure when the modal is visible — hidden elements return 0
      var overlay = document.getElementById('modalOverlay');
      if (!overlay || !overlay.classList.contains('open')) return;

      var areaHeaders = modalBody.querySelectorAll('.shortage-group-header');
      var catHeaders = modalBody.querySelectorAll('.shortage-cat-header');
      var subHeaders = modalBody.querySelectorAll('.shortage-subcat-header');
      
      var areaH = 0;
      if (areaHeaders.length > 0) {
        areaH = areaHeaders[0].getBoundingClientRect().height;
      }
      // Guard: if measurement returned 0 the layout hasn't settled; retry next frame
      if (areaHeaders.length > 0 && areaH === 0) {
        requestAnimationFrame(function() { updateModalStickyOffsets(); });
        return;
      }

      var catH = 0;
      if (catHeaders.length > 0) {
        for (var i = 0; i < catHeaders.length; i++) {
          catHeaders[i].style.top = areaH + 'px';
        }
        catH = catHeaders[0].getBoundingClientRect().height;
      }
      if (catHeaders.length > 0 && catH === 0) {
        requestAnimationFrame(function() { updateModalStickyOffsets(); });
        return;
      }

      var subTop = areaH + catH;
      if (subHeaders.length > 0) {
        for (var i = 0; i < subHeaders.length; i++) {
          subHeaders[i].style.top = subTop + 'px';
        }
      }
    }

    // Check if all items are fully stocked and show completion popup
    // (or navigate to next sealable area if sealing is needed)
    function checkForCompletion() {
      if (!stateReady) return;
      if (!isEverythingComplete()) return;

      // Areas still to seal: the footer button now reads "Seal" and the user takes it from there
      if (countUnsealedSealableAreas() > 0) return;

      // Small delay so the last category collapse/scroll finishes first
      setTimeout(function() {
        showCompletionPopup();
      }, 300);
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function openRestockModal() {
      if (isEverythingComplete()) {
        if (countUnsealedSealableAreas() > 0) {
          openSealSheet();
        } else {
          showCompletionPopup();
        }
        return;
      }
      document.getElementById('modalOverlay').classList.add('open');
      // Sticky offsets need measurement after the modal is visible
      requestAnimationFrame(function() {
        updateModalStickyOffsets();
      });
    }
    
    function closeRestockModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }
    
    function markRestocked(key) {
      restockStatus[key] = { restocked: true, outOfStock: false, reason: '' };
      updateChecklistItem(key);
      updateAllStatuses();
      updateSummary();
      // Everything handled? Move on to sealing
      handleRestockComplete();
    }
    
    // Update a single checklist item in the main view
    function updateChecklistItem(key) {
      var parts = key.split('::');
      var areaName = parts[0];
      var catName = parts[1];
      var itemName = parts[2];
      var item = findItem(areaName, catName, itemName);
      if (item) {
        var itemDiv = document.getElementById('item_' + key.replace(/[^a-zA-Z0-9]/g, '_'));
        if (itemDiv) {
          var newRow = buildItemRow(areaName, catName, item);
          itemDiv.parentNode.replaceChild(newRow, itemDiv);
        }
        advanceFocus(key, false);
      }
    }
    
    function openOutOfStockDialog(key, name) {
      currentOutOfStockKey = key;
      selectedReason = null;
      document.getElementById('dialogItemName').textContent = name;
      document.getElementById('outOfStockReason').value = '';
      document.getElementById('otherReasonContainer').classList.remove('visible');
      document.getElementById('confirmBtn').disabled = true;
      
      // Reset all reason buttons
      var buttons = document.querySelectorAll('.reason-btn');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove('selected');
      }
      
      document.getElementById('dialogOverlay').classList.add('open');
    }
    
    function closeOutOfStockDialog() {
      document.getElementById('dialogOverlay').classList.remove('open');
      currentOutOfStockKey = null;
      selectedReason = null;
    }
    
    function selectReason(btn, reason) {
      // Remove selected from all buttons
      var buttons = document.querySelectorAll('.reason-btn');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove('selected');
      }
      
      // Select this button
      btn.classList.add('selected');
      
      // Handle "other" option
      var otherContainer = document.getElementById('otherReasonContainer');
      if (reason === 'other') {
        otherContainer.classList.add('visible');
        selectedReason = null; // Will be set from textarea
        document.getElementById('confirmBtn').disabled = true;
        document.getElementById('outOfStockReason').focus();
      } else {
        otherContainer.classList.remove('visible');
        selectedReason = reason;
        document.getElementById('confirmBtn').disabled = false;
      }
    }
    
    function confirmOutOfStock() {
      if (currentOutOfStockKey) {
        var reason = selectedReason;
        if (!reason) {
          reason = document.getElementById('outOfStockReason').value.trim();
        }
        if (reason) {
          restockStatus[currentOutOfStockKey] = { restocked: false, outOfStock: true, reason: reason };
          updateChecklistItem(currentOutOfStockKey);
          closeOutOfStockDialog();
          updateAllStatuses();
          updateSummary();
          // Everything handled? Move on to sealing
          handleRestockComplete();
        }
      }
    }
    
    function undoRestock(key) {
      delete restockStatus[key];
      updateChecklistItem(key);
      updateAllStatuses();
      updateSummary();
    }
    
    function restockAllItems() {
      var lowAll = collectLowO2Cylinders();
      for (var la = 0; la < lowAll.length; la++) {
        var laStatus = restockStatus[lowAll[la].key];
        if (!(laStatus && (laStatus.restocked || laStatus.outOfStock))) {
          restockStatus[lowAll[la].key] = { restocked: true, outOfStock: false, reason: '' };
        }
      }
      // Get all shortage keys and mark them restocked
      var restockedKeys = [];
      for (var areaName in INVENTORY) {
        if (taggedAreas[areaName]) continue; // Skip sealed areas
        for (var catName in INVENTORY[areaName]) {
          var items = INVENTORY[areaName][catName];
          for (var i = 0; i < items.length; i++) {
            var key = generateKey(areaName, catName, items[i].name);
            var actual = (itemStates[key] || { actual: 0 }).actual;
            var required = items[i].required;
            
            if (actual < required) {
              var status = restockStatus[key];
              // Only mark as restocked if not already marked as out of stock
              if (!status || !status.outOfStock) {
                restockStatus[key] = { restocked: true, outOfStock: false, reason: '' };
                restockedKeys.push(key);
              }
            }
          }
        }
      }
      // Update all affected checklist items
      for (var k = 0; k < restockedKeys.length; k++) {
        updateChecklistItem(restockedKeys[k]);
      }
      updateAllStatuses();
      updateSummary();
      // Everything handled? Move on to sealing
      handleRestockComplete();
    }

    // =====================================================
    // JOTFORM INTEGRATION
    // =====================================================
    
    function generateSubmitValue() {
      var restockedItems = [];
      var unavailableItems = [];

      for (var key in restockStatus) {
        var status = restockStatus[key];
        if (!status) continue;

        var parts = key.split('::');
        var areaName = parts[0];
        var catName = parts[1];
        var itemName = parts[2];

        // Low O2 cylinders live in the restock list under their own keys
        if (areaName === 'O2') {
          var lowList = collectLowO2Cylinders();
          var lowEntry = null;
          for (var le = 0; le < lowList.length; le++) if (lowList[le].key === key) lowEntry = lowList[le];
          if (!lowEntry) continue; // no longer low
          if (status.restocked) {
            restockedItems.push({ area: 'Oxygen Supply', category: lowEntry.areaName, name: lowEntry.reportName, quantityRestocked: 1 });
          } else if (status.outOfStock) {
            unavailableItems.push({ area: 'Oxygen Supply', category: lowEntry.areaName, name: lowEntry.reportName, quantityNeeded: 1, reason: status.reason || 'No reason provided' });
          }
          continue;
        }

        // Skip items in tagged areas
        if (taggedAreas[areaName]) continue;

        // Find the item details
        var item = findItem(areaName, catName, itemName);
        if (!item) continue;

        var actual = (itemStates[key] || { actual: 0 }).actual;
        var shortage = item.required - actual;

        if (status.restocked) {
          restockedItems.push({
            area: areaName,
            category: catName,
            name: itemName,
            quantityRestocked: shortage
          });
        } else if (status.outOfStock) {
          unavailableItems.push({
            area: areaName,
            category: catName,
            name: itemName,
            quantityNeeded: shortage,
            reason: status.reason || 'No reason provided'
          });
        }
      }

      // Build tagged areas list for report
      var taggedList = [];
      for (var taggedArea in taggedAreas) {
        var info = taggedAreas[taggedArea];
        var days = daysSinceTagged(info.taggedTimestamp);
        var needsReview = isReviewOverdue(info.taggedTimestamp);
        taggedList.push({
          area: taggedArea,
          taggedDate: info.taggedDate,
          daysSinceTagged: days,
          reviewNeeded: needsReview
        });
      }

      // Generate plain-text report for JotForm submission display.
      // JotForm collapses whitespace/newlines in submission values, so we
      // use <br> tags for line breaks — JotForm renders these in its viewer.
      var now = new Date();
      var months = ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'];
      var hours = now.getHours();
      var ampm = hours >= 12 ? 'PM' : 'AM';
      var h = hours % 12 || 12;
      var min = now.getMinutes() < 10 ? '0' + now.getMinutes() : '' + now.getMinutes();
      var dateHeader = months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear() + ' at ' + h + ':' + min + ' ' + ampm;

      // Helper: group an array of items by their .area property
      var groupByArea = function(items) {
        var groups = {};
        var order = [];
        for (var i = 0; i < items.length; i++) {
          var area = items[i].area;
          if (!groups[area]) { groups[area] = []; order.push(area); }
          groups[area].push(items[i]);
        }
        return { groups: groups, order: order };
      };

      // Build summary line
      var summaryParts = [];
      if (restockedItems.length > 0) summaryParts.push(restockedItems.length + ' restocked');
      if (unavailableItems.length > 0) summaryParts.push(unavailableItems.length + ' unavailable');
      if (brokenSeals.length > 0) summaryParts.push(brokenSeals.length + ' broken seal' + (brokenSeals.length > 1 ? 's' : ''));
      if (taggedList.length > 0) summaryParts.push(taggedList.length + ' sealed area' + (taggedList.length > 1 ? 's' : ''));
      var o2 = getO2Summary();
      if (o2.enabled) {
        if (!o2.checked) summaryParts.push('O2 not checked');
        else if (o2.low.length > 0) summaryParts.push('O2 low: ' + o2.low.join(', '));
      }

      // Gauge readings (tire pressure etc.)
      var gaugeList = collectGaugeReadings();
      var gaugeRed = [], gaugeYellow = [], gaugeUnset = [];
      for (var gi = 0; gi < gaugeList.length; gi++) {
        if (gaugeList[gi].zone === 'red') gaugeRed.push(gaugeList[gi]);
        else if (gaugeList[gi].zone === 'yellow') gaugeYellow.push(gaugeList[gi]);
        else if (gaugeList[gi].zone === null) gaugeUnset.push(gaugeList[gi]);
      }
      if (gaugeRed.length > 0) summaryParts.push(gaugeRed.length + ' OUT OF SERVICE reading' + (gaugeRed.length > 1 ? 's' : ''));
      if (gaugeYellow.length > 0) summaryParts.push(gaugeYellow.length + ' reading' + (gaugeYellow.length > 1 ? 's' : '') + ' to report');
      if (gaugeUnset.length > 0) summaryParts.push(gaugeUnset.length + ' reading' + (gaugeUnset.length > 1 ? 's' : '') + ' not recorded');
      var checkList = collectCheckResults();
      var checkFails = [], checkUnset = [], checkOos = [];
      for (var ci = 0; ci < checkList.length; ci++) {
        if (checkList[ci].result === 'fail') { checkFails.push(checkList[ci]); if (checkList[ci].oos) checkOos.push(checkList[ci]); }
        else if (checkList[ci].result === null) checkUnset.push(checkList[ci]);
      }
      if (checkOos.length > 0) summaryParts.push(checkOos.length + ' OUT OF SERVICE fault' + (checkOos.length > 1 ? 's' : ''));
      if (checkFails.length - checkOos.length > 0) summaryParts.push((checkFails.length - checkOos.length) + ' fault' + (checkFails.length - checkOos.length > 1 ? 's' : '') + ' to report');
      if (checkUnset.length > 0) summaryParts.push(checkUnset.length + ' check' + (checkUnset.length > 1 ? 's' : '') + ' not done');
      var checkLineText = function(r) {
        var text = r.area + ' > ' + r.name + ' \u2014 ';
        if (r.result === null) return text + 'NOT CHECKED';
        if (r.result === 'ok') return text + r.check.okText;
        return text + r.check.failText.toUpperCase() + (r.oos ? ' [OUT OF SERVICE]' : '');
      };

      var gaugeLineText = function(r) {
        var text = r.area + ' > ' + r.name + ' \u2014 ';
        if (r.zone === null) return text + 'NOT RECORDED';
        return text + r.reading + ' ' + r.unit + ' [' + r.zone.toUpperCase() + '] ' + gaugeZoneText(r.gauge, r.zone);
      };

      var unansweredRequired = 0;
      var flaggedAnswers = 0;
      for (var qi = 0; qi < customQuestions.length; qi++) {
        if (customQuestions[qi].required && !isQuestionAnswered(customQuestions[qi])) unansweredRequired++;
        if (isQuestionFlagged(customQuestions[qi])) flaggedAnswers++;
      }
      if (unansweredRequired > 0) summaryParts.push(unansweredRequired + ' unanswered question' + (unansweredRequired > 1 ? 's' : ''));
      if (flaggedAnswers > 0) summaryParts.push(flaggedAnswers + ' flagged answer' + (flaggedAnswers > 1 ? 's' : ''));

      // Helper: one-line description of a question's answer
      var questionLineText = function(q) {
        var text = q.label + ' \u2014 ';
        if (!isQuestionAnswered(q)) return text + (q.required ? 'NOT ANSWERED' : 'skipped');
        text += questionAnswerText(q);
        if (isQuestionFlagged(q)) text += ' [FLAGGED]';
        return text;
      };

      // Helper: one-line description of an O2 area's result
      var o2LineText = function(a) {
        var text = a.name + ' (min ' + a.threshold + ' ' + a.unit + ') \u2014 ';
        if (a.status === 'unchecked') return text + 'NOT CHECKED';
        if (a.status === 'ok') return text + 'OK';
        text += 'LOW';
        if (a.cylinderCount > 1 && a.lowCylinders.length > 0) {
          text += ' (cylinder ' + a.lowCylinders.join(', ') + ')';
        }
        return text;
      };

      // Build plain-text report (JotForm entity-encodes HTML, so plain text
      // is the only format that stays readable in submission views).
      var lines = [];
      lines.push(reportTitle());
      if (selectorActive && currentRig) lines.push(reportSubtitle());
      lines.push(dateHeader);
      lines.push('════════════════════════════════════════');

      if (summaryParts.length > 0) {
        lines.push('Summary: ' + summaryParts.join(', '));
      } else {
        lines.push('All items accounted for. No restock actions needed.');
      }
      lines.push('');

      // --- Out of service (red gauge readings, faulty OOS checks) ---
      if (gaugeRed.length > 0 || checkOos.length > 0) {
        lines.push('\u26D4 OUT OF SERVICE');
        lines.push('\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500');
        for (var gr = 0; gr < gaugeRed.length; gr++) {
          lines.push('  \u2022 ' + gaugeRed[gr].name + ' \u2014 ' + gaugeRed[gr].reading + ' ' + gaugeRed[gr].unit);
        }
        for (var co = 0; co < checkOos.length; co++) {
          lines.push('  \u2022 ' + checkOos[co].name + ' \u2014 ' + checkOos[co].check.failText);
        }
        lines.push('');
      }

      // --- Checks (working / faulty) ---
      if (checkList.length > 0) {
        lines.push('\u2699 CHECKS (' + checkList.length + ')');
        lines.push('\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500');
        for (var cl = 0; cl < checkList.length; cl++) {
          lines.push('  \u2022 ' + checkLineText(checkList[cl]));
        }
        lines.push('');
      }

      // --- Readings ---
      if (gaugeList.length > 0) {
        lines.push('\uD83D\uDCDF READINGS (' + gaugeList.length + ')');
        lines.push('\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500');
        for (var gl = 0; gl < gaugeList.length; gl++) {
          lines.push('  \u2022 ' + gaugeLineText(gaugeList[gl]));
        }
        lines.push('');
      }

      // --- Oxygen Supply ---
      if (o2.enabled) {
        lines.push('\uD83E\uDEC1 OXYGEN SUPPLY');
        lines.push('\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500');
        for (var o = 0; o < o2.areas.length; o++) {
          lines.push('  \u2022 ' + o2LineText(o2.areas[o]));
        }
        lines.push('');
      }

      // --- Questions ---
      if (customQuestions.length > 0) {
        lines.push('\uD83D\uDCDD QUESTIONS (' + customQuestions.length + ')');
        lines.push('\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500');
        for (var ql = 0; ql < customQuestions.length; ql++) {
          lines.push('  \u2022 ' + questionLineText(customQuestions[ql]));
        }
        lines.push('');
      }

      // --- Broken Seals ---
      if (brokenSeals.length > 0) {
        lines.push('⛔ BROKEN SEALS (' + brokenSeals.length + ')');
        lines.push('────────────────────────────────────────');
        for (var b = 0; b < brokenSeals.length; b++) {
          var bs = brokenSeals[b];
          var reasonLabel = bs.reason === 'missing' ? 'Seal was missing' : 'Scheduled review';
          var bLine = '  • ' + bs.area + ' — ' + reasonLabel;
          if (bs.taggedDate) {
            bLine += ' (sealed since ' + formatTagDate(bs.taggedDate) + ')';
          }
          lines.push(bLine);
        }
        lines.push('');
      }

      // --- Sealed / Tagged Areas ---
      if (taggedList.length > 0) {
        lines.push('🔒 SEALED / TAGGED AREAS (' + taggedList.length + ')');
        lines.push('────────────────────────────────────────');
        for (var t = 0; t < taggedList.length; t++) {
          var ta = taggedList[t];
          var tLine = '  • ' + ta.area + ' — Tagged: ' + formatTagDate(ta.taggedDate) + ' (' + ta.daysSinceTagged + ' days)';
          if (ta.reviewNeeded) {
            tLine += ' [REVIEW OVERDUE]';
          }
          lines.push(tLine);
        }
        lines.push('');
      }

      // --- Restocked Items (grouped by area) ---
      if (restockedItems.length > 0) {
        var rGrouped = groupByArea(restockedItems);
        lines.push('✅ RESTOCKED ITEMS (' + restockedItems.length + ')');
        lines.push('────────────────────────────────────────');
        for (var ri = 0; ri < rGrouped.order.length; ri++) {
          var rArea = rGrouped.order[ri];
          var rItems = rGrouped.groups[rArea];
          lines.push('  ' + rArea + ':');
          for (var rj = 0; rj < rItems.length; rj++) {
            lines.push('    • ' + rItems[rj].name + ' (x' + rItems[rj].quantityRestocked + ')');
          }
        }
        lines.push('');
      }

      // --- Unavailable Items (grouped by area) ---
      if (unavailableItems.length > 0) {
        var uGrouped = groupByArea(unavailableItems);
        lines.push('❌ UNAVAILABLE ITEMS (' + unavailableItems.length + ')');
        lines.push('────────────────────────────────────────');
        for (var ui = 0; ui < uGrouped.order.length; ui++) {
          var uArea = uGrouped.order[ui];
          var uItems = uGrouped.groups[uArea];
          lines.push('  ' + uArea + ':');
          for (var uj = 0; uj < uItems.length; uj++) {
            lines.push('    • ' + uItems[uj].name + ' (need ' + uItems[uj].quantityNeeded + ')');
            lines.push('      Reason: ' + uItems[uj].reason);
          }
        }
        lines.push('');
      }

      var report = lines.join('\n');

      // HTML version of the report for the relay widget's submission value.
      // JotForm's "View Submission" renders widget iframes, so the relay
      // widget can display styled HTML.  This version is for storage/display
      // in the relay widget's submitted value.
      var htmlLines = [];
      htmlLines.push('<div style="font-family:Courier New,monospace;font-size:12px;line-height:1.5;color:#333;">');
      htmlLines.push('<div style="font-weight:bold;font-size:14px;">' + escapeHtml(reportTitle()) + '</div>');
      if (selectorActive && currentRig) htmlLines.push('<div style="font-weight:bold;">' + escapeHtml(reportSubtitle()) + '</div>');
      htmlLines.push('<div style="color:#666;">' + dateHeader + '</div>');
      htmlLines.push('<hr style="border:none;border-top:2px double #999;margin:8px 0;">');

      if (summaryParts.length > 0) {
        htmlLines.push('<div style="margin-bottom:8px;"><b>Summary:</b> ' + summaryParts.join(', ') + '</div>');
      } else {
        htmlLines.push('<div style="margin-bottom:8px;">All items accounted for. No restock actions needed.</div>');
      }

      if (gaugeRed.length > 0 || checkOos.length > 0) {
        htmlLines.push('<div style="margin-top:10px;font-weight:bold;color:#fff;background:#c00;padding:4px 8px;">\u26D4 OUT OF SERVICE</div>');
        for (var hgr = 0; hgr < gaugeRed.length; hgr++) {
          htmlLines.push('<div style="padding-left:12px;color:#c00;font-weight:bold;">&bull; ' + escapeHtml(gaugeRed[hgr].name + ' \u2014 ' + gaugeRed[hgr].reading + ' ' + gaugeRed[hgr].unit) + '</div>');
        }
        for (var hco = 0; hco < checkOos.length; hco++) {
          htmlLines.push('<div style="padding-left:12px;color:#c00;font-weight:bold;">&bull; ' + escapeHtml(checkOos[hco].name + ' \u2014 ' + checkOos[hco].check.failText) + '</div>');
        }
      }

      if (checkList.length > 0) {
        htmlLines.push('<div style="margin-top:10px;font-weight:bold;color:#555;">\u2699 CHECKS (' + checkList.length + ')</div>');
        htmlLines.push('<hr style="border:none;border-top:1px solid #ddd;margin:4px 0;">');
        for (var hcl = 0; hcl < checkList.length; hcl++) {
          var hcColor = checkList[hcl].result === 'fail' ? '#c00' : (checkList[hcl].result === 'ok' ? '#2a7d2a' : '#555');
          htmlLines.push('<div style="padding-left:12px;color:' + hcColor + ';">&bull; ' + escapeHtml(checkLineText(checkList[hcl])).replace(' \u2014 ', ' &mdash; ') + '</div>');
        }
      }

      if (gaugeList.length > 0) {
        htmlLines.push('<div style="margin-top:10px;font-weight:bold;color:#555;">\uD83D\uDCDF READINGS (' + gaugeList.length + ')</div>');
        htmlLines.push('<hr style="border:none;border-top:1px solid #ddd;margin:4px 0;">');
        for (var hgl = 0; hgl < gaugeList.length; hgl++) {
          var hgColor = gaugeList[hgl].zone === 'red' ? '#c00' : (gaugeList[hgl].zone === 'yellow' ? '#856404' : (gaugeList[hgl].zone === 'green' ? '#2a7d2a' : '#555'));
          htmlLines.push('<div style="padding-left:12px;color:' + hgColor + ';">&bull; ' + escapeHtml(gaugeLineText(gaugeList[hgl])).replace(' \u2014 ', ' &mdash; ') + '</div>');
        }
      }

      if (o2.enabled) {
        var o2Color = !o2.checked ? '#555' : (o2.low.length > 0 ? '#c00' : '#2a7d2a');
        htmlLines.push('<div style="margin-top:10px;font-weight:bold;color:' + o2Color + ';">\uD83E\uDEC1 OXYGEN SUPPLY</div>');
        htmlLines.push('<hr style="border:none;border-top:1px solid #ddd;margin:4px 0;">');
        for (var ho = 0; ho < o2.areas.length; ho++) {
          var hoLine = o2LineText(o2.areas[ho]).replace(' \u2014 ', ' &mdash; ');
          var hoStyle = o2.areas[ho].status === 'low' ? 'color:#c00;font-weight:bold;' : '';
          htmlLines.push('<div style="padding-left:12px;' + hoStyle + '">&bull; ' + hoLine + '</div>');
        }
      }

      if (customQuestions.length > 0) {
        htmlLines.push('<div style="margin-top:10px;font-weight:bold;color:#555;">\uD83D\uDCDD QUESTIONS (' + customQuestions.length + ')</div>');
        htmlLines.push('<hr style="border:none;border-top:1px solid #ddd;margin:4px 0;">');
        for (var hq = 0; hq < customQuestions.length; hq++) {
          var hqq = customQuestions[hq];
          var hqStyle = (isQuestionFlagged(hqq) || (hqq.required && !isQuestionAnswered(hqq))) ? 'color:#c00;font-weight:bold;' : '';
          var hqLine = escapeHtml(questionLineText(hqq)).replace(' \u2014 ', ' &mdash; ');
          htmlLines.push('<div style="padding-left:12px;' + hqStyle + '">&bull; ' + hqLine + '</div>');
        }
      }

      if (brokenSeals.length > 0) {
        htmlLines.push('<div style="margin-top:10px;font-weight:bold;color:#c00;">⛔ BROKEN SEALS (' + brokenSeals.length + ')</div>');
        htmlLines.push('<hr style="border:none;border-top:1px solid #ddd;margin:4px 0;">');
        for (var hb = 0; hb < brokenSeals.length; hb++) {
          var hbs = brokenSeals[hb];
          var hReasonLabel = hbs.reason === 'missing' ? 'Seal was missing' : 'Scheduled review';
          var hbLine = '&bull; ' + hbs.area + ' &mdash; ' + hReasonLabel;
          if (hbs.taggedDate) hbLine += ' (sealed since ' + formatTagDate(hbs.taggedDate) + ')';
          htmlLines.push('<div style="padding-left:12px;">' + hbLine + '</div>');
        }
      }

      if (taggedList.length > 0) {
        htmlLines.push('<div style="margin-top:10px;font-weight:bold;color:#555;">🔒 SEALED / TAGGED AREAS (' + taggedList.length + ')</div>');
        htmlLines.push('<hr style="border:none;border-top:1px solid #ddd;margin:4px 0;">');
        for (var ht = 0; ht < taggedList.length; ht++) {
          var hta = taggedList[ht];
          var htLine = '&bull; ' + hta.area + ' &mdash; Tagged: ' + formatTagDate(hta.taggedDate) + ' (' + hta.daysSinceTagged + ' days)';
          if (hta.reviewNeeded) htLine += ' <span style="color:#c00;font-weight:bold;">[REVIEW OVERDUE]</span>';
          htmlLines.push('<div style="padding-left:12px;">' + htLine + '</div>');
        }
      }

      if (restockedItems.length > 0) {
        var hrGrouped = groupByArea(restockedItems);
        htmlLines.push('<div style="margin-top:10px;font-weight:bold;color:#2a7d2a;">✅ RESTOCKED ITEMS (' + restockedItems.length + ')</div>');
        htmlLines.push('<hr style="border:none;border-top:1px solid #ddd;margin:4px 0;">');
        for (var hri = 0; hri < hrGrouped.order.length; hri++) {
          var hrArea = hrGrouped.order[hri];
          var hrItems = hrGrouped.groups[hrArea];
          htmlLines.push('<div style="padding-left:12px;font-weight:bold;margin-top:4px;">' + hrArea + ':</div>');
          for (var hrj = 0; hrj < hrItems.length; hrj++) {
            htmlLines.push('<div style="padding-left:24px;">&bull; ' + hrItems[hrj].name + ' (x' + hrItems[hrj].quantityRestocked + ')</div>');
          }
        }
      }

      if (unavailableItems.length > 0) {
        var huGrouped = groupByArea(unavailableItems);
        htmlLines.push('<div style="margin-top:10px;font-weight:bold;color:#c00;">❌ UNAVAILABLE ITEMS (' + unavailableItems.length + ')</div>');
        htmlLines.push('<hr style="border:none;border-top:1px solid #ddd;margin:4px 0;">');
        for (var hui = 0; hui < huGrouped.order.length; hui++) {
          var huArea = huGrouped.order[hui];
          var huItems = huGrouped.groups[huArea];
          htmlLines.push('<div style="padding-left:12px;font-weight:bold;margin-top:4px;">' + huArea + ':</div>');
          for (var huj = 0; huj < huItems.length; huj++) {
            htmlLines.push('<div style="padding-left:24px;">&bull; ' + huItems[huj].name + ' (need ' + huItems[huj].quantityNeeded + ')</div>');
            htmlLines.push('<div style="padding-left:36px;color:#888;font-size:11px;">Reason: ' + huItems[huj].reason + '</div>');
          }
        }
      }

      htmlLines.push('</div>');
      var htmlReport = htmlLines.join('');

      // Machine-readable sync data (consumed by cross-device seal sync
      // and form-edit restoration — do not remove)
      var syncData = {
        taggedAreas: taggedAreas,
        brokenSeals: brokenSeals,
        itemStates: itemStates,
        restockStatus: restockStatus,
        o2States: o2States,
        questionAnswers: questionAnswers,
        rig: currentRig,
        checklist: currentChecklist,
        timestamp: Date.now()
      };

      return {
        report: report,
        htmlReport: htmlReport,
        syncData: syncData
      };
    }
    
    function resizeWidget() {
      if (typeof JFCustomWidget !== 'undefined') {
        JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight });
      }
    }

    // Loading state: the markup starts with it. The spinner only shows if
    // loading lasts longer than 200ms, so a fast load never flashes one.
    var spinnerTimer = null;
    function setLoading(on) {
      var c = document.getElementById('widgetContainer');
      if (!c) return;
      if (spinnerTimer) { clearTimeout(spinnerTimer); spinnerTimer = null; }
      if (on) {
        c.classList.add('loading');
        c.classList.remove('show-spinner');
        spinnerTimer = setTimeout(function() {
          if (c.classList.contains('loading')) c.classList.add('show-spinner');
        }, 200);
      } else {
        c.classList.remove('loading', 'show-spinner');
      }
    }
    
    // =====================================================
    // INIT
    // =====================================================
    
    function init() {
      initVersionDisplay();
      initFocusDock();

      // Add input handler for other reason textarea
      document.getElementById('outOfStockReason').addEventListener('input', function() {
        var hasText = this.value.trim().length > 0;
        document.getElementById('confirmBtn').disabled = !hasText;
      });

      // Forward touch events from footer to scroll container
      var footer = document.querySelector('.restock-footer');
      var scrollContainer = document.getElementById('areasContainer');
      if (footer && scrollContainer) {
        var touchStartY = 0;
        var scrollStartTop = 0;

        footer.addEventListener('touchstart', function(e) {
          // Only handle if touch is on footer padding, not the button
          if (e.target === footer) {
            touchStartY = e.touches[0].clientY;
            scrollStartTop = scrollContainer.scrollTop;
          }
        }, { passive: true });

        footer.addEventListener('touchmove', function(e) {
          if (e.target === footer) {
            var deltaY = touchStartY - e.touches[0].clientY;
            scrollContainer.scrollTop = scrollStartTop + deltaY;
          }
        }, { passive: true });
      }
      
      if (typeof JFCustomWidget !== 'undefined' && JFCustomWidget.subscribe) {
        JFCustomWidget.subscribe('ready', function(data) {
          console.log('[Widget] Ready', data);
          console.log('[Widget] JFCustomWidget methods:', Object.keys(JFCustomWidget));
          // Give the iframe a usable height now rather than after the first render
          try { JFCustomWidget.requestFrameResize({ height: Math.max(document.body.scrollHeight, 600) }); } catch (e) {}
          setLoading(true);
          
          // Cache formID for later use (e.g. reset-to-server)
          var fp = getFormParams();
          cachedFormID = fp.formID || (data && data.formID) || null;

          // Everything below runs once per checklist load. In selector mode it
          // runs again whenever the rig or checklist dropdown changes.
          function startChecklist(data, inventoryOverride) {
          // Load inventory from widget settings — supports inline text
          // or a path to an external .md or .json file on the same GitHub Pages origin.
          // Decode HTML entities first: JotForm encodes setting values
          // (e.g. / becomes &#x2F;) which would break path detection.
          var _rawInventory = inventoryOverride || JFCustomWidget.getWidgetSetting('inventoryItems') || DEFAULT_INVENTORY;
          var _decodeEl = document.createElement('textarea');
          _decodeEl.innerHTML = _rawInventory;
          var inventoryText = _decodeEl.value;
          console.log('[Widget] inventoryItems raw:', JSON.stringify(_rawInventory).substring(0, 120));
          console.log('[Widget] inventoryItems decoded:', JSON.stringify(inventoryText).substring(0, 120));
          console.log('[Widget] isExternalFilePath:', isExternalFilePath(inventoryText));

          function continueAfterInventoryLoad() {
            // Oxygen supply check: the checklist file's oxygenCheck block wins;
            // widget settings only apply on a single-checklist form.
            if (inventoryFileOxygen) {
              configureOxygenCheck(fileOxygenSettingGetter(inventoryFileOxygen));
            } else if (!selectorActive) {
              configureOxygenCheck(function(name) { return JFCustomWidget.getWidgetSetting(name); });
            } else {
              configureOxygenCheck(function() { return undefined; });
            }
            console.log('[Widget] oxygen check:', enableOxygenCheck ? o2Areas.length + ' area(s)' : 'disabled');

            // Custom questions: the file's own, plus the widget setting on a single-checklist form
            customQuestions = normalizeQuestions((selectorActive ? [] : settingQuestionList).concat(inventoryFileQuestions));
            console.log('[Widget] custom questions:', customQuestions.length);

            var focusSetting = JFCustomWidget.getWidgetSetting('focusRow');
            if (focusSetting !== undefined && focusSetting !== null && focusSetting !== '') {
              enableFocusRow = isTruthySetting(focusSetting);
            }
            document.querySelector('.widget-container').classList.toggle('focus-active', enableFocusRow);

            // Derive tagged area support from per-area Sealable: config
            enableTaggedAreas = Object.keys(sealableAreas).length > 0;
            var reviewDay = JFCustomWidget.getWidgetSetting('sealReviewDay');
            if (reviewDay !== undefined && reviewDay !== null && reviewDay !== '') {
              sealReviewDay = Math.max(1, Math.min(31, parseInt(reviewDay, 10) || 0));
            }

            buildUI();

          // Restore saved state: try JotForm value first, then localStorage
          var saved = null;
          var isLocalRestore = false;
          if (data.value) {
            saved = extractSyncData(data.value);
            // A value saved for a different rig or checklist is not ours
            if (saved && selectorActive && (saved.rig !== currentRig || saved.checklist !== currentChecklist)) saved = null;
          }
          if (!saved) {
            saved = loadState();
            if (saved) isLocalRestore = true;
          }
          restoredLocalTs = (isLocalRestore && saved && saved.timestamp) ? saved.timestamp : null;
          if (saved) {
            // Decode HTML entities that Jotform may have injected into keys
            var _decEnt = function(s) { var t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
            var _decKeys = function(o) { if (!o || typeof o !== 'object') return o; var d = {}; for (var k in o) d[_decEnt(k)] = o[k]; return d; };
            if (saved.taggedAreas) saved.taggedAreas = _decKeys(saved.taggedAreas);
            if (saved.itemStates) saved.itemStates = _decKeys(saved.itemStates);
            if (saved.restockStatus) saved.restockStatus = _decKeys(saved.restockStatus);

            if (saved.itemStates) {
              itemStates = saved.itemStates;
            }
            if (saved.taggedAreas) {
              taggedAreas = saved.taggedAreas;
            }
            if (saved.restockStatus) {
              restockStatus = saved.restockStatus;
            }
            if (saved.brokenSeals) {
              brokenSeals = saved.brokenSeals;
            }
            if (saved.o2States && typeof saved.o2States === 'object') {
              o2States = saved.o2States;
            }
            if (saved.questionAnswers && typeof saved.questionAnswers === 'object') {
              // Decode entity-encoded keys and string answers alike
              var _qa = {};
              for (var qk in saved.questionAnswers) {
                var qv = saved.questionAnswers[qk];
                _qa[_decEnt(qk)] = typeof qv === 'string' ? _decEnt(qv) : qv;
              }
              questionAnswers = _qa;
            }
          }

          // Always layer in the dedicated sealed-state store so that seals
          // persist across submissions and across users on the same device,
          // even when the per-submission state above is empty / stale.
          var sealData = loadSealState();
          if (sealData && sealData.taggedAreas) {
            // Use the more recent source for sealed state
            var savedSealTs = (saved && saved.timestamp) || 0;
            var dedicatedSealTs = sealData.timestamp || 0;
            if (dedicatedSealTs >= savedSealTs) {
              taggedAreas = sealData.taggedAreas;
              if (sealData.brokenSeals) {
                brokenSeals = sealData.brokenSeals;
              }
            }
          }

          // Auto-break any seals past the review day
          autoBreakOverdueSeals();

          // Clear item quantities for unsealed areas only on fresh sessions
          // (not same-device refreshes where the user is mid-checklist).
          if (!isLocalRestore) {
            clearUnsealedItemStates();
          }

          buildUI();

          // Capture the seal timestamp BEFORE saveState() overwrites it,
          // so the API fetch comparison uses the real prior value.
          var preSaveSealTs = 0;
          var preSaveSeal = loadSealState();
          if (preSaveSeal) preSaveSealTs = preSaveSeal.timestamp || 0;

          stateReady = true;
          saveState();
          setLoading(false);
          resizeWidget();
          refreshTodayStatus();
          maybeStartSealCheck();

          // ---- Cross-device: fetch sealed state from most recent submission ----
          // Requires the form admin to set a "jotformApiKey" widget setting
          // (a read-only JotForm API key is sufficient).
          var apiKey = JFCustomWidget.getWidgetSetting('jotformApiKey');
          if (apiKey) {
            var apiBase = JFCustomWidget.getWidgetSetting('jotformApiBase') || 'https://api.jotform.com';
            var fp = getFormParams();
            var formID = fp.formID || (data && data.formID) || null;
            var qid = fp.qid || null;
            // Use the timestamp from BEFORE saveState() wrote a fresh one
            var localTs = preSaveSealTs;

            fetchLatestSealState(apiBase, formID, apiKey, qid, function(remote) {
              if (remote && remote.taggedAreas && remote.timestamp > localTs) {
                taggedAreas = remote.taggedAreas;
                if (remote.brokenSeals) brokenSeals = remote.brokenSeals;
                autoBreakOverdueSeals();
                clearUnsealedItemStates();
                buildUI();
                saveSealState();
                resizeWidget();
                maybeStartSealCheck();
              }
            });
          }
          } // end continueAfterInventoryLoad

          // Load optional custom questions (inline JSON or .json path) first,
          // then the inventory. Both may involve a same-origin fetch.
          loadCustomQuestions(JFCustomWidget.getWidgetSetting('customQuestions'), function(settingQuestions) {
            settingQuestionList = settingQuestions || [];

            // Branch: if the setting is an external file path (.md or .json),
            // fetch it async; otherwise parse inline text synchronously.
            if (isExternalFilePath(inventoryText)) {
              fetchInventoryFile(inventoryText, function(fileContent) {
                if (fileContent) {
                  INVENTORY = parseInventoryAuto(fileContent);
                } else {
                  console.warn('[Widget] File fetch failed, falling back to DEFAULT_INVENTORY');
                  INVENTORY = parseInventoryAuto(DEFAULT_INVENTORY);
                }
                continueAfterInventoryLoad();
              });
            } else {
              INVENTORY = parseInventoryAuto(inventoryText);
              continueAfterInventoryLoad();
            }
          });
          } // end startChecklist

          initSelector(data, startChecklist);
        });

        JFCustomWidget.subscribe('submit', function() {
          // Push final report to localStorage for the relay widget
          pushReportToRelay();
          // Build combined value: plain-text report (visible in Tables)
          // followed by sync JSON (for state restoration).
          // extractSyncData() already parses this delimiter format.
          var submitReport = generateSubmitValue();
          // The next opening, here or on another device, asks again whether
          // each seal is still in place: forget that they were seen today
          for (var sealName in taggedAreas) delete taggedAreas[sealName].checkedOn;
          saveSealState();
          var syncData = {
            taggedAreas: taggedAreas,
            brokenSeals: brokenSeals,
            itemStates: itemStates,
            restockStatus: restockStatus,
            o2States: o2States,
            questionAnswers: questionAnswers,
            rig: currentRig,
            checklist: currentChecklist,
            timestamp: Date.now()
          };
          var combinedValue = submitReport.report
            + '\n\n___SYNC_DATA___\n'
            + JSON.stringify(syncData);
          JFCustomWidget.sendSubmit({
            valid: true,
            value: combinedValue
          });

          // Clear per-submission state so the next session starts fresh for
          // item counts, but keep the dedicated sealed-state key intact so
          // seals carry over to the next submission / user.
          try { localStorage.removeItem(getStorageKey()); } catch (e) {}
        });
      } else {
        // Standalone mode - use default inventory
        // (DEFAULT_INVENTORY could also be overridden to a .md/.json path for testing)
        var standaloneText = DEFAULT_INVENTORY;

        // Standalone O2 defaults so the section can be exercised outside Jotform
        var STANDALONE_O2_SETTINGS = {
          enableOxygenCheck: 'true',
          mainO2Cylinders: '2',
          enableMedicalAir: 'true'
        };
        var STANDALONE_QUESTIONS = [
          { label: 'Unit exterior clean?', type: 'yesno', position: 'beforeO2', flagOn: 'No' },
          { label: 'Fuel level', type: 'choice', options: ['Full', '3/4', '1/2', '1/4'], position: 'afterO2' },
          { label: 'Odometer', type: 'number', position: 'afterInventory' },
          { label: 'Notes for next crew', type: 'text', position: 'afterInventory', required: false }
        ];

        function continueStandalone(inventoryContent) {
          INVENTORY = parseInventoryAuto(inventoryContent);
          enableTaggedAreas = Object.keys(sealableAreas).length > 0;
          configureOxygenCheck(function(name) { return STANDALONE_O2_SETTINGS[name]; });
          customQuestions = normalizeQuestions(STANDALONE_QUESTIONS.concat(inventoryFileQuestions));
          document.querySelector('.widget-container').classList.toggle('focus-active', enableFocusRow);
          buildUI();

          // Restore from localStorage in standalone mode
          var saved = loadState();
          if (saved) {
            if (saved.itemStates) itemStates = saved.itemStates;
            if (saved.taggedAreas) taggedAreas = saved.taggedAreas;
            if (saved.restockStatus) restockStatus = saved.restockStatus;
            if (saved.brokenSeals) brokenSeals = saved.brokenSeals;
            if (saved.o2States && typeof saved.o2States === 'object') o2States = saved.o2States;
            if (saved.questionAnswers && typeof saved.questionAnswers === 'object') questionAnswers = saved.questionAnswers;
          }

          // Layer in dedicated sealed-state store
          var sealData = loadSealState();
          if (sealData && sealData.taggedAreas) {
            var savedSealTs = (saved && saved.timestamp) || 0;
            var dedicatedSealTs = sealData.timestamp || 0;
            if (dedicatedSealTs >= savedSealTs) {
              taggedAreas = sealData.taggedAreas;
              if (sealData.brokenSeals) {
                brokenSeals = sealData.brokenSeals;
              }
            }
          }

          autoBreakOverdueSeals();
          clearUnsealedItemStates();

          buildUI();
          stateReady = true;
          saveState();
          setLoading(false);
          maybeStartSealCheck();
        }

        if (isExternalFilePath(standaloneText)) {
          fetchInventoryFile(standaloneText, function(fileContent) {
            continueStandalone(fileContent || DEFAULT_INVENTORY);
          });
        } else {
          continueStandalone(standaloneText);
        }
      }
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
