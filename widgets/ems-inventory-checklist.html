    // =====================================================
    // STATE
    // =====================================================
    
    var itemStates = {}; // key -> { actual: number }
    var restockStatus = {}; // key -> { restocked: bool, outOfStock: bool, reason: string }
    var currentOutOfStockKey = null; // For dialog
    var selectedReason = null; // For dialog reason selection
    var taggedAreas = {}; // areaName -> { taggedDate: 'YYYY-MM-DD', taggedTimestamp: ms }
    var enableTaggedAreas = false;
    var sealReviewDay = 0; // Day of month (1-31) for mandatory expiration review, 0 = disabled
    var categoryMeta = {}; // "area::category" -> { level: 0|1, parent: null|string }
    var collapsedCategories = {}; // "area::category" -> true if collapsed
    var sealableAreas = {}; // areaName -> true if area can be sealed
    var areaHierarchy = {}; // parentAreaName -> [childAreaName, ...]
    var areaParent = {}; // childAreaName -> parentAreaName (chains allowed: a child can hold children)

    // Drop childOf links that point at a missing area or form a loop
    function pruneHierarchy(areas) {
      for (var name in areaParent) {
        var bad = !areas[areaParent[name]];
        var p = areaParent[name], hops = 0;
        while (p && !bad) {
          if (p === name || ++hops > 50) bad = true;
          p = areaParent[p];
        }
        if (bad) {
          var kids = areaHierarchy[areaParent[name]];
          if (kids) {
            var at = kids.indexOf(name);
            if (at !== -1) kids.splice(at, 1);
            if (kids.length === 0) delete areaHierarchy[areaParent[name]];
          }
          delete areaParent[name];
        }
      }
    }

    function areaAncestors(name) {
      var out = [];
      var p = areaParent[name], hops = 0;
      while (p && hops++ < 50) { out.unshift(p); p = areaParent[p]; }
      return out;
    }

    function areaPathLabel(name) {
      return areaAncestors(name).concat([name]).join(' \u203A ');
    }

    function descendantAreas(name) {
      var out = [];
      var kids = areaHierarchy[name] || [];
      for (var i = 0; i < kids.length; i++) {
        out.push(kids[i]);
        out = out.concat(descendantAreas(kids[i]));
      }
      return out;
    }

    function groupNameForDiv(div) {
      if (!div) return null;
      for (var name in areaHierarchy) {
        if (div.id === 'area_group_' + name.replace(/[^a-zA-Z0-9]/g, '_')) return name;
      }
      return null;
    }

    function enclosingGroupDiv(el) {
      return el && el.parentElement ? el.parentElement.closest('.area-group') : null;
    }

    // Expand a group and every group around it, outermost first
    function ensureGroupChainExpanded(groupDiv) {
      var chain = [];
      var g = groupDiv;
      while (g) { chain.unshift(g); g = enclosingGroupDiv(g); }
      for (var i = 0; i < chain.length; i++) {
        if (!chain[i].classList.contains('expanded')) toggleAreaGroup(chain[i]);
      }
    }

    // A group whose content holds an expanded group loses its sticky header
    function markOuterGroups() {
      var groups = document.querySelectorAll('.area-group');
      for (var i = 0; i < groups.length; i++) {
        var outer = groups[i].classList.contains('expanded') && !!groups[i].querySelector('.area-group.expanded');
        groups[i].classList.toggle('outer-group', outer);
      }
    }
    var brokenSeals = []; // [{ area, reason, taggedDate, brokenTimestamp }]
    var stateReady = false; // true after initial state load is complete
    var expandedArea = null; // currently expanded area name (standalone or child)
    var expandedGroup = null; // currently expanded parent group name
    var cachedFormID = null; // formID from JotForm ready event

    // ---- Oxygen supply check (optional, per checklist file) ----
    // The file's oxygenCheck block (true, or an object) switches it on:
    //   mainO2Threshold       Minimum PSI for Main O2 (default: 1500)
    //   mainO2Cylinders       Number of Main O2 cylinders, 1 or 2 (default: 1)
    //   stretcherO2Threshold  Minimum PSI for Stretcher O2 (default: 1000)
    //   medicalAir            true adds a Medical Air cylinder (default: off)
    //   medicalAirThreshold   Minimum PSI for Medical Air (default: 1500)
    var enableOxygenCheck = false;
    var o2Areas = []; // [{ id, name, icon, threshold, unit, cylinderCount }]
    var o2States = {}; // areaId -> { cylinders: { index: true|false|null } }

    // ---- Questions (optional, per checklist file) ----
    // The checklist file's "questions" array.
    // Question: { id?, label, type: yesno|choice|number|text,
    //             position: beforeO2|afterO2|afterInventory,
    //             options?: [..] (choice), required?: true, flagOn?: "No", placeholder?: "" }
    var customQuestions = []; // normalized question list, in display order
    var questionAnswers = {}; // questionId -> answer ('yes'|'no'|option|string)
    var inventoryFileQuestions = []; // raw questions from the inventory JSON envelope
    // Per-checklist oxygen check: { mainO2Threshold, mainO2Cylinders, stretcherO2Threshold, medicalAir, medicalAirThreshold }
    var inventoryFileOxygen = null;

    // ---- Rig / checklist picker ----
    // The widget opens on its own picker: rig tiles from the index file, then
    // that rig's checklists. Setting rigIndex points at another index file;
    // checklistPathTemplate defaults to data/checklists/{rig}/{checklist}.json.
    // Ids are normalised (lower case, spaces to underscores) before being put
    // in the path.
    var selectorActive = false; // true once a rig and checklist are chosen
    var currentRig = null;
    var currentChecklist = null;
    var inventoryTitle = ''; // _meta.name of the loaded checklist file
    var DEFAULT_RIG_INDEX = 'data/checklists/index.json';
    var DEFAULT_PATH_TEMPLATE = 'data/checklists/{rig}/{checklist}.json';
    // Relative paths resolve against the widget's own folder (widgets/), while
    // the data folder sits at the repo root, so the default index is looked
    // for at '', '../' and '../../'; the prefix that works is reused for checklists.
    var defaultPathPrefix = '';
    var pickerActive = false;
    var rigIndexData = null; // { rigs: [{ id, name, checklists: [{ id, name }] }] }
    var pickerStart = null; // startChecklist from the ready handler
    var pickerData = null; // the ready-event data, used for the first load only
    var pickerLoadedOnce = false;
    var todaySubsCache = null; // { ts, list }
    var restoredLocalTs = null; // timestamp of the local state restored this load, if any

    // ---- Focus row ----
    // Setting focusRow: "false" disables the enlarged current-item row (default on)
    var enableFocusRow = true;
    var focusedKey = null; // item key currently enlarged, or null

    // =====================================================
    // LOCAL PERSISTENCE (survives across form sessions)
    // =====================================================

    function getStorageKey(rig, checklist) {
      try {
        // Scope to the widget's iframe src for uniqueness across forms
        var src = window.location.href || '';
        if (src) {
          // Extract a stable identifier from the URL (formID, qid, etc.)
          var match = src.match(/[?&](?:formID|qid)=([^&]+)/);
          if (match) return 'ems_checklist_' + match[1] + selectorKeySuffix(rig, checklist);
        }
      } catch (e) {}
      return 'ems_checklist_state' + selectorKeySuffix(rig, checklist);
    }

    // In selector mode every rig + checklist pair keeps its own state and seals.
    // Pass a pair to get another pair's key (the picker uses this).
    function selectorKeySuffix(rig, checklist) {
      if (rig === undefined) { rig = currentRig; checklist = currentChecklist; }
      if (!selectorActive || !rig || !checklist) return '';
      return '_' + rig + '_' + checklist;
    }

    function saveState() {
      if (!stateReady) return;
      try {
        var state = {
          itemStates: itemStates,
          taggedAreas: taggedAreas,
          restockStatus: restockStatus,
          brokenSeals: brokenSeals,
          o2States: o2States,
          questionAnswers: questionAnswers,
          rig: currentRig,
          checklist: currentChecklist,
          crew: currentCrew,
          timestamp: Date.now()
        };
        localStorage.setItem(getStorageKey(), JSON.stringify(state));
      } catch (e) {
        // localStorage unavailable or quota exceeded
      }
      saveSealState();
      syncToJotForm();
    }

    var STATE_EXPIRY_MS = 4 * 60 * 60 * 1000; // 4 hours

    // The checklist's submission: the readable report, then the sync block.
    // Also forgets that each seal was seen today, so the next opening, here
    // or on another device, asks again whether it is still in place.
    function buildChecklistSubmission() {
      var submitReport = generateSubmitValue();
      for (var sealName in taggedAreas) delete taggedAreas[sealName].checkedOn;
      saveSealState();
      var syncData = {
        taggedAreas: taggedAreas,
        brokenSeals: brokenSeals,
        itemStates: itemStates,
        restockStatus: restockStatus,
        o2States: o2States,
        questionAnswers: questionAnswers,
        rig: currentRig,
        checklist: currentChecklist,
        crew: currentCrew,
        timestamp: Date.now()
      };
      return { value: submitReport + '\n\n___SYNC_DATA___\n' + JSON.stringify(syncData), sync: syncData };
    }

    function loadState() {
      try {
        var stored = localStorage.getItem(getStorageKey());
        if (stored) {
          var parsed = JSON.parse(stored);
          // Expire stale state from abandoned sessions
          if (parsed.timestamp && (Date.now() - parsed.timestamp) > STATE_EXPIRY_MS) {
            localStorage.removeItem(getStorageKey());
            return null;
          }
          return parsed;
        }
      } catch (e) {}
      return null;
    }

    // Dedicated sealed-state persistence — survives across submissions and
    // is shared by every user on the same browser/device (e.g. shared tablet).
    function getSealStorageKey() {
      return getStorageKey() + '_seals';
    }

    function saveSealState() {
      if (!stateReady) return;
      try {
        var sealData = {
          taggedAreas: taggedAreas,
          brokenSeals: brokenSeals,
          timestamp: Date.now()
        };
        localStorage.setItem(getSealStorageKey(), JSON.stringify(sealData));
      } catch (e) {}
    }

    function loadSealState() {
      try {
        var stored = localStorage.getItem(getSealStorageKey());
        if (stored) return JSON.parse(stored);
      } catch (e) {}
      return null;
    }

    // Push current state to JotForm so it survives page refreshes and
    // draft-saves during the same form-filling session.
    function syncToJotForm() {
      if (typeof JFCustomWidget !== 'undefined' && JFCustomWidget.sendData) {
        try {
          var state = {
            itemStates: itemStates,
            taggedAreas: taggedAreas,
            restockStatus: restockStatus,
            brokenSeals: brokenSeals,
            o2States: o2States,
            questionAnswers: questionAnswers,
            rig: currentRig,
            checklist: currentChecklist,
            crew: currentCrew,
            timestamp: Date.now()
          };
          // Prepend plain-text report so it's visible in JotForm Tables.
          // extractSyncData() parses the delimiter to restore state.
          var combinedValue = generateSubmitValue()
            + '\n\n___SYNC_DATA___\n'
            + JSON.stringify(state);
          JFCustomWidget.sendData({ value: combinedValue });
        } catch (e) {}
      }
    }

    // Push the human-readable report to localStorage so the report-relay
    // widget (same origin, same form) can pick it up and submit it as its
    // own field value.  Key is scoped to formID for uniqueness.

    //  (a) pure JSON (old format / draft saves via syncToJotForm),
    //  (b) plain-text report with ___SYNC_DATA___ delimiter (current format), or
    //  (c) HTML with <!--__SYNC__:--> comment (legacy), or
    //  (d) plain text with __SYNC__ marker (transitional format).
    //  (c) HTML report with sync data in an HTML comment.
    // Returns the parsed data object, or null on failure.
    // JSON.parse that also copes with Jotform entity-encoding the text
    function parseJsonLoose(text) {
      try { return JSON.parse(text); } catch (e) {}
      try {
        var t = document.createElement('textarea');
        t.innerHTML = text;
        return JSON.parse(t.value);
      } catch (e2) {}
      return null;
    }

    function extractSyncData(raw) {
      if (!raw || typeof raw !== 'string') return null;
      // Try pure JSON first (old format / draft saves)
      try { return JSON.parse(raw); } catch (e) {}
      // Current format: plain-text delimiter (immune to entity encoding)
      var syncMarker = '\n\n___SYNC_DATA___\n';
      var si = raw.indexOf(syncMarker);
      if (si !== -1) {
        var parsedLoose = parseJsonLoose(raw.substring(si + syncMarker.length));
        if (parsedLoose) return parsedLoose;
      }
      // Legacy: HTML comment format (may appear raw or entity-encoded)
      var commentVariants = ['<!--__SYNC__:', '&lt;!--__SYNC__:'];
      var endVariants = ['-->', '--&gt;'];
      for (var v = 0; v < commentVariants.length; v++) {
        var ci = raw.indexOf(commentVariants[v]);
        if (ci !== -1) {
          for (var ev = 0; ev < endVariants.length; ev++) {
            var ce = raw.indexOf(endVariants[ev], ci);
            if (ce !== -1) {
              try { return JSON.parse(raw.substring(ci + commentVariants[v].length, ce)); } catch (e) {}
            }
          }
        }
      }
      // Legacy: plain text marker (transitional)
      var marker = '\n__SYNC__\n';
      var idx = raw.indexOf(marker);
      if (idx !== -1) {
        try { return JSON.parse(raw.substring(idx + marker.length)); } catch (e) {}
      }
      return null;
    }

    // =====================================================
    // CROSS-DEVICE PERSISTENCE (JotForm Submissions API)
    // =====================================================

    // Extract formID and qid from the widget iframe URL.
    function getFormParams() {
      var params = { formID: null, qid: null };
      try {
        var src = window.location.href || '';
        var fMatch = src.match(/[?&]formID=([^&]+)/);
        var qMatch = src.match(/[?&]qid=([^&]+)/);
        if (fMatch) params.formID = fMatch[1];
        if (qMatch) params.qid = qMatch[1];
      } catch (e) {}
      return params;
    }

    // Fetch the sealed state from the most recent JotForm submission so that
    // seals persist across devices and browsers.  Requires the form admin to
    // add a "jotformApiKey" widget setting. Reading needs a read-only key;
    // logging supplies used on a call writes a submission, so a full-access
    // key is needed for that.
    function fetchLatestSealState(apiBase, formID, apiKey, qid, callback) {
      if (!formID || !apiKey) { callback(null); return; }
      var url = apiBase + '/form/' + encodeURIComponent(formID)
              + '/submissions?apiKey=' + encodeURIComponent(apiKey)
              + '&limit=' + (selectorActive ? 50 : 1) + '&orderby=id&direction=desc';
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.timeout = 5000;
        xhr.onload = function () {
          if (xhr.status !== 200) { callback(null); return; }
          try {
            var resp = JSON.parse(xhr.responseText);
            if (!resp.content || resp.content.length === 0) { callback(null); return; }
            var sub = selectorActive ? findSubmissionForSelection(resp.content) : resp.content[0];
            if (!sub) { callback(null); return; }
            var answers = sub.answers || {};
            var raw = null;

            // Prefer the exact question id when available.
            if (qid && answers[qid]) {
              raw = answers[qid].answer;
            }
            // Fallback: scan every answer for one that looks like our widget value.
            if (!raw) {
              for (var k in answers) {
                var a = answers[k].answer;
                if (typeof a === 'string' && a.indexOf('taggedAreas') !== -1) {
                  raw = a; break;
                }
              }
            }
            if (!raw) { callback(null); return; }

            var parsed = extractSyncData(raw);
            if (!parsed) { callback(null); return; }

            // Jotform may HTML-entity-encode submission values (e.g. -> becomes -&gt;).
            // Decode so that keys match the original inventory area names.
            var decodeEntities = function(str) {
              var txt = document.createElement('textarea');
              txt.innerHTML = str;
              return txt.value;
            };
            var decodeParsedKeys = function(obj) {
              if (!obj || typeof obj !== 'object') return obj;
              var decoded = {};
              for (var k in obj) {
                decoded[decodeEntities(k)] = obj[k];
              }
              return decoded;
            };
            if (parsed.taggedAreas) parsed.taggedAreas = decodeParsedKeys(parsed.taggedAreas);
            if (parsed.itemStates) parsed.itemStates = decodeParsedKeys(parsed.itemStates);
            if (parsed.restockStatus) parsed.restockStatus = decodeParsedKeys(parsed.restockStatus);

            // Side effect: remember gauge readings from the last submission
            if (parsed.itemStates) capturePreviousReadings(parsed.itemStates, parsed.timestamp || 0);

            var taggedKeys = parsed.taggedAreas ? Object.keys(parsed.taggedAreas) : [];
            if (parsed && parsed.taggedAreas && taggedKeys.length > 0) {
              callback({
                taggedAreas: parsed.taggedAreas,
                brokenSeals: parsed.brokenSeals || [],
                timestamp: parsed.timestamp || 0
              });
              return;
            }
          } catch (e) {}
          callback(null);
        };
        xhr.onerror = function () { callback(null); };
        xhr.ontimeout = function () { callback(null); };
        xhr.send();
      } catch (e) { callback(null); }
    }

    // =====================================================
    // PARSE INVENTORY FROM SETTINGS
    // =====================================================

    // Parses the JSON inventory format into the same internal structure as
    // parseInventory(). JSON schema:
    // [ { area, sealable?, childOf?, categories: [ { name, items: [{name, qty, group?}] } ] } ]
    function parseInventoryJSON(jsonArray) {
      var result = {};
      categoryMeta = {};
      sealableAreas = {};
      areaHierarchy = {};
      areaParent = {};

      for (var a = 0; a < jsonArray.length; a++) {
        var areaObj = jsonArray[a];
        var areaName = areaObj.area;
        if (!areaName) continue;

        if (!result[areaName]) {
          result[areaName] = {};
        }

        // Sealable flag
        if (areaObj.sealable) {
          sealableAreas[areaName] = true;
        }

        // Parent-child hierarchy (flat childOf reference)
        if (areaObj.childOf) {
          var parentName = areaObj.childOf;
          areaParent[areaName] = parentName;
          if (!areaHierarchy[parentName]) {
            areaHierarchy[parentName] = [];
          }
          areaHierarchy[parentName].push(areaName);
        }

        var categories = areaObj.categories || [];
        for (var c = 0; c < categories.length; c++) {
          var catObj = categories[c];
          var catName = catObj.name || 'General';

          // Register top-level category (JSON)
          if (!result[areaName][catName]) {
            result[areaName][catName] = [];
          }
          categoryMeta[areaName + '::' + catName] = { level: 0, parent: null };

          // Add category items — items with a group field go into a sub-category
          var items = catObj.items || [];
          for (var i = 0; i < items.length; i++) {
            var itemObj = items[i];
            var targetCat = catName;

            if (itemObj.group) {
              // Create a qualified sub-category for the group
              var qualifiedName = catName + ' > ' + itemObj.group;
              if (!result[areaName][qualifiedName]) {
                result[areaName][qualifiedName] = [];
              }
              if (!categoryMeta[areaName + '::' + qualifiedName]) {
                categoryMeta[areaName + '::' + qualifiedName] = { level: 1, parent: catName, displayName: itemObj.group };
              }
              targetCat = qualifiedName;
            }

            var entry = { name: itemObj.name, required: itemObj.qty || 1 };
            if (itemObj.type === 'gauge') {
              // A gauge is "complete" once a reading is recorded (actual 1 of 1)
              entry.type = 'gauge';
              entry.required = 1;
              entry.gauge = normalizeGaugeConfig(itemObj);
            } else if (itemObj.type === 'check') {
              // A check is "complete" once answered, working or faulty
              entry.type = 'check';
              entry.required = 1;
              entry.check = {
                oos: isTruthySetting(itemObj.oos),
                okText: itemObj.okText ? String(itemObj.okText) : 'Working',
                failText: itemObj.failText ? String(itemObj.failText) : 'Faulty',
                failNote: itemObj.failNote ? String(itemObj.failNote) : null
              };
            }
            result[areaName][targetCat].push(entry);
          }
        }
      }

      pruneHierarchy(result);
      return result;
    }

    // Auto-detects format (JSON array vs markdown text) and parses accordingly.
    // The checklist envelope: { _meta, oxygenCheck?, questions?, areas } (a bare
    // areas array is accepted too). Fills the file-level state and returns the
    // INVENTORY map.
    function applyInventoryEnvelope(parsed) {
      inventoryFileQuestions = [];
      inventoryFileOxygen = null;
      inventoryTitle = '';
      var jsonArray = null;
      if (Array.isArray(parsed)) {
        jsonArray = parsed;
      } else if (parsed && Array.isArray(parsed.areas)) {
        jsonArray = parsed.areas;
        if (parsed._meta && parsed._meta.name) inventoryTitle = String(parsed._meta.name);
        if (Array.isArray(parsed.questions)) inventoryFileQuestions = parsed.questions;
        if (parsed.oxygenCheck === true) inventoryFileOxygen = {};
        else if (parsed.oxygenCheck && typeof parsed.oxygenCheck === 'object') inventoryFileOxygen = parsed.oxygenCheck;
      }
      if (!jsonArray) {
        console.warn('[Widget] checklist is not a JSON envelope or areas array');
        jsonArray = [];
      }
      console.log('[Widget] checklist: ' + jsonArray.length + ' areas');
      return parseInventoryJSON(jsonArray);
    }

    // A fetched checklist file's text (Jotform may entity-encode it on the way).
    function parseInventoryText(content) {
      return applyInventoryEnvelope(parseJsonLoose(String(content || '').trim()));
    }

    // =====================================================
    // EXTERNAL FILE FETCH
    // =====================================================

    // Derives the base URL from the widget's own location so relative paths
    // like "data/checklists/602/bags.json" resolve correctly on GitHub Pages.
    function getWidgetBaseUrl() {
      var href = window.location.href.split('?')[0]; // strip query params
      return href.substring(0, href.lastIndexOf('/') + 1);
    }

    // Fetches a checklist (or index) file, then calls back with the text
    // content; null on failure.
    function fetchInventoryFile(filePath, callback) {
      var trimmed = filePath.trim();
      // If it's already a full URL, use it directly; otherwise resolve relative to widget
      var url = /^https?:\/\//i.test(trimmed) ? trimmed : getWidgetBaseUrl() + trimmed;
      console.log('[Widget] Fetching checklist from: ' + url);

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
          console.log('[Widget] Checklist fetched (' + xhr.responseText.length + ' chars)');
          callback(xhr.responseText);
        } else {
          console.warn('[Widget] Checklist fetch failed: HTTP ' + xhr.status + ' for ' + url);
          callback(null);
        }
      };
      xhr.onerror = function() {
        console.warn('[Widget] Checklist fetch network error for ' + url);
        callback(null);
      };
      xhr.send();
    }

    // =====================================================
    // BUILD UI
    // =====================================================
    
    function generateKey(areaName, categoryName, itemName) {
      return areaName + '::' + categoryName + '::' + itemName;
    }

    function buildItemRow(areaName, catName, item) {
      var key = generateKey(areaName, catName, item.name);

      if (!itemStates[key]) {
        itemStates[key] = { actual: 0 };
      }

      var itemDiv = document.createElement('div');
      itemDiv.className = 'checklist-item';
      itemDiv.id = 'item_' + key.replace(/[^a-zA-Z0-9]/g, '_');
      itemDiv.setAttribute('data-key', key);

      if (item.type === 'gauge' || item.type === 'check') {
        if (item.type === 'gauge') buildGaugeRow(itemDiv, key, item);
        else buildCheckRow(itemDiv, key, item);
        if (enableFocusRow && focusedKey === key) itemDiv.classList.add('focused');
        return itemDiv;
      }

      var actual = itemStates[key].actual;
      var status = restockStatus[key] || {};
      var isRestocked = status.restocked && actual < item.required;
      var isOutOfStock = status.outOfStock && actual < item.required;

      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'item-checkbox';
      checkbox.checked = actual >= item.required || isRestocked || isOutOfStock;
      checkbox.onchange = (function(k, req) {
        return function() { setItemValue(k, this.checked ? req : 0); };
      })(key, item.required);

      var infoDiv = document.createElement('div');
      infoDiv.className = 'item-info';
      infoDiv.innerHTML = '<div class="item-name">' + escapeHtml(item.name) + '</div>';
      var usedOnCall = itemStates[key] && itemStates[key].usedOnCall;
      if (usedOnCall) {
        infoDiv.innerHTML += '<div class="item-note">' + usedOnCall + ' used on a call</div>';
      }

      // Tapping anywhere on the row (not a control) moves the focus here
      itemDiv.onclick = (function(k) {
        return function(e) {
          if (e.target.closest && e.target.closest('.qty-stepper, .item-checkbox, .restocked-tag, .out-of-stock-tag, button, input')) return;
          setFocusedItem(k, false);
        };
      })(key);

      var countEl = document.createElement('span');
      countEl.className = 'item-count';
      countEl.textContent = countText(actual, item.required, itemPending(key));
      if (itemPending(key)) itemDiv.classList.add('pending');

      var reqLabel = document.createElement('span');
      reqLabel.className = 'item-required';
      reqLabel.textContent = '×' + item.required;

      itemDiv.appendChild(checkbox);
      itemDiv.appendChild(infoDiv);
      itemDiv.appendChild(countEl);
      itemDiv.appendChild(reqLabel);

      if (isRestocked) {
        // Show restocked tag instead of stepper
        var shortage = item.required - actual;
        var restockedTag = document.createElement('div');
        restockedTag.className = 'restocked-tag';
        restockedTag.innerHTML = '<span>Restocked</span><span class="restocked-qty">(×' + shortage + ')</span>';
        
        var removeBtn = document.createElement('button');
        removeBtn.className = 'restocked-remove';
        removeBtn.innerHTML = '×';
        removeBtn.onclick = (function(k) {
          return function(e) {
            e.stopPropagation();
            removeRestockedFromChecklist(k);
          };
        })(key);
        restockedTag.appendChild(removeBtn);
        
        itemDiv.appendChild(restockedTag);
        itemDiv.classList.add('restocked');
      } else if (isOutOfStock) {
        // Show out-of-stock tag instead of stepper
        var shortage = item.required - actual;
        var outOfStockTag = document.createElement('div');
        outOfStockTag.className = 'out-of-stock-tag';
        outOfStockTag.innerHTML = '<span>Out of Stock</span><span class="restocked-qty">(×' + shortage + ')</span>';
        
        var removeBtn = document.createElement('button');
        removeBtn.className = 'out-of-stock-remove';
        removeBtn.innerHTML = '×';
        removeBtn.onclick = (function(k) {
          return function(e) {
            e.stopPropagation();
            removeRestockedFromChecklist(k);
          };
        })(key);
        outOfStockTag.appendChild(removeBtn);
        
        itemDiv.appendChild(outOfStockTag);
        itemDiv.classList.add('out-of-stock-item');
      } else {
        // Show normal stepper
        var stepperDiv = document.createElement('div');
        stepperDiv.className = 'qty-stepper';

        var decBtn = document.createElement('button');
        decBtn.className = 'qty-btn';
        decBtn.textContent = '-';
        decBtn.onclick = (function(k) {
          return function() { adjustItem(k, -1); };
        })(key);

        var valueInput = document.createElement('input');
        valueInput.type = 'number';
        valueInput.className = 'qty-value';
        valueInput.value = actual;
        valueInput.min = '0';
        valueInput.max = item.required;
        valueInput.id = 'input_' + key.replace(/[^a-zA-Z0-9]/g, '_');
        valueInput.onchange = (function(k) {
          return function() { setItemValue(k, parseInt(this.value) || 0); };
        })(key);

        var incBtn = document.createElement('button');
        incBtn.className = 'qty-btn';
        incBtn.textContent = '+';
        incBtn.onclick = (function(k) {
          return function() { adjustItem(k, 1); };
        })(key);

        stepperDiv.appendChild(decBtn);
        stepperDiv.appendChild(valueInput);
        stepperDiv.appendChild(incBtn);
        itemDiv.appendChild(stepperDiv);

        // Apply appropriate class based on state
        if (actual >= item.required) {
          itemDiv.classList.add('checked');
        } else if (actual > 0) {
          itemDiv.classList.add('short');
        } else {
          itemDiv.classList.add('missing');
        }
      }

      // Keep the focus row through row rebuilds
      if (enableFocusRow && focusedKey === key) itemDiv.classList.add('focused');

      return itemDiv;
    }

    // An item not yet counted shows the full amount it should have; the
    // count is only marked once the crew confirms or adjusts it
    function countText(actual, required, pending) {
      if (pending) return required + ' of ' + required;
      return (actual >= required ? '\u2713 ' : '') + actual + ' of ' + required;
    }

    function itemPending(key) {
      var st = itemStates[key];
      return !(st && st.touched) && !(st && st.actual);
    }

    function refreshRowCount(key) {
      var parts = key.split('::');
      var item = findItem(parts[0], parts[1], parts[2]);
      var itemDiv = document.getElementById('item_' + key.replace(/[^a-zA-Z0-9]/g, '_'));
      if (!item || !itemDiv) return;
      var countEl = itemDiv.querySelector('.item-count');
      if (countEl) countEl.textContent = countText((itemStates[key] || { actual: 0 }).actual, item.required, itemPending(key));
      itemDiv.classList.toggle('pending', itemPending(key));
    }

    // Remove restocked designation from checklist
    function removeRestockedFromChecklist(key) {
      delete restockStatus[key];
      updateAllStatuses();
      updateSummary();
      // Rebuild the affected item row
      var parts = key.split('::');
      var areaName = parts[0];
      var catName = parts[1];
      var itemName = parts[2];
      var item = findItem(areaName, catName, itemName);
      if (item) {
        var itemDiv = document.getElementById('item_' + key.replace(/[^a-zA-Z0-9]/g, '_'));
        if (itemDiv) {
          var newRow = buildItemRow(areaName, catName, item);
          itemDiv.parentNode.replaceChild(newRow, itemDiv);
        }
        advanceFocus(key, false);
      }
    }

    function buildUI() {
      var container = document.getElementById('areasContainer');
      container.innerHTML = '';

      // "Before you start": questions before O2, the O2 check and questions
      // after O2 live in one collapsible block ahead of the inventory areas.
      // Questions after the inventory follow the areas.
      var pre = document.createElement('div');
      pre.className = 'area-group pre-group';
      pre.id = 'pre_group';
      var preHeader = document.createElement('div');
      preHeader.className = 'area-header';
      preHeader.innerHTML = '<span class="collapse-icon">\u25B6</span>' +
        '<span class="area-title">Before you start</span>' +
        '<span class="area-status" id="status_pre_group">0/0</span>' +
        '<span class="progress-strip"><span class="progress-fill"></span></span>';
      preHeader.onclick = function() { toggleAreaGroup(pre); };
      var preContent = document.createElement('div');
      preContent.className = 'area-group-content pre-content';
      buildQuestionSections(preContent, 'beforeO2');
      buildOxygenSection(preContent);
      buildQuestionSections(preContent, 'afterO2');
      if (preContent.children.length > 0) {
        pre.appendChild(preHeader);
        pre.appendChild(preContent);
        container.appendChild(pre);
        // The section headers were built while detached; fill their chips now
        for (var oi = 0; oi < o2Areas.length; oi++) applyO2Header(o2Areas[oi].id);
        for (var qi = 0; qi < customQuestions.length; qi++) {
          if (customQuestions[qi].position !== 'afterInventory') applyQuestionHeader(customQuestions[qi]);
        }
      }

      // Areas render in file order; a parent renders as a group with its
      // children (groups or plain areas) inside.
      var rendered = {}; // track which areas have been rendered

      function buildNode(areaName) {
        var kids = areaHierarchy[areaName];
        if (kids && kids.length > 0) return buildParentGroup(areaName, kids);
        return buildAreaSection(areaName);
      }

      // Helper: build a single area section (used for both standalone and child areas)
      function buildAreaSection(areaName) {
        var areaDiv = document.createElement('div');
        areaDiv.className = 'area-section';
        areaDiv.id = 'area_' + areaName.replace(/[^a-zA-Z0-9]/g, '_');

        // Area header
        var headerDiv = document.createElement('div');
        headerDiv.className = 'area-header';
        headerDiv.innerHTML = '<span class="collapse-icon">▶</span>' +
          '<span class="area-title">' + escapeHtml(areaName) + '</span>' +
          '<span class="area-status" id="status_' + areaDiv.id + '">0/0</span>' +
          '<span class="progress-strip"><span class="progress-fill"></span></span>';

        headerDiv.onclick = (function(div, isChild) {
          return function() { toggleArea(div, isChild); };
        })(areaDiv, !!areaParent[areaName]);

        areaDiv.appendChild(headerDiv);

        // Area content
        var contentDiv = document.createElement('div');
        contentDiv.className = 'area-content';

        if (taggedAreas[areaName]) {
          // Render tagged/sealed panel instead of items
          var tagInfo = taggedAreas[areaName];
          var daysSince = daysSinceTagged(tagInfo.taggedTimestamp);
          var reviewNeeded = isReviewOverdue(tagInfo.taggedTimestamp);

          var panel = document.createElement('div');
          panel.className = 'tagged-panel' + (reviewNeeded ? ' review-needed' : '');

          var panelHtml = '';
          if (reviewNeeded) {
            panelHtml += '<div class="seal-icon">&#9888;</div>';
            panelHtml += '<div class="seal-title">EXPIRATION REVIEW NEEDED</div>';
          } else {
            panelHtml += '<div class="seal-icon">&#x1F512;</div>';
            panelHtml += '<div class="seal-title">AREA SEALED</div>';
          }

          panelHtml += '<div class="seal-date">Tagged: ' + formatTagDate(tagInfo.taggedDate) + '</div>';
          panelHtml += '<div class="seal-days">Sealed for ' + daysSince + ' day' + (daysSince !== 1 ? 's' : '') + '</div>';

          if (reviewNeeded) {
            panelHtml += '<div class="seal-expired-warning">Monthly review was due on the ' + sealReviewDay + getOrdinalSuffix(sealReviewDay) + '. Break seal to review expiration dates of contents.</div>';
          } else if (sealReviewDay > 0) {
            var nextReview = getNextReviewDate();
            if (nextReview) {
              panelHtml += '<div class="seal-warning">Next expiration review: ' + formatTagDate(nextReview.toISOString().split('T')[0]) + '</div>';
            }
          }

          var escapedName = escapeHtml(areaName).replace(/'/g, "\\'");
          panelHtml += '<div class="seal-actions">';
          panelHtml += '<button class="break-seal-btn" onclick="breakSeal(\'' + escapedName + '\', \'review\')">Break Seal &amp; Review</button>';
          panelHtml += '<button class="seal-missing-btn" onclick="breakSeal(\'' + escapedName + '\', \'missing\')">Seal is Missing</button>';
          panelHtml += '</div>';

          panel.innerHTML = panelHtml;
          contentDiv.appendChild(panel);

          // Still initialize itemStates keys for tagged areas
          var categories = INVENTORY[areaName];
          for (var catName in categories) {
            var items = categories[catName];
            for (var i = 0; i < items.length; i++) {
              var key = generateKey(areaName, catName, items[i].name);
              if (!itemStates[key]) {
                itemStates[key] = { actual: items[i].required };
              }
            }
          }
        } else {
          // Normal rendering: collapsible categories with optional subcategories
          var categories = INVENTORY[areaName];

          // Group categories into top-level and subcategories
          var catOrder = [];
          var catChildren = {};
          for (var catName in categories) {
            var metaKey = areaName + '::' + catName;
            var meta = categoryMeta[metaKey] || { level: 0, parent: null };
            if (meta.level === 0) {
              catOrder.push(catName);
              if (!catChildren[catName]) catChildren[catName] = [];
            } else if (meta.parent) {
              if (!catChildren[meta.parent]) catChildren[meta.parent] = [];
              catChildren[meta.parent].push(catName);
            }
          }

          var loneCat = loneCategoryOf(areaName);
          for (var ci = 0; ci < catOrder.length; ci++) {
            var catName = catOrder[ci];
            var catItems = categories[catName] || [];
            var subCats = catChildren[catName] || [];
            var catKey = areaName + '::' + catName;
            // The lone category has no header of its own and never folds: the area does that.
            var isLone = catName === loneCat;
            var isCollapsed = !isLone && (collapsedCategories[catKey] || false);

            // Category header (collapsible)
            var catHeader = document.createElement('div');
            catHeader.className = 'category-header';
            catHeader.onclick = (function(area, cat) {
              return function(e) {
                if (e.target.classList.contains('category-checkbox')) return;
                toggleCategoryCollapse(area, cat);
              };
            })(areaName, catName);

            var collapseIcon = document.createElement('span');
            collapseIcon.className = 'category-collapse-icon';
            collapseIcon.id = 'cat_icon_' + catKey.replace(/[^a-zA-Z0-9]/g, '_');
            collapseIcon.textContent = '\u25B6';
            collapseIcon.style.transform = isCollapsed ? 'rotate(0deg)' : 'rotate(90deg)';

            var catCheckbox = document.createElement('input');
            catCheckbox.type = 'checkbox';
            catCheckbox.className = 'category-checkbox';
            catCheckbox.onclick = (function(area, cat, subs) {
              return function(e) {
                e.stopPropagation();
                var isChecked = this.checked;
                // Batch: set all items for parent category + subcategories
                var allCats = [cat].concat(subs);
                for (var c = 0; c < allCats.length; c++) {
                  var catItems = INVENTORY[area][allCats[c]];
                  if (!catItems) continue;
                  for (var i = 0; i < catItems.length; i++) {
                    var key = generateKey(area, allCats[c], catItems[i].name);
                    setItemValue(key, isChecked ? catItems[i].required : 0, true);
                  }
                }

                // Explicitly sync all subcategory checkboxes
                for (var s = 0; s < subs.length; s++) {
                  var subStatusId = 'cat_status_' + generateKey(area, subs[s], '').replace(/[^a-zA-Z0-9]/g, '_');
                  var subStatusEl = document.getElementById(subStatusId);
                  if (subStatusEl && subStatusEl.parentElement) {
                    var subCb = subStatusEl.parentElement.querySelector('.category-checkbox');
                    if (subCb) subCb.checked = isChecked;
                  }
                }

                updateAllStatuses();
                updateSummary();

                if (isChecked) {
                  autoCategoryAdvance(area, cat);
                  checkForCompletion();
                } else {
                  // Reopen so user can see unchecked items
                  var catKey = area + '::' + cat;
                  collapsedCategories[catKey] = false;
                  var itemsDiv = document.getElementById('cat_items_' + catKey.replace(/[^a-zA-Z0-9]/g, '_'));
                  if (itemsDiv) itemsDiv.style.display = 'block';
                  var icon = document.getElementById('cat_icon_' + catKey.replace(/[^a-zA-Z0-9]/g, '_'));
                  if (icon) icon.style.transform = 'rotate(90deg)';
                }
                advanceFocus(null, false);
              };
            })(areaName, catName, subCats);

            var catLabel = document.createElement('span');
            catLabel.textContent = catName;

            var catStatus = document.createElement('span');
            catStatus.className = 'category-status';
            catStatus.id = 'cat_status_' + generateKey(areaName, catName, '').replace(/[^a-zA-Z0-9]/g, '_');

            if (isLone) {
              // No category row: the "all" pill goes on the area header, before its count.
              // The area's own status update keeps it in step (see updateAllStatuses).
              var areaStatusEl = headerDiv.querySelector('.area-status');
              headerDiv.insertBefore(catCheckbox, areaStatusEl);
            } else {
              catHeader.appendChild(collapseIcon);
              catHeader.appendChild(catCheckbox);
              catHeader.appendChild(catLabel);
              catHeader.appendChild(catStatus);
              catHeader.appendChild(makeProgressStrip());
              contentDiv.appendChild(catHeader);
            }

            // Items container (collapsible; the lone category's has no id, so nothing folds it)
            var itemsContainer = document.createElement('div');
            itemsContainer.className = 'category-items' + (isLone ? ' lone-category' : '');
            if (!isLone) itemsContainer.id = 'cat_items_' + catKey.replace(/[^a-zA-Z0-9]/g, '_');
            itemsContainer.style.display = isCollapsed ? 'none' : 'block';

            // Direct items for this category
            for (var i = 0; i < catItems.length; i++) {
              itemsContainer.appendChild(buildItemRow(areaName, catName, catItems[i]));
            }

            // Subcategories - append directly to contentDiv for sticky positioning to work
            for (var si = 0; si < subCats.length; si++) {
              var subCatName = subCats[si];
              var subCatItems = categories[subCatName] || [];
              var subCatKey = areaName + '::' + subCatName;
              var isSubCollapsed = collapsedCategories[subCatKey] || false;

              // Subcategory header
              var subHeader = document.createElement('div');
              subHeader.className = 'subcategory-header';
              subHeader.onclick = (function(area, sub) {
                return function(e) {
                  if (e.target.classList.contains('category-checkbox')) return;
                  toggleCategoryCollapse(area, sub);
                };
              })(areaName, subCatName);

              var subIcon = document.createElement('span');
              subIcon.className = 'category-collapse-icon';
              subIcon.id = 'cat_icon_' + subCatKey.replace(/[^a-zA-Z0-9]/g, '_');
              subIcon.textContent = '\u25B6';
              subIcon.style.transform = isSubCollapsed ? 'rotate(0deg)' : 'rotate(90deg)';

              var subCheckbox = document.createElement('input');
              subCheckbox.type = 'checkbox';
              subCheckbox.className = 'category-checkbox';
              subCheckbox.onclick = (function(area, sub) {
                return function(e) {
                  e.stopPropagation();
                  toggleCategory(area, sub, this.checked);
                };
              })(areaName, subCatName);

              var subLabel = document.createElement('span');
              var subDisplayMeta = categoryMeta[areaName + '::' + subCatName];
              subLabel.textContent = (subDisplayMeta && subDisplayMeta.displayName) || subCatName;

              var subStatus = document.createElement('span');
              subStatus.className = 'category-status';
              subStatus.id = 'cat_status_' + generateKey(areaName, subCatName, '').replace(/[^a-zA-Z0-9]/g, '_');

              subHeader.appendChild(subIcon);
              subHeader.appendChild(subCheckbox);
              subHeader.appendChild(subLabel);
              subHeader.appendChild(subStatus);
              subHeader.appendChild(makeProgressStrip());
              itemsContainer.appendChild(subHeader);

              // Subcategory items container
              var subItemsContainer = document.createElement('div');
              subItemsContainer.className = 'subcategory-items';
              subItemsContainer.id = 'cat_items_' + subCatKey.replace(/[^a-zA-Z0-9]/g, '_');
              subItemsContainer.style.display = isSubCollapsed ? 'none' : 'block';

              for (var j = 0; j < subCatItems.length; j++) {
                subItemsContainer.appendChild(buildItemRow(areaName, subCatName, subCatItems[j]));
              }
              itemsContainer.appendChild(subItemsContainer);
            }

            contentDiv.appendChild(itemsContainer);
          }

          // Add "Seal This Area" button if this area is marked sealable
          // Skip for parent areas with children — they get a seal button in buildParentGroup instead
          if (sealableAreas[areaName] && !areaHierarchy[areaName]) {
            var tagBtn = document.createElement('button');
            tagBtn.className = 'tag-area-btn';
            tagBtn.id = 'tag_btn_' + areaName.replace(/[^a-zA-Z0-9]/g, '_');
            tagBtn.style.display = 'none';
            tagBtn.textContent = 'Seal This Area';
            tagBtn.onclick = (function(name) {
              return function(e) {
                e.stopPropagation();
                tagArea(name);
              };
            })(areaName);
            contentDiv.appendChild(tagBtn);
          }
        }

        areaDiv.appendChild(contentDiv);
        return areaDiv;
      }

      // Build a parent area group containing its child areas
      function buildParentGroup(parentName, children) {
        var groupDiv = document.createElement('div');
        groupDiv.className = 'area-group';
        groupDiv.id = 'area_group_' + parentName.replace(/[^a-zA-Z0-9]/g, '_');

        // Parent header
        var headerDiv = document.createElement('div');
        headerDiv.className = 'area-header';
        var pathHtml = areaParent[parentName]
          ? '<span class="area-path">' + escapeHtml(areaAncestors(parentName).join(' \u203A ')) + '</span>'
          : '';
        headerDiv.innerHTML = '<span class="collapse-icon">▶</span>' +
          '<span class="area-title">' + escapeHtml(parentName) + pathHtml + '</span>' +
          '<span class="area-status" id="status_group_' + parentName.replace(/[^a-zA-Z0-9]/g, '_') + '">0/0</span>';

        headerDiv.onclick = (function(div) {
          return function() { toggleAreaGroup(div); };
        })(groupDiv);

        groupDiv.appendChild(headerDiv);

        // Content
        var contentDiv = document.createElement('div');
        contentDiv.className = 'area-group-content';

        if (taggedAreas[parentName]) {
          // Parent is sealed — show sealed panel for parent, but still show child areas
          var tagInfo = taggedAreas[parentName];
          var daysSince = daysSinceTagged(tagInfo.taggedTimestamp);
          var reviewNeeded = isReviewOverdue(tagInfo.taggedTimestamp);

          var panel = document.createElement('div');
          panel.className = 'tagged-panel' + (reviewNeeded ? ' review-needed' : '');

          var panelHtml = '';
          if (reviewNeeded) {
            panelHtml += '<div class="seal-icon">&#9888;</div>';
            panelHtml += '<div class="seal-title">EXPIRATION REVIEW NEEDED</div>';
          } else {
            panelHtml += '<div class="seal-icon">&#x1F512;</div>';
            panelHtml += '<div class="seal-title">AREA SEALED</div>';
          }

          panelHtml += '<div class="seal-date">Tagged: ' + formatTagDate(tagInfo.taggedDate) + '</div>';
          panelHtml += '<div class="seal-days">Sealed for ' + daysSince + ' day' + (daysSince !== 1 ? 's' : '') + '</div>';

          if (reviewNeeded) {
            panelHtml += '<div class="seal-expired-warning">Monthly review was due on the ' + sealReviewDay + getOrdinalSuffix(sealReviewDay) + '. Break seal to review expiration dates of contents.</div>';
          } else if (sealReviewDay > 0) {
            var nextReview = getNextReviewDate();
            if (nextReview) {
              panelHtml += '<div class="seal-warning">Next expiration review: ' + formatTagDate(nextReview.toISOString().split('T')[0]) + '</div>';
            }
          }

          var escapedParent = escapeHtml(parentName).replace(/'/g, "\\'");
          panelHtml += '<div class="seal-actions">';
          panelHtml += '<button class="break-seal-btn" onclick="breakSeal(\'' + escapedParent + '\', \'review\')">Break Seal &amp; Review</button>';
          panelHtml += '<button class="seal-missing-btn" onclick="breakSeal(\'' + escapedParent + '\', \'missing\')">Seal is Missing</button>';
          panelHtml += '</div>';

          panel.innerHTML = panelHtml;
          contentDiv.appendChild(panel);

          // Initialize parent item states for sealed parent
          if (INVENTORY[parentName]) {
            for (var catName in INVENTORY[parentName]) {
              var items = INVENTORY[parentName][catName];
              for (var i = 0; i < items.length; i++) {
                var key = generateKey(parentName, catName, items[i].name);
                if (!itemStates[key]) {
                  itemStates[key] = { actual: items[i].required };
                }
              }
            }
          }
        } else {
          // Parent not sealed — render parent's own items if any
          if (INVENTORY[parentName]) {
            var parentSection = buildAreaSection(parentName);
            // Unwrap: insert the area-content children directly so items appear
            // inline within the group rather than as a nested collapsible
            var parentContent = parentSection.querySelector('.area-content');
            if (parentContent) {
              var wrapper = document.createElement('div');
              wrapper.className = 'parent-own-items';
              while (parentContent.firstChild) {
                wrapper.appendChild(parentContent.firstChild);
              }
              contentDiv.appendChild(wrapper);
            }
            rendered[parentName] = true;
          }
        }

        // Always render child areas (whether parent is sealed or not)
        for (var c = 0; c < children.length; c++) {
          var childName = children[c];
          if (INVENTORY[childName]) {
            contentDiv.appendChild(buildNode(childName));
            rendered[childName] = true;
          }
        }

        // Parent seal button — only if parent is sealable and not already sealed
        if (sealableAreas[parentName] && !taggedAreas[parentName]) {
          var tagBtn = document.createElement('button');
          tagBtn.className = 'tag-area-btn';
          tagBtn.id = 'tag_btn_group_' + parentName.replace(/[^a-zA-Z0-9]/g, '_');
          tagBtn.style.display = 'none';
          tagBtn.textContent = 'Seal ' + parentName;
          tagBtn.onclick = (function(name) {
            return function(e) {
              e.stopPropagation();
              tagArea(name);
            };
          })(parentName);
          contentDiv.appendChild(tagBtn);
        }

        groupDiv.appendChild(contentDiv);
        return groupDiv;
      }

      // Top-level areas in file order; children render inside their parents
      for (var areaName in INVENTORY) {
        if (rendered[areaName] || areaParent[areaName]) continue;
        container.appendChild(buildNode(areaName));
        rendered[areaName] = true;
      }

      buildQuestionSections(container, 'afterInventory');

      updateAllStatuses();
      updateSummary();

      // Restore expanded state after DOM rebuild
      if (expandedGroup) {
        var groupDiv = document.getElementById('area_group_' + expandedGroup.replace(/[^a-zA-Z0-9]/g, '_'));
        if (groupDiv) {
          if (isGroupComplete(expandedGroup)) {
            expandedGroup = null;
            expandedArea = null;
          } else {
            // The group and every group around it
            var gUp = groupDiv;
            while (gUp) { gUp.classList.add('expanded'); gUp = enclosingGroupDiv(gUp); }

            if (expandedArea) {
              var childDiv = document.getElementById('area_' + expandedArea.replace(/[^a-zA-Z0-9]/g, '_'));
              if (childDiv && groupDiv.contains(childDiv)) {
                if (isAreaDone(expandedArea)) {
                  // Current child is done: move on to the next unfinished plain child
                  var children = areaHierarchy[expandedGroup] || [];
                  var nextChild = null;
                  for (var nc = 0; nc < children.length; nc++) {
                    if (!areaHierarchy[children[nc]] && INVENTORY[children[nc]] && !isAreaDone(children[nc])) {
                      nextChild = children[nc]; break;
                    }
                  }
                  if (nextChild) {
                    expandedArea = nextChild;
                    var nextDiv = document.getElementById('area_' + nextChild.replace(/[^a-zA-Z0-9]/g, '_'));
                    if (nextDiv) nextDiv.classList.add('expanded');
                  } else {
                    expandedArea = null;
                  }
                } else {
                  childDiv.classList.add('expanded');
                }
              }
            }
          }
        }
      } else if (expandedArea) {
        var areaDiv = document.getElementById('area_' + expandedArea.replace(/[^a-zA-Z0-9]/g, '_'));
        if (areaDiv) {
          // Keep open only while items are still unchecked; sealing is its own step at the end
          var stillHasWork = !taggedAreas[expandedArea] && !isAreaAllOk(expandedArea);
          if (stillHasWork) {
            areaDiv.classList.add('expanded');
          } else {
            expandedArea = null;
          }
        }
      }

      // Open "Before you start" while it still has work and nothing else is open
      updatePreGroup(false);
      var preDiv = document.getElementById('pre_group');
      if (preDiv && !expandedArea && !expandedGroup && !preGroupComplete()) {
        preDiv.classList.add('expanded');
      }

      advanceFocus(focusedKey, false);
      updateStickyOffsets();
    }

    // Check if a parent group is fully complete (all children sealed/ok, parent items ok/sealed)
    // =====================================================
    // RIG / CHECKLIST PICKER AND TODAY STATUS
    // =====================================================

    function normalizeSelection(v) {
      if (v === undefined || v === null) return '';
      return String(v).trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_\-]/g, '');
    }

    function selectionPath() {
      var setting = JFCustomWidget.getWidgetSetting('checklistPathTemplate');
      var template = setting ? setting : defaultPathPrefix + DEFAULT_PATH_TEMPLATE;
      var dec = document.createElement('textarea');
      dec.innerHTML = template;
      return dec.value.replace('{rig}', currentRig).replace('{checklist}', currentChecklist);
    }

    // Forget everything from the previously loaded checklist
    function resetRuntimeState() {
      stateReady = false;
      INVENTORY = {};
      itemStates = {}; restockStatus = {}; taggedAreas = {}; brokenSeals = [];
      collapsedCategories = {}; o2States = {}; questionAnswers = {}; customQuestions = [];
      categoryMeta = {}; sealableAreas = {}; areaHierarchy = {}; areaParent = {};
      inventoryFileQuestions = []; previousReadings = null; restoredLocalTs = null;
      expandedArea = null; expandedGroup = null; focusedKey = null;
      apiSubmitDone = false;
      closeRestockModal();
      closeSealCheck();
      updateOosBanner();
    }

    // ---------------- In-widget picker ----------------

    // Which index file to use: the rigIndex setting, else the default
    function resolveRigIndexSetting(rigIndex) {
      var v = (rigIndex === undefined || rigIndex === null) ? '' : String(rigIndex).trim();
      return v || DEFAULT_RIG_INDEX;
    }

    function lastRigKey() {
      var fp = getFormParams();
      return 'ems_last_rig_' + (fp.formID || cachedFormID || 'form');
    }

    function initPicker(indexSetting, data, start) {
      pickerActive = true;
      selectorActive = true;
      pickerStart = start;
      pickerData = data;
      var dec = document.createElement('textarea');
      dec.innerHTML = indexSetting;
      var indexPath = dec.value;
      setStatusStrip('prompt', 'Loading rigs\u2026');
      // The default index is searched upward from the widget folder; an explicit
      // setting is used as given.
      var prefixes = indexPath === DEFAULT_RIG_INDEX ? ['', '../', '../../'] : [''];
      // Try the prefix that worked last time first, so later loads skip the 404 probe
      var remembered = null;
      try { remembered = localStorage.getItem('ems_index_prefix'); } catch (e) {}
      if (remembered !== null && prefixes.indexOf(remembered) > 0) {
        prefixes.splice(prefixes.indexOf(remembered), 1);
        prefixes.unshift(remembered);
      }
      var attempt = 0;
      var tryNext = function() {
        var prefix = prefixes[attempt];
        fetchInventoryFile(prefix + indexPath, function(content) {
          var parsed = content ? parseJsonLoose(content) : null;
          if (parsed && Array.isArray(parsed.rigs)) {
            defaultPathPrefix = prefix;
            crewRosterPath = (prefix + indexPath).replace(/[^\/]*$/, 'crew.json');
            try { localStorage.setItem('ems_index_prefix', prefix); } catch (e) {}
            onIndexLoaded(parsed);
            return;
          }
          attempt++;
          if (attempt < prefixes.length) { tryNext(); return; }
          console.warn('[Widget] rig index could not be loaded from', indexPath);
          onIndexLoaded(null);
        });
      };
      var onIndexLoaded = function(parsed) {
        if (!parsed) {
          rigIndexData = { rigs: [] };
        } else {
          rigIndexData = parsed;
        }
        var lastRig = null;
        try { lastRig = localStorage.getItem(lastRigKey()); } catch (e) {}
        var known = lastRig && findRig(lastRig);
        loadCrewRoster(function() {
          renderCrewScreen(function() { renderPicker(known ? lastRig : null); });
        });
      };
      tryNext();
    }

    // =====================================================
    // CREW: who is checking
    // =====================================================
    // The roster lives in the crewRoster widget setting, one name per line
    // (commas work too), so it stays inside Jotform and never reaches the
    // public repo. A crew.json next to the rig index is read only when the
    // setting is empty. Every session starts by picking a name; the last
    // pick is offered first for 24 hours. Names not on the roster cannot be
    // used. The name goes into every submission, report, seal and status line.

    var CREW_REMEMBER_MS = 24 * 3600 * 1000;
    var CREW_KEY = 'ems_crew_last';
    var crewRoster = null;     // [{ id, name }] or null when the file could not be read
    var crewRosterPath = null; // set once the rig index path is known
    var currentCrew = null;    // { id, name } for this session

    function crewName() { return currentCrew ? currentCrew.name : ''; }

    // "Jack Reynolds" -> "J. Reynolds"
    function crewShort(name) {
      var parts = String(name || '').trim().split(/\s+/);
      if (parts.length < 2) return parts[0] || '';
      return parts[0].charAt(0).toUpperCase() + '. ' + parts[parts.length - 1];
    }

    function submissionCrew(sub) {
      var parsed = submissionSyncData(sub);
      return parsed && parsed.crew && parsed.crew.name ? parsed.crew.name : '';
    }

    function rosterFromSetting() {
      var raw = null;
      try { raw = JFCustomWidget.getWidgetSetting('crewRoster'); } catch (e) {}
      if (!raw || !String(raw).trim()) return null;
      var dec = document.createElement('textarea');
      dec.innerHTML = String(raw);
      var parts = dec.value.split(/[\n,;]+/);
      var out = [];
      for (var i = 0; i < parts.length; i++) {
        var name = parts[i].trim();
        if (name) out.push({ id: normalizeSelection(name), name: name });
      }
      return out;
    }

    function loadCrewRoster(callback) {
      var fromSetting = rosterFromSetting();
      if (fromSetting) { crewRoster = fromSetting; callback(); return; }
      if (!crewRosterPath) { crewRoster = null; callback(); return; }
      fetchInventoryFile(crewRosterPath, function(content) {
        var parsed = content ? parseJsonLoose(content) : null;
        var list = parsed && Array.isArray(parsed.crew) ? parsed.crew : (Array.isArray(parsed) ? parsed : null);
        crewRoster = null;
        if (list) {
          crewRoster = [];
          for (var i = 0; i < list.length; i++) {
            var e = list[i];
            var name = typeof e === 'string' ? e : (e && e.name);
            if (!name) continue;
            crewRoster.push({ id: (e && e.id) || normalizeSelection(name), name: String(name).trim() });
          }
        }
        callback();
      });
    }

    function rememberedCrew() {
      var last = readJsonStore(CREW_KEY, null);
      if (!last || !last.name || !last.ts || (Date.now() - last.ts) > CREW_REMEMBER_MS) return null;
      // Still on the roster?
      if (crewRoster) {
        for (var i = 0; i < crewRoster.length; i++) if (crewRoster[i].id === last.id) return crewRoster[i];
        return null;
      }
      return { id: last.id, name: last.name };
    }

    function setCurrentCrew(member) {
      currentCrew = member ? { id: member.id, name: member.name } : null;
      if (member) writeJsonStore(CREW_KEY, { id: member.id, name: member.name, ts: Date.now() });
    }

    // A small "J. Reynolds" button on the picker titles; tapping it changes the crew
    function crewChip(back) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'crew-chip';
      chip.textContent = currentCrew ? crewShort(currentCrew.name) : 'Crew member';
      chip.onclick = function() { renderCrewScreen(back); };
      return chip;
    }

    function renderCrewScreen(next) {
      var container = document.getElementById('areasContainer');
      if (!container) { next(); return; }
      var widget = document.querySelector('.widget-container');
      if (widget) widget.classList.add('picker-open');
      setStatusStrip('prompt', 'Crew member');
      container.innerHTML = '';
      var screen = document.createElement('div');
      screen.className = 'picker crew-screen';
      var title = document.createElement('div');
      title.className = 'picker-title';
      title.textContent = 'Crew member';
      screen.appendChild(title);

      var finish = function(member) {
        setCurrentCrew(member);
        next();
      };

      if (!crewRoster || crewRoster.length === 0) {
        var note = document.createElement('div');
        note.className = 'usage-msg warn';
        note.textContent = 'No crew roster. Add names to the crewRoster widget setting, one per line.';
        screen.appendChild(note);
        var skip = document.createElement('button');
        skip.type = 'button';
        skip.className = 'usage-save';
        skip.textContent = 'Continue without a name';
        skip.onclick = function() { finish(null); };
        screen.appendChild(skip);
        container.appendChild(screen);
        setLoading(false);
        resizeWidget();
        return;
      }

      var last = rememberedCrew();
      if (last) {
        var cont = document.createElement('button');
        cont.type = 'button';
        cont.className = 'crew-continue';
        cont.id = 'crewContinue';
        cont.innerHTML = 'Continue as ' + escapeHtml(last.name) + '<small>Or enter a different name below.</small>';
        cont.onclick = function() { finish(last); };
        screen.appendChild(cont);
      }

      var search = document.createElement('input');
      search.type = 'search';
      search.className = 'usage-search';
      search.id = 'crewSearch';
      search.placeholder = 'Enter crew member name';
      search.setAttribute('autocomplete', 'off');
      screen.appendChild(search);
      var suggest = document.createElement('div');
      suggest.className = 'usage-suggest';
      suggest.id = 'crewSuggest';
      screen.appendChild(suggest);
      var msg = document.createElement('div');
      msg.className = 'usage-msg';
      msg.id = 'crewMsg';
      msg.textContent = 'Only names on the crew roster are accepted. Contact a supervisor to be added.';
      screen.appendChild(msg);
      container.appendChild(screen);
      setLoading(false);
      resizeWidget();

      search.oninput = function() {
        var q = search.value.trim().toLowerCase();
        suggest.innerHTML = '';
        if (q.length < 1) return;
        var scored = [];
        for (var i = 0; i < crewRoster.length; i++) {
          var name = crewRoster[i].name.toLowerCase();
          var rank = name.indexOf(q) === 0 ? 0 : (name.indexOf(' ' + q) !== -1 ? 1 : (name.indexOf(q) !== -1 ? 2 : -1));
          if (rank >= 0) scored.push({ m: crewRoster[i], rank: rank });
        }
        scored.sort(function(a, b) { return a.rank - b.rank || a.m.name.localeCompare(b.m.name); });
        for (var k = 0; k < scored.length && k < 8; k++) {
          var row = document.createElement('button');
          row.type = 'button';
          row.className = 'usage-suggest-row';
          row.innerHTML = '<span class="usage-suggest-name">' + escapeHtml(scored[k].m.name) + '</span>';
          row.onclick = (function(m) { return function() { finish(m); }; })(scored[k].m);
          suggest.appendChild(row);
        }
        if (!scored.length) {
          var none = document.createElement('div');
          none.className = 'usage-suggest-why';
          none.style.padding = '6px 4px';
          none.textContent = 'No one on the roster matches.';
          suggest.appendChild(none);
        }
        resizeWidget();
      };
      search.onkeydown = function(e) {
        if (e.key === 'Enter') { e.preventDefault(); pickTopSuggestion('crewSuggest'); }
      };
      if (!last) search.focus();
    }

    // Enter in a search box acts on the top suggestion (if it can be chosen)
    function pickTopSuggestion(boxId) {
      var box = document.getElementById(boxId);
      if (!box) return false;
      var top = box.querySelector('.usage-suggest-row');
      if (!top || top.classList.contains('blocked')) return false;
      top.click();
      return true;
    }

    function findRig(rigId) {
      if (!rigIndexData) return null;
      for (var i = 0; i < rigIndexData.rigs.length; i++) {
        if (normalizeSelection(rigIndexData.rigs[i].id) === normalizeSelection(rigId)) return rigIndexData.rigs[i];
      }
      return null;
    }

    function openPicker() {
      if (!pickerActive) return;
      if (stateReady) saveState();
      resetRuntimeState();
      setSelectionLabel('');
      renderPicker(currentRig);
    }

    function setSelectionLabel(text) {
      var header = document.getElementById('widgetHeader');
      var label = document.getElementById('selectionLabel');
      if (!header || !label) return;
      label.textContent = text || '';
      if (text && currentCrew) {
        var who = document.createElement('span');
        who.className = 'selection-crew';
        who.textContent = ' \u00B7 ' + crewShort(currentCrew.name);
        label.appendChild(who);
      }
      header.classList.toggle('has-selection', !!text);
    }

    // Timestamp of local in-progress state for a pair, if it is from today
    function localProgressFor(rigId, checklistId) {
      try {
        var stored = localStorage.getItem(getStorageKey(normalizeSelection(rigId), normalizeSelection(checklistId)));
        if (!stored) return null;
        var parsed = JSON.parse(stored);
        if (!parsed.timestamp) return null;
        if ((Date.now() - parsed.timestamp) > STATE_EXPIRY_MS) return null;
        var d = new Date(parsed.timestamp);
        if (localDateString(d) !== localDateString(new Date())) return null;
        return parsed.timestamp;
      } catch (e) { return null; }
    }

    function renderPicker(rigId) {
      var container = document.getElementById('areasContainer');
      var widget = document.querySelector('.widget-container');
      if (!container) return;
      if (widget) widget.classList.add('picker-open');
      container.innerHTML = '';
      updateSummary();

      var picker = document.createElement('div');
      picker.className = 'picker';
      var rigs = (rigIndexData && rigIndexData.rigs) || [];
      var rig = rigId ? findRig(rigId) : null;

        setStatusStrip('prompt', 'Choose a rig');

        title.className = 'picker-title';

        var grid = document.createElement('div');

        }

        container.appendChild(picker);

      }

      setStatusStrip('prompt', 'Rig ' + (rig.name || rig.id) + ': choose a checklist');
      var head = document.createElement('div');
      head.className = 'picker-title';
      var back = document.createElement('button');
      back.type = 'button';
      back.className = 'picker-back';
      back.textContent = '\u2039 Rigs';
      back.onclick = function() { renderPicker(null); };
      head.appendChild(back);
      var headText = document.createElement('span');
      headText.textContent = 'Rig ' + (rig.name || rig.id);
      head.appendChild(headText);
      head.appendChild(crewChip(function() { renderPicker(rig.id); }));
      picker.appendChild(head);

      var list = document.createElement('div');
      list.className = 'picker-list';
      var checklists = rig.checklists || [];
      var statusEls = {};
      for (var c = 0; c < checklists.length; c++) {
        var cl = checklists[c];
        var row = document.createElement('button');
        row.type = 'button';
        row.className = 'picker-row';
        var name = document.createElement('span');
        name.className = 'picker-row-name';
        name.textContent = cl.name || cl.id;
        var status = document.createElement('span');
        status.className = 'picker-row-status checking';
        status.textContent = '';
        row.appendChild(name);
        row.appendChild(status);
        row.onclick = (function(r, k) { return function() { choosePair(r, k); }; })(rig.id, cl.id);
