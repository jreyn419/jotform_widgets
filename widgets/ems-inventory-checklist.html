      slider.oninput = (function(k) { return function() { setGaugeReading(k, this.value, true); }; })(key);
      slider.onchange = (function(k) { return function() { setGaugeReading(k, this.value); }; })(key);
      wrap.appendChild(slider);
      if (g.target !== null) {
        // The thumb travels (track width - thumb width), so map the target onto that span
        var frac = gaugePercent(g, g.target) / 100;
        var left = 'calc(16px + (100% - 32px) * ' + frac + ')';
        var tick = document.createElement('span');
        tick.className = 'gauge-target';
        tick.style.left = left;
        var lbl = document.createElement('span');
        lbl.className = 'gauge-target-label';
        lbl.style.left = left;
        lbl.textContent = 'target ' + g.target;
        wrap.appendChild(tick);
        wrap.appendChild(lbl);
      }
      itemDiv.appendChild(wrap);

      var scale = document.createElement('div');
      scale.className = 'gauge-scale';
      scale.innerHTML = '<span>' + g.min + '</span><span>red &lt; ' + g.yellow + ' \u00B7 yellow &lt; ' + g.green + ' \u00B7 green</span><span>' + g.max + '</span>';
      itemDiv.appendChild(scale);

      var zt = document.createElement('div');
      zt.className = 'gauge-zone-text';
      zt.textContent = gaugeZoneText(g, zone);
      itemDiv.appendChild(zt);

      var prev = document.createElement('div');
      prev.className = 'gauge-prev';
      var prevText = previousReadingText(key, g);
      prev.textContent = prevText;
      if (!prevText) prev.style.display = 'none';
      itemDiv.appendChild(prev);
    }

    function refreshGaugeRow(key, item) {
      var row = document.getElementById('item_' + key.replace(/[^a-zA-Z0-9]/g, '_'));
      if (!row) return;
      var g = item.gauge;
      var r = gaugeReading(key);
      var zone = gaugeZone(g, r);
      row.classList.remove('zone-green', 'zone-yellow', 'zone-red', 'unset', 'checked', 'short', 'missing');
      row.classList.add(zone ? 'zone-' + zone : 'unset');
      var num = row.querySelector('.gauge-value');
      if (num) {
        if (document.activeElement !== num) num.value = r !== null ? r : '';
        num.classList.remove('zone-green', 'zone-yellow', 'zone-red');
        if (zone) num.classList.add('zone-' + zone);
      }
      var slider = row.querySelector('.gauge-slider');
      if (slider && r !== null && document.activeElement !== slider) slider.value = r;
      var zt = row.querySelector('.gauge-zone-text');
      if (zt) zt.textContent = gaugeZoneText(g, zone);
    }

    // quiet = live slider drag: update the row only, no save or navigation
    function setGaugeReading(key, value, quiet) {
      var parts = key.split('::');
      var item = findItem(parts[0], parts[1], parts[2]);
      if (!item || item.type !== 'gauge') return;
      var g = item.gauge;
      var v = parseFloat(value);
      if (value === '' || value === null || value === undefined || isNaN(v)) {
        itemStates[key] = { actual: 0, reading: null };
      } else {
        v = Math.max(g.min, Math.min(g.max, v));
        itemStates[key] = { actual: 1, reading: v };
      }
      refreshGaugeRow(key, item);
      if (quiet) return;

      updateAllStatuses();
      updateSummary();
      if (stateReady) saveState();
      if (itemStates[key].actual >= 1) autoCategoryAdvance(parts[0], parts[1]);
      if (enableFocusRow) advanceFocus(key, !isCategoryComplete(parts[0], parts[1]));
      checkForCompletion();
    }

    // =====================================================
    // PROGRESS STRIPS
    // =====================================================

    function makeProgressStrip() {
      var strip = document.createElement('span');
      strip.className = 'progress-strip';
      strip.innerHTML = '<span class="progress-fill"></span>';
      return strip;
    }

    function setProgressStrip(headerEl, done, total) {
      if (!headerEl) return;
      var fill = headerEl.querySelector(':scope > .progress-strip > .progress-fill');
      if (!fill) return;
      var pct = total > 0 ? Math.round((done / total) * 100) : 0;
      fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
    }

    // =====================================================
    // FOCUS ROW
    // =====================================================

    // An item is handled when its count is met, or it has been sent to
    // restock / marked out of stock.
    function isItemHandled(key) {
      var parts = key.split('::');
      var item = findItem(parts[0], parts[1], parts[2]);
      if (!item) return true;
      var actual = (itemStates[key] || { actual: 0 }).actual;
      if (actual >= item.required) return true;
      var st = restockStatus[key];
      return !!(st && (st.restocked || st.outOfStock));
    }

    // Item rows that are currently visible (expanded area, open category), in order.
    function getVisibleItemRows() {
      var rows = document.querySelectorAll('#areasContainer .checklist-item[data-key]');
      var out = [];
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].offsetParent !== null) out.push(rows[i]);
      }
      return out;
    }

    function clearFocusedRow() {
      var cur = document.querySelectorAll('.checklist-item.focused');
      for (var i = 0; i < cur.length; i++) cur[i].classList.remove('focused');
      focusedKey = null;
      updateFocusDock();
    }

    // Keep the dock in step with the focused item's count
    function updateFocusExtras(row, key) {
      if (key === focusedKey) updateFocusDock();
    }

    function updateFocusDock() {
      var dock = document.getElementById('focusDock');
      if (!dock) return;
      var key = focusedKey;
      var item = null;
      if (key) {
        var parts = key.split('::');
        item = findItem(parts[0], parts[1], parts[2]);
      }
      // Only count items use the dock; gauges and checks carry their own controls
      if (!enableFocusRow || !item || item.type === 'gauge' || item.type === 'check') {
        dock.classList.remove('show');
        return;
      }
      var actual = (itemStates[key] || { actual: 0 }).actual;
      var catMeta = categoryMeta[parts[0] + '::' + parts[1]];
      var catLabel = (catMeta && catMeta.displayName) || parts[1];
      document.getElementById('dockName').textContent = item.name;
      document.getElementById('dockPath').textContent = loneCategoryOf(parts[0]) === parts[1]
        ? parts[0] : parts[0] + ' \u203A ' + catLabel;
      var valueEl = document.getElementById('dockValue');
      if (document.activeElement !== valueEl) valueEl.value = actual;
      valueEl.max = item.required;
      document.getElementById('dockOf').textContent = 'of ' + item.required;
      dock.classList.add('show');
    }

    function dockAdjust(delta) {
      if (!focusedKey) return;
      adjustItem(focusedKey, delta);
    }

    function dockSetValue(raw) {
      if (!focusedKey) return;
      setItemValue(focusedKey, parseInt(raw, 10) || 0);
    }

    function dockAllPresent() {
      if (!focusedKey) return;
      var parts = focusedKey.split('::');
      var item = findItem(parts[0], parts[1], parts[2]);
      if (item) setItemValue(focusedKey, item.required);
    }

    // Move on with whatever is recorded: the next unfinished visible row,
    // or clear the focus when nothing is left.
    function focusNext() {
      if (!focusedKey) return;
      var current = focusedKey;
      if (itemStates[current] && !itemStates[current].touched) {
        itemStates[current].touched = true;
        if (stateReady) saveState();
        updateSummary();
      }
      advanceFocus(current, true, true);
      if (focusedKey === current) clearFocusedRow();
      updateFocusDock();
    }

    // The previous visible row, finished or not, so a mistake can be fixed
    function focusPrevious() {
      var rows = getVisibleItemRows();
      if (rows.length === 0) return;
      var idx = -1;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].getAttribute('data-key') === focusedKey) { idx = i; break; }
      }
      var target = idx > 0 ? rows[idx - 1] : rows[rows.length - 1];
      setFocusedItem(target.getAttribute('data-key'), true);
    }

    function initFocusDock() {
      var minus = document.getElementById('dockMinus');
      if (!minus) return;
      minus.onclick = function() { dockAdjust(-1); };
      document.getElementById('dockPlus').onclick = function() { dockAdjust(1); };
      document.getElementById('dockAll').onclick = dockAllPresent;
      document.getElementById('dockNext').onclick = focusNext;
      var valueEl = document.getElementById('dockValue');
      valueEl.onchange = function() { dockSetValue(this.value); };
      valueEl.onkeydown = function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          var before = focusedKey;
          dockSetValue(this.value);
          this.blur();
          // A count that completes the item already moved the focus on
          if (focusedKey === before) focusNext();
        }
      };
    }

    function setFocusedItem(key, scroll, force) {
      if (!enableFocusRow) return;
      var row = key ? document.getElementById('item_' + key.replace(/[^a-zA-Z0-9]/g, '_')) : null;
      clearFocusedRow();
      if (!row) return;
      row.classList.add('focused');
      focusedKey = key;
      updateFocusDock();
      if (scroll) scrollRowIntoView(row, !!force);
    }

    // Scroll the areas container so the row sits below the sticky header
    // stack, but only when it is not already fully visible.
    // Set while the widget itself opens areas, so the toggles' own delayed
    // scrolls stay quiet and the landing below is the only scroll.
    var suppressToggleScroll = false;

    // Height of the headers that will sit above this row once it is at the
    // top: group header, area header, and category header.
    function stickyStackFor(row) {
      var h = 0;
      var section = row.closest('.area-section');
      var group = row.closest('.area-group.expanded');
      if (group) {
        var gh = group.querySelector(':scope > .area-header');
        if (gh) h += gh.getBoundingClientRect().height;
      }
      if (section) {
        var ah = section.querySelector(':scope > .area-header');
        if (ah) h += ah.getBoundingClientRect().height;
      }
      var items = row.closest('.category-items');
      var ch = items ? items.previousElementSibling : null;
      if (ch && ch.classList.contains('category-header')) h += ch.getBoundingClientRect().height;
      return h;
    }

    // Land the row just under the sticky headers. One scroll, computed after
    // layout: a jump when the move is longer than a screen, a short glide
    // otherwise. Without force, a row already fully in view stays put.
    function scrollRowIntoView(row, force) {
      var container = document.getElementById('areasContainer');
      if (!container) return;
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          var cRect = container.getBoundingClientRect();
          var rRect = row.getBoundingClientRect();
          var stack = stickyStackFor(row);
          var top = rRect.top - cRect.top;
          var bottom = rRect.bottom - cRect.top;
          if (!force && top >= stack && bottom <= cRect.height) return;
          var target = Math.max(0, container.scrollTop + top - stack - 8);
          var distance = Math.abs(target - container.scrollTop);
          if (distance < 1) return;
          if (distance > cRect.height) {
            container.scrollTop = target;
          } else {
            container.scrollTo({ top: target, behavior: 'smooth' });
          }
        });
      });
    }

    function flashHeader(header) {
      if (!header) return;
      header.classList.remove('landed');
      void header.offsetWidth; // restart the animation
      header.classList.add('landed');
      setTimeout(function() { header.classList.remove('landed'); }, 800);
    }

    // Focus the next unhandled visible row after fromKey (wrapping around),
    // or keep fromKey focused while it still needs work. With no fromKey,
    // the first unhandled visible row is focused.
    // skipCurrent: leave fromKey even if it still needs work (the dock's Next)
    function advanceFocus(fromKey, scroll, skipCurrent) {
      if (!enableFocusRow) return;
      var rows = getVisibleItemRows();
      if (rows.length === 0) { clearFocusedRow(); return; }

      var startIdx = -1;
      if (fromKey) {
        for (var i = 0; i < rows.length; i++) {
          if (rows[i].getAttribute('data-key') === fromKey) { startIdx = i; break; }
        }
        if (startIdx !== -1 && !skipCurrent && !isItemHandled(fromKey)) {
          setFocusedItem(fromKey, false);
          return;
        }
      }

      // Forward only: never wrap back to items that were skipped
      for (var fi = startIdx + 1; fi < rows.length; fi++) {
        var k = rows[fi].getAttribute('data-key');
        if (!isItemHandled(k)) {
          setFocusedItem(k, scroll !== false);
          return;
        }
      }
      // Nothing ahead in view: open the next category, area or group with work
      if (fromKey && focusNextContainer(fromKey, scroll !== false)) return;
      clearFocusedRow();
    }

    function firstUnhandledIn(areaName, catName) {
      var items = INVENTORY[areaName] && INVENTORY[areaName][catName];
      if (!items) return null;
      for (var i = 0; i < items.length; i++) {
        var key = generateKey(areaName, catName, items[i].name);
        if (!isItemHandled(key)) return key;
      }
      return null;
    }

    function firstUnhandledInArea(areaName) {
      for (var catName in INVENTORY[areaName]) {
        var key = firstUnhandledIn(areaName, catName);
        if (key) return key;
      }
      return null;
    }

    function areaNameForSection(div) {
      if (!div) return null;
      for (var name in INVENTORY) {
        if (div.id === 'area_' + name.replace(/[^a-zA-Z0-9]/g, '_')) return name;
      }
      return null;
    }

    // Expand a category (and its parent category, for a subcategory)
    function openCategory(areaName, catName) {
      var meta = categoryMeta[areaName + '::' + catName];
      if (meta && meta.level === 1 && meta.parent) openCategory(areaName, meta.parent);
      var key = areaName + '::' + catName;
      collapsedCategories[key] = false;
      var itemsDiv = document.getElementById('cat_items_' + key.replace(/[^a-zA-Z0-9]/g, '_'));
      if (itemsDiv) itemsDiv.style.display = 'block';
      var icon = document.getElementById('cat_icon_' + key.replace(/[^a-zA-Z0-9]/g, '_'));
      if (icon) icon.style.transform = 'rotate(90deg)';
    }

    // Move the focus to the next place with unfinished items: a later
    // category in this area, then the next area or group in display order.
    // Returns true when the focus moved.
    function focusNextContainer(fromKey, scroll) {
      var parts = fromKey.split('::');
      var areaName = parts[0], catName = parts[1];
      if (!INVENTORY[areaName]) return false;

      var cats = Object.keys(INVENTORY[areaName]);
      var passed = false;
      for (var ci = 0; ci < cats.length; ci++) {
        if (cats[ci] === catName) { passed = true; continue; }
        if (!passed) continue;
        var target = firstUnhandledIn(areaName, cats[ci]);
        if (!target) continue;
        openCategory(areaName, cats[ci]);
        updateStickyOffsets();
        setFocusedItem(target, scroll, true);
        return true;
      }

      var row = document.getElementById('item_' + fromKey.replace(/[^a-zA-Z0-9]/g, '_'));
      // A row in a group's own items has no section: its node is the group itself
      var section = row ? (row.closest('.area-section') || row.closest('.area-group')) : null;
      var nodes = Array.prototype.slice.call(document.querySelectorAll('.areas-container > .area-section, .areas-container > .area-group, .area-group-content > .area-section, .area-group-content > .area-group'));
      var idx = section ? nodes.indexOf(section) : -1;
      for (var ni = idx + 1; ni < nodes.length; ni++) {
        var node = nodes[ni];
        var isGroup = node.classList.contains('area-group');
        var name = isGroup ? groupNameForDiv(node) : areaNameForSection(node);
        if (!name || taggedAreas[name]) continue;
        var next = firstUnhandledInArea(name); // for a group: its own items, shown at the top of the group
        if (!next) continue;
        var groupDiv = isGroup ? node : enclosingGroupDiv(node);
        suppressToggleScroll = true;
        try {
          if (groupDiv) ensureGroupChainExpanded(groupDiv);
          if (!groupDiv) {
            // Leaving a group for a standalone area: fold every group that was open
            var leaving = section ? section.closest('.area-group') : null;
            while (leaving) { leaving.classList.remove('expanded'); leaving = enclosingGroupDiv(leaving); }
            expandedGroup = null;
          }
          if (isGroup) {
            // Fold whatever is open inside so the group's own items are in view
            var openInside = node.querySelectorAll('.expanded');
            for (var oi = 0; oi < openInside.length; oi++) openInside[oi].classList.remove('expanded');
            expandedArea = null;
          } else if (!node.classList.contains('expanded')) {
            toggleArea(node, !!groupDiv);
          }
          openCategory(name, next.split('::')[1]);
          updateStickyOffsets();
        } finally {
          suppressToggleScroll = false;
        }
        setFocusedItem(next, scroll, true);
        flashHeader(node.querySelector(':scope > .area-header'));
        return true;
      }
      return false;
    }

    // =====================================================
    // "BEFORE YOU START" BLOCK
    // =====================================================

    function preGroupProgress() {
      var done = 0, total = 0;
      for (var i = 0; i < o2Areas.length; i++) {
        total++;
        if (getO2AreaStatus(o2Areas[i].id) !== 'unchecked') done++;
      }
      for (var q = 0; q < customQuestions.length; q++) {
        if (customQuestions[q].position === 'afterInventory') continue;
        total++;
        if (isQuestionAnswered(customQuestions[q]) || !customQuestions[q].required) done++;
      }
      return { done: done, total: total };
    }

    function preGroupComplete() {
      var p = preGroupProgress();
      return p.total === 0 || p.done === p.total;
    }

    // A section inside the block closes its siblings, not the top-level areas
    function sectionIsNested(el) {
      return !!(el && el.parentElement && el.parentElement.classList.contains('pre-content'));
    }

    // Refresh the block header; when it just became complete, fold it and
    // open whatever comes next.
    function updatePreGroup(autoAdvance) {
      var pre = document.getElementById('pre_group');
      if (!pre) return;
      var p = preGroupProgress();
      var header = pre.querySelector(':scope > .area-header');
      var chip = document.getElementById('status_pre_group');
      var complete = p.total > 0 && p.done === p.total;
      if (chip) {
        chip.textContent = complete ? '\u2713' : p.done + '/' + p.total;
        chip.classList.toggle('ok', complete);
      }
      if (header) {
        header.classList.toggle('all-ok', complete);
        setProgressStrip(header, p.done, p.total);
      }
      if (autoAdvance && complete && pre.classList.contains('expanded')) {
        setTimeout(function() {
          pre.classList.remove('expanded');
          var next = pre.nextElementSibling;
          suppressToggleScroll = true;
          try {
            if (next && next.classList.contains('area-group')) toggleAreaGroup(next);
            else if (next && next.classList.contains('area-section')) toggleArea(next, false);
            updateStickyOffsets();
          } finally {
            suppressToggleScroll = false;
          }
          if (focusedKey) {
            var landedRow = document.getElementById('item_' + focusedKey.replace(/[^a-zA-Z0-9]/g, '_'));
            if (landedRow) scrollRowIntoView(landedRow, true);
          }
          if (next) flashHeader(next.querySelector(':scope > .area-header'));
        }, 350);
      }
    }

    // =====================================================
    // CUSTOM QUESTIONS
    // =====================================================

    var QUESTION_POSITIONS = ['beforeO2', 'afterO2', 'afterInventory'];
    var QUESTION_TYPES = ['yesno', 'choice', 'number', 'text'];

    function slugify(s) {
      return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'q';
    }

    function normalizeQuestionPosition(p) {
      var s = String(p || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      if (s === 'beforeo2' || s === 'start' || s === 'top' || s === 'beforeoxygen') return 'beforeO2';
      if (s === 'aftero2' || s === 'afteroxygen' || s === 'beforeinventory') return 'afterO2';
      return 'afterInventory';
    }

    // Validate and fill in defaults for a raw question list.
    function normalizeQuestions(list) {
      var out = [];
      var seen = {};
      for (var i = 0; i < list.length; i++) {
        var q = list[i];
        if (!q || !q.label) continue;
        var type = String(q.type || 'yesno').toLowerCase();
        if (QUESTION_TYPES.indexOf(type) === -1) type = 'text';
        var options = null;
        if (type === 'choice') {
          options = Array.isArray(q.options) ? q.options.map(function(o) { return String(o); }) : [];
          if (options.length === 0) type = 'text';
        }
        var id = q.id ? String(q.id) : slugify(q.label);
        var base = id, n = 2;
        while (seen[id]) id = base + '_' + (n++);
        seen[id] = true;
        out.push({
          id: id,
          label: String(q.label),
          type: type,
          position: normalizeQuestionPosition(q.position),
          options: options,
          required: q.required === undefined ? true : isTruthySetting(q.required),
          flagOn: (q.flagOn !== undefined && q.flagOn !== null) ? String(q.flagOn) : null,
          placeholder: q.placeholder ? String(q.placeholder) : ''
        });
      }
      return out;
    }

    function parseQuestionsText(text) {
      try {
        var parsed = JSON.parse(String(text).trim());
        if (Array.isArray(parsed)) return parsed;
        if (parsed && Array.isArray(parsed.questions)) return parsed.questions;
      } catch (e) {
        console.warn('[Widget] customQuestions is not valid JSON:', e.message);
      }
      return [];
    }

    // Loads the customQuestions setting: inline JSON, or a .json path fetched
    // from the same origin as the widget. Always calls back with an array.
    function loadCustomQuestions(rawSetting, callback) {
      if (!rawSetting) { callback([]); return; }
      var dec = document.createElement('textarea');
      dec.innerHTML = rawSetting;
      var text = dec.value;
      if (isExternalFilePath(text)) {
        fetchInventoryFile(text, function(content) {
          callback(content ? parseQuestionsText(content) : []);
        });
        return;
      }
      callback(parseQuestionsText(text));
    }

    function findQuestion(id) {
      for (var i = 0; i < customQuestions.length; i++) {
        if (customQuestions[i].id === id) return customQuestions[i];
      }
      return null;
    }

    function isQuestionAnswered(q) {
      var v = questionAnswers[q.id];
      if (v === undefined || v === null) return false;
      if (typeof v === 'string') return v.trim() !== '';
      return true;
    }

    function areRequiredQuestionsAnswered() {
      for (var i = 0; i < customQuestions.length; i++) {
        if (customQuestions[i].required && !isQuestionAnswered(customQuestions[i])) return false;
      }
      return true;
    }

    function questionAnswerText(q) {
      if (!isQuestionAnswered(q)) return '';
      var v = questionAnswers[q.id];
      if (q.type === 'yesno') return (v === true || v === 'yes') ? 'Yes' : 'No';
      return String(v).trim();
    }

    function isQuestionFlagged(q) {
      return q.flagOn !== null && isQuestionAnswered(q) &&
        questionAnswerText(q).toLowerCase() === q.flagOn.toLowerCase();
    }

    function questionSectionId(id) {
      return 'area_q_' + id.replace(/[^a-zA-Z0-9]/g, '_');
    }

    function applyQuestionHeader(q) {
      var section = document.getElementById(questionSectionId(q.id));
      if (!section) return;
      var header = section.querySelector('.area-header');
      var chip = section.querySelector('.area-status');
      header.classList.remove('has-issues', 'all-ok');
      chip.classList.remove('issues', 'ok', 'low');
      if (isQuestionAnswered(q)) {
        var text = questionAnswerText(q);
        if (text.length > 24) text = text.substring(0, 22) + '\u2026';
        if (isQuestionFlagged(q)) {
          header.classList.add('has-issues');
          chip.classList.add('low');
        } else {
          header.classList.add('all-ok');
          chip.classList.add('ok');
        }
        chip.textContent = text;
      } else {
        chip.textContent = q.required ? 'Required' : 'Optional';
      }
    }

    function buildQuestionSections(container, position) {
      for (var i = 0; i < customQuestions.length; i++) {
        var q = customQuestions[i];
        if (q.position !== position) continue;

        var section = document.createElement('div');
        section.className = 'area-section question-section';
        section.id = questionSectionId(q.id);

        var header = document.createElement('div');
        header.className = 'area-header';
        header.innerHTML = '<span class="collapse-icon">\u25B6</span>' +
          '<span class="o2-icon">\u2753</span>' +
          '<span class="area-title">' + escapeHtml(q.label) + '</span>' +
          '<span class="area-status"></span>';
        header.onclick = (function(div) {
          return function() { toggleArea(div, sectionIsNested(div)); };
        })(section);
        section.appendChild(header);

        var content = document.createElement('div');
        content.className = 'area-content q-content';
        var current = isQuestionAnswered(q) ? questionAnswers[q.id] : null;

        if (q.type === 'yesno' || q.type === 'choice') {
          var opts = q.type === 'yesno' ? ['yes', 'no'] : q.options;
          var row = document.createElement('div');
          row.className = q.type === 'yesno' ? 'o2-check-buttons' : 'q-choice-buttons';
          for (var o = 0; o < opts.length; o++) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.setAttribute('data-value', opts[o]);
            if (q.type === 'yesno') {
              btn.className = 'o2-check-btn ' + opts[o] + (current === opts[o] ? ' selected' : '');
              btn.innerHTML = '<span class="o2-check-btn-icon">' + (opts[o] === 'yes' ? '\u2713' : '\u2717') + '</span>' +
                '<span class="o2-check-btn-text">' + (opts[o] === 'yes' ? 'Yes' : 'No') + '</span>';
            } else {
              btn.className = 'q-choice-btn' + (current === opts[o] ? ' selected' : '');
              btn.textContent = opts[o];
            }
            btn.onclick = (function(id, value) {
              return function() { setQuestionAnswer(id, value, false); };
            })(q.id, opts[o]);
            row.appendChild(btn);
          }
          content.appendChild(row);
        } else {
          var input = document.createElement(q.type === 'text' ? 'textarea' : 'input');
          if (q.type === 'number') {
            input.type = 'number';
            input.inputMode = 'decimal';
            input.className = 'q-input';
          } else {
            input.className = 'q-textarea';
            input.rows = 3;
          }
          if (q.placeholder) input.placeholder = q.placeholder;
          if (current !== null) input.value = current;
          input.oninput = (function(id) {
            return function() { setQuestionAnswer(id, this.value, true); };
          })(q.id);
          content.appendChild(input);

          var doneRow = document.createElement('div');
          doneRow.className = 'q-done-row';
          var doneBtn = document.createElement('button');
          doneBtn.type = 'button';
          doneBtn.className = 'q-done-btn';
          doneBtn.textContent = 'Done';
          doneBtn.onclick = (function(qq) {
            return function() { advanceFromQuestion(qq); };
          })(q);
          doneRow.appendChild(doneBtn);
          content.appendChild(doneRow);
        }

        section.appendChild(content);
        container.appendChild(section);
        applyQuestionHeader(q);
      }
    }

    function setQuestionAnswer(id, value, quiet) {
      var q = findQuestion(id);
      if (!q) return;
      questionAnswers[id] = value;

      var section = document.getElementById(questionSectionId(id));
      if (section && (q.type === 'yesno' || q.type === 'choice')) {
        var btns = section.querySelectorAll('button[data-value]');
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.toggle('selected', btns[i].getAttribute('data-value') === value);
        }
      }
      applyQuestionHeader(q);
      if (stateReady) saveState();
      if (!quiet) advanceFromQuestion(q);
      checkForCompletion();
    }

    // Open the next unanswered question in the same slot, else collapse.
    function advanceFromQuestion(q) {
      var section = document.getElementById(questionSectionId(q.id));
      var next = null;
      var passed = false;
      for (var i = 0; i < customQuestions.length; i++) {
        var c = customQuestions[i];
        if (c.id === q.id) { passed = true; continue; }
        if (passed && c.position === q.position && !isQuestionAnswered(c)) { next = c; break; }
      }
      setTimeout(function() {
        if (next) {
          var nextSection = document.getElementById(questionSectionId(next.id));
          if (nextSection && !nextSection.classList.contains('expanded')) toggleArea(nextSection, sectionIsNested(nextSection));
        } else if (section && section.classList.contains('expanded')) {
          toggleArea(section, sectionIsNested(section));
        }
      }, 250);
      updatePreGroup(true);
    }

    // =====================================================
    // OXYGEN SUPPLY CHECK
    // =====================================================

    function isTruthySetting(v) {
      if (v === true) return true;
      if (v === undefined || v === null) return false;
      var s = String(v).trim().toLowerCase();
      return s === 'true' || s === 'yes' || s === '1' || s === 'on';
    }

    // Build the oxygen areas from settings. getSetting is function(name) -> value
    // so the same code serves the Jotform and standalone paths.
    function configureOxygenCheck(getSetting) {
      o2Areas = [];
      enableOxygenCheck = isTruthySetting(getSetting('enableOxygenCheck'));
      if (!enableOxygenCheck) return;

      var mainThreshold = parseInt(getSetting('mainO2Threshold'), 10) || 1500;
      var mainCylinders = parseInt(getSetting('mainO2Cylinders'), 10) || 1;
      mainCylinders = Math.max(1, Math.min(2, mainCylinders));
      o2Areas.push({ id: 'main_o2', name: 'Main O2', icon: '\uD83E\uDEC1', threshold: mainThreshold, unit: 'PSI', cylinderCount: mainCylinders });

      var stretcherThreshold = parseInt(getSetting('stretcherO2Threshold'), 10) || 1000;
      o2Areas.push({ id: 'stretcher_o2', name: 'Stretcher O2', icon: '\uD83D\uDECF\uFE0F', threshold: stretcherThreshold, unit: 'PSI', cylinderCount: 1 });

      if (isTruthySetting(getSetting('enableMedicalAir'))) {
        var airThreshold = parseInt(getSetting('medicalAirThreshold'), 10) || 1500;
        o2Areas.push({ id: 'medical_air', name: 'Medical Air', icon: '\uD83D\uDCA8', threshold: airThreshold, unit: 'PSI', cylinderCount: 1 });
      }
    }

    // Adapts a checklist file's oxygenCheck block to the setting-name getter
    // configureOxygenCheck expects.
    function fileOxygenSettingGetter(block) {
      return function(name) {
        if (name === 'enableOxygenCheck') return 'true';
        if (name === 'enableMedicalAir') return block.medicalAir === undefined ? 'false' : block.medicalAir;
        return block[name];
      };
    }

    // Restock-list key for one cylinder; such keys never match an inventory item
    function o2RestockKey(areaId, cylinderIndex) {
      return 'O2::' + areaId + '::' + cylinderIndex;
    }

    // Every cylinder currently marked below its limit
    function collectLowO2Cylinders() {
      var out = [];
      for (var i = 0; i < o2Areas.length; i++) {
        var area = o2Areas[i];
        var cyl = ensureO2State(area).cylinders;
        for (var c = 0; c < area.cylinderCount; c++) {
          if (cyl[c] !== false) continue;
          out.push({
            key: o2RestockKey(area.id, c),
            areaName: area.name,
            name: (area.cylinderCount > 1 ? 'Cylinder ' + (c + 1) + ' ' : '') + 'below ' + area.threshold + ' ' + area.unit,
            reportName: area.name + (area.cylinderCount > 1 ? ' cylinder ' + (c + 1) : '') + ' (below ' + area.threshold + ' ' + area.unit + ')'
          });
        }
      }
      return out;
    }

    function findO2Area(areaId) {
      for (var i = 0; i < o2Areas.length; i++) {
        if (o2Areas[i].id === areaId) return o2Areas[i];
      }
      return null;
    }

    function ensureO2State(area) {
      if (!o2States[area.id] || !o2States[area.id].cylinders) {
        o2States[area.id] = { cylinders: {} };
      }
      var cyl = o2States[area.id].cylinders;
      for (var c = 0; c < area.cylinderCount; c++) {
        if (cyl[c] === undefined) cyl[c] = null;
      }
      return o2States[area.id];
    }

    // Returns 'unchecked' | 'low' | 'ok'
    function getO2AreaStatus(areaId) {
      var area = findO2Area(areaId);
      if (!area) return 'unchecked';
      var cyl = ensureO2State(area).cylinders;
      var allChecked = true;
      var allOk = true;
      for (var c = 0; c < area.cylinderCount; c++) {
        if (cyl[c] === null || cyl[c] === undefined) {
          allChecked = false;
        } else if (cyl[c] === false) {
          allOk = false;
        }
      }
      if (!allChecked) return 'unchecked';
      return allOk ? 'ok' : 'low';
    }

    function getO2StatusText(status) {
      if (status === 'ok') return 'OK';
      if (status === 'low') return 'Low';
      return 'Unchecked';
    }

    function isOxygenCheckComplete() {
      for (var i = 0; i < o2Areas.length; i++) {
        if (getO2AreaStatus(o2Areas[i].id) === 'unchecked') return false;
      }
      return true;
    }

    // Report-friendly summary of the oxygen check.
    function getO2Summary() {
      var summary = { enabled: enableOxygenCheck && o2Areas.length > 0, checked: true, low: [], areas: [] };
      if (!summary.enabled) return summary;
      for (var i = 0; i < o2Areas.length; i++) {
        var area = o2Areas[i];
        var status = getO2AreaStatus(area.id);
        var cyl = ensureO2State(area).cylinders;
        var lowCylinders = [];
        for (var c = 0; c < area.cylinderCount; c++) {
          if (cyl[c] === false) lowCylinders.push(c + 1);
        }
        if (status === 'unchecked') summary.checked = false;
        if (status === 'low') summary.low.push(area.name);
        summary.areas.push({
          name: area.name,
          threshold: area.threshold,
          unit: area.unit,
          cylinderCount: area.cylinderCount,
          status: status,
          lowCylinders: lowCylinders
        });
      }
      return summary;
    }

    function o2SectionId(areaId) {
      return 'area_o2_' + areaId;
    }

    function applyO2Header(areaId) {
      var section = document.getElementById(o2SectionId(areaId));
      if (!section) return;
      var status = getO2AreaStatus(areaId);
      var header = section.querySelector('.area-header');
      var chip = section.querySelector('.area-status');
      header.classList.remove('has-issues', 'all-ok');
      chip.classList.remove('issues', 'ok', 'low');
      if (status === 'ok') {
        header.classList.add('all-ok');
        chip.classList.add('ok');
      } else if (status === 'low') {
        header.classList.add('has-issues');
        chip.classList.add('low');
      }
      chip.textContent = getO2StatusText(status);
    }

    function buildOxygenSection(container) {
      if (!enableOxygenCheck || o2Areas.length === 0) return;

      for (var i = 0; i < o2Areas.length; i++) {
        var area = o2Areas[i];
        ensureO2State(area);

        var section = document.createElement('div');
        section.className = 'area-section o2-section';
        section.id = o2SectionId(area.id);

        var subtitle = 'Min ' + area.threshold + ' ' + area.unit;
        if (area.cylinderCount > 1) subtitle += ' \u00B7 ' + area.cylinderCount + ' cylinders';

        var header = document.createElement('div');
        header.className = 'area-header';
        header.innerHTML = '<span class="collapse-icon">\u25B6</span>' +
          '<span class="o2-icon">' + area.icon + '</span>' +
          '<span class="area-title">' + escapeHtml(area.name) +
            '<span class="o2-subtitle">' + escapeHtml(subtitle) + '</span></span>' +
          '<span class="area-status"></span>';
        header.onclick = (function(div) {
          return function() { toggleArea(div, sectionIsNested(div)); };
        })(section);
        section.appendChild(header);

        var content = document.createElement('div');
        content.className = 'area-content o2-content';
        var cyl = o2States[area.id].cylinders;
        var html = '';
        for (var c = 0; c < area.cylinderCount; c++) {
          var label = area.cylinderCount > 1 ? 'Cylinder ' + (c + 1) + ': ' : '';
          html += '<div class="o2-cylinder">';
          html += '<div class="o2-cylinder-label">' + label + 'Above <strong>' + area.threshold + ' ' + area.unit + '</strong>?</div>';
          html += '<div class="o2-check-buttons">';
          html += '<button type="button" class="o2-check-btn yes' + (cyl[c] === true ? ' selected' : '') +
                  '" onclick="setO2CylinderStatus(\'' + area.id + '\', ' + c + ', true)">' +
                  '<span class="o2-check-btn-icon">\u2713</span><span class="o2-check-btn-text">Yes</span></button>';
          html += '<button type="button" class="o2-check-btn no' + (cyl[c] === false ? ' selected' : '') +
                  '" onclick="setO2CylinderStatus(\'' + area.id + '\', ' + c + ', false)">' +
                  '<span class="o2-check-btn-icon">!</span><span class="o2-check-btn-text">No</span></button>';
          html += '</div></div>';
        }
        content.innerHTML = html;
        section.appendChild(content);

        container.appendChild(section);
        applyO2Header(area.id);
      }
    }

    function findNextUncheckedO2Area(currentId) {
      var foundCurrent = false;
      for (var i = 0; i < o2Areas.length; i++) {
        if (o2Areas[i].id === currentId) { foundCurrent = true; continue; }
        if (foundCurrent && getO2AreaStatus(o2Areas[i].id) === 'unchecked') return o2Areas[i].id;
      }
      for (var j = 0; j < o2Areas.length; j++) {
        if (o2Areas[j].id === currentId) break;
        if (getO2AreaStatus(o2Areas[j].id) === 'unchecked') return o2Areas[j].id;
      }
      return null;
    }

    function setO2CylinderStatus(areaId, cylinderIndex, isOk) {
      var area = findO2Area(areaId);
      if (!area) return;
      ensureO2State(area).cylinders[cylinderIndex] = isOk;
      if (isOk) delete restockStatus[o2RestockKey(areaId, cylinderIndex)];

      var section = document.getElementById(o2SectionId(areaId));
      if (section) {
        var rows = section.querySelectorAll('.o2-cylinder');
        if (rows[cylinderIndex]) {
          var yesBtn = rows[cylinderIndex].querySelector('.o2-check-btn.yes');
          var noBtn = rows[cylinderIndex].querySelector('.o2-check-btn.no');
          yesBtn.classList.toggle('selected', isOk === true);
          noBtn.classList.toggle('selected', isOk === false);
        }
      }
      applyO2Header(areaId);
      updateAllStatuses();
      updateSummary();
      if (stateReady) saveState();

      // Auto-advance: once this area is fully answered, open the next
      // unchecked O2 area, or collapse when the whole O2 check is done.
      if (getO2AreaStatus(areaId) !== 'unchecked') {
        var nextId = findNextUncheckedO2Area(areaId);
        setTimeout(function() {
          if (nextId) {
            var nextSection = document.getElementById(o2SectionId(nextId));
            if (nextSection && !nextSection.classList.contains('expanded')) toggleArea(nextSection, sectionIsNested(nextSection));
          } else if (section && section.classList.contains('expanded')) {
            toggleArea(section, sectionIsNested(section));
          }
        }, 300);
      }
      updatePreGroup(true);

      checkForCompletion();
    }

    function isGroupComplete(groupName) {
      return isAreaDone(groupName);
    }

    // Sealed, or own items all present and everything inside it done
    function isAreaDone(name) {
      if (taggedAreas[name]) return true;
      if (INVENTORY[name] && !isAreaAllOk(name)) return false;
      var kids = areaHierarchy[name] || [];
      for (var i = 0; i < kids.length; i++) {
        if (!INVENTORY[kids[i]]) continue;
        if (!isAreaDone(kids[i])) return false;
      }
      return true;
    }

    // Sealable areas inside name that are still open, looking through
    // containers that are not themselves sealable
    function unsealedSealableInside(name) {
      var out = [];
      var kids = areaHierarchy[name] || [];
      for (var i = 0; i < kids.length; i++) {
        if (sealableAreas[kids[i]]) {
          if (!taggedAreas[kids[i]]) out.push(kids[i]);
        } else {
          out = out.concat(unsealedSealableInside(kids[i]));
        }
      }
      return out;
    }
    
    // Dynamically measure sticky header heights and set subcategory top values.
    // Called after any area is expanded so the DOM is ready for measurement.
    function updateStickyOffsets() {
      markOuterGroups();
      // Clear the offsets of folded headers so nothing lingers from when they were open
      var folded = document.querySelectorAll('.area-section:not(.expanded) > .area-header');
      for (var fi = 0; fi < folded.length; fi++) folded[fi].style.top = '';
      // Find all expanded area-sections and set sticky tops
      var expandedSections = document.querySelectorAll('.area-section.expanded');
      for (var i = 0; i < expandedSections.length; i++) {
        var section = expandedSections[i];
        var areaHeader = section.querySelector(':scope > .area-header');
        var categoryHeaders = section.querySelectorAll('.category-header');
        var subcategoryHeaders = section.querySelectorAll('.subcategory-header');

        if (!areaHeader) continue;

        // Measure the area header height
        var areaH = areaHeader.getBoundingClientRect().height;

        // Check if this section is inside a group (has a parent group header too)
        var groupDiv = section.closest('.area-group.expanded');
        var groupHeaderH = 0;
        if (groupDiv) {
          var groupHeader = groupDiv.querySelector(':scope > .area-header');
          if (groupHeader) groupHeaderH = groupHeader.getBoundingClientRect().height;
          // Set child area header top to sit below group header
          areaHeader.style.top = groupHeaderH + 'px';
        }

        // Set category header tops for ALL contexts (standalone and group)
        if (categoryHeaders.length > 0) {
          var catTop = groupHeaderH + areaH;
          for (var c = 0; c < categoryHeaders.length; c++) {
            categoryHeaders[c].style.top = catTop + 'px';
          }
        }

        // Measure a category header height (they're all the same size)
        var catH = 0;
        if (categoryHeaders.length > 0) {
          catH = categoryHeaders[0].getBoundingClientRect().height;
        }

        // Subcategory headers in an area do not stick: no offset
        for (var j = 0; j < subcategoryHeaders.length; j++) {
          subcategoryHeaders[j].style.top = '';
        }
      }

      // Also handle parent-own-items (no child area-header, just group header)
      var parentOwnItems = document.querySelectorAll('.area-group.expanded .parent-own-items');
      for (var i = 0; i < parentOwnItems.length; i++) {
        var wrapper = parentOwnItems[i];
        var groupDiv = wrapper.closest('.area-group.expanded');
        if (!groupDiv) continue;

        var groupHeader = groupDiv.querySelector(':scope > .area-header');
        var groupHeaderH = groupHeader ? groupHeader.getBoundingClientRect().height : 0;

        var catHeaders = wrapper.querySelectorAll('.category-header');
        var subHeaders = wrapper.querySelectorAll('.subcategory-header');

        // Category headers in parent-own-items sit below just the group header
        if (catHeaders.length > 0) {
          for (var c = 0; c < catHeaders.length; c++) {
            catHeaders[c].style.top = groupHeaderH + 'px';
          }
        }

        var catH = catHeaders.length > 0 ? catHeaders[0].getBoundingClientRect().height : 0;

        var subTop = groupHeaderH + catH;
        for (var j = 0; j < subHeaders.length; j++) {
          subHeaders[j].style.top = subTop + 'px';
        }
      }
    }

    function toggleArea(areaDiv, isChild) {
      var wasExpanded = areaDiv.classList.contains('expanded');
      // Extract area name from the div's id
      var areaName = null;
      for (var name in INVENTORY) {
        if (areaDiv.id === 'area_' + name.replace(/[^a-zA-Z0-9]/g, '_')) {
          areaName = name; break;
        }
      }
      
      if (isChild) {
        // Inside a group: collapse the siblings (areas and nested groups) and what is inside them
        var siblings = areaDiv.parentElement.querySelectorAll('.area-section, .area-group');
        for (var i = 0; i < siblings.length; i++) {
          siblings[i].classList.remove('expanded');
        }
        expandedGroup = groupNameForDiv(enclosingGroupDiv(areaDiv));
      } else {
        // Standalone areas: close all other standalone areas
        var allAreas = document.querySelectorAll('.areas-container > .area-section');
        for (var i = 0; i < allAreas.length; i++) {
          allAreas[i].classList.remove('expanded');
        }
      }
      
      // If it wasn't expanded, open it and scroll into view
      if (!wasExpanded) {
        areaDiv.classList.add('expanded');
        expandedArea = areaName;
        updateStickyOffsets();
        advanceFocus(null, false);
        if (!suppressToggleScroll) setTimeout(function() {
          if (isChild) {
            // For child areas inside a group, we need to scroll so the child
            // area header appears just below the parent group's sticky header.
            // scrollIntoView would put it at top:0, hidden behind the group header.
            var scrollParent = document.getElementById('areasContainer');
            if (scrollParent) {
              var areaRect = areaDiv.getBoundingClientRect();
              var scrollRect = scrollParent.getBoundingClientRect();
              // Group header sticks at top:0 with height ~45px
              var groupHeaderHeight = 45;
              var areaTopInView = areaRect.top - scrollRect.top;
              var targetScroll = scrollParent.scrollTop + areaTopInView - groupHeaderHeight;
              scrollParent.scrollTo({ top: Math.max(0, targetScroll), behavior: 'smooth' });
            }
          } else {
            areaDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 50);
      } else {
        expandedArea = null;
        clearFocusedRow();
        updateStickyOffsets();
      }
    }

    function toggleAreaGroup(groupDiv) {
      var wasExpanded = groupDiv.classList.contains('expanded');
      var groupName = groupNameForDiv(groupDiv);
      var outerDiv = enclosingGroupDiv(groupDiv);

      if (outerDiv) {
        // A group inside a group: close only its siblings, keep the groups around it open
        var sibs = groupDiv.parentElement.children;
        for (var si = 0; si < sibs.length; si++) {
          if (sibs[si] === groupDiv) continue;
          sibs[si].classList.remove('expanded');
          var inner = sibs[si].querySelectorAll('.expanded');
          for (var ii = 0; ii < inner.length; ii++) inner[ii].classList.remove('expanded');
        }
      } else {
        // Close all top-level groups and standalone areas
        var allGroups = document.querySelectorAll('.areas-container > .area-group');
        for (var i = 0; i < allGroups.length; i++) {
          allGroups[i].classList.remove('expanded');
          // Also collapse anything expanded inside
          var childAreas = allGroups[i].querySelectorAll('.expanded');
          for (var j = 0; j < childAreas.length; j++) {
            childAreas[j].classList.remove('expanded');
          }
        }
        var allStandalone = document.querySelectorAll('.areas-container > .area-section');
        for (var i = 0; i < allStandalone.length; i++) {
          allStandalone[i].classList.remove('expanded');
        }
      }

      if (!wasExpanded) {
        groupDiv.classList.add('expanded');
        expandedGroup = groupName;
        updateStickyOffsets();
        advanceFocus(null, false);
      } else {
        var open = groupDiv.querySelectorAll('.expanded');
        for (var oi = 0; oi < open.length; oi++) open[oi].classList.remove('expanded');
        groupDiv.classList.remove('expanded');
        expandedGroup = groupNameForDiv(outerDiv);
        expandedArea = null;
        clearFocusedRow();
        updateStickyOffsets();
      }
    }
    

    function toggleCategory(areaName, catName, checked) {
      var items = INVENTORY[areaName][catName];
      for (var i = 0; i < items.length; i++) {
        var key = generateKey(areaName, catName, items[i].name);
        setItemValue(key, checked ? items[i].required : 0, true);
      }
      updateAllStatuses();
      updateSummary();

      if (checked) {
        // Trigger auto-advance if we just checked everything
        autoCategoryAdvance(areaName, catName);
        checkForCompletion();
      } else {
        // Reopen the category so the user can see what was unchecked
        var catKey = areaName + '::' + catName;
        collapsedCategories[catKey] = false;
        var itemsDiv = document.getElementById('cat_items_' + catKey.replace(/[^a-zA-Z0-9]/g, '_'));
        if (itemsDiv) itemsDiv.style.display = 'block';
        var icon = document.getElementById('cat_icon_' + catKey.replace(/[^a-zA-Z0-9]/g, '_'));
        if (icon) icon.style.transform = 'rotate(90deg)';
      }
      advanceFocus(null, false);
    }
    
    function setItemValue(key, value, skipUpdate) {
      var parts = key.split('::');
      var item = findItem(parts[0], parts[1], parts[2]);
      if (item && item.type === 'gauge') {
        // Gauges are only completed by a real reading; a batch "check all"
        // cannot invent one. Clearing to zero does clear the reading.
        if (value <= 0) setGaugeReading(key, '', skipUpdate);
        return;
      }
      if (item && item.type === 'check') {
        if (value <= 0) setCheckResult(key, null, skipUpdate);
        return;
      }
      var maxValue = item ? item.required : 9999;
      
      value = Math.max(0, Math.min(maxValue, value));
      itemStates[key] = { actual: value, touched: true };
      
      // Update input
      var input = document.getElementById('input_' + key.replace(/[^a-zA-Z0-9]/g, '_'));
      if (input) input.value = value;
      
      // Update checkbox
      var parts = key.split('::');
      var item = findItem(parts[0], parts[1], parts[2]);
      if (item) {
        var itemDiv = document.getElementById('item_' + key.replace(/[^a-zA-Z0-9]/g, '_'));
        if (itemDiv) {
          var cb = itemDiv.querySelector('.item-checkbox');
          if (cb) cb.checked = value >= item.required;
          
          itemDiv.classList.remove('checked', 'short', 'missing');
          if (value >= item.required) itemDiv.classList.add('checked');
          else if (value > 0) itemDiv.classList.add('short');
          else itemDiv.classList.add('missing');
          var countEl = itemDiv.querySelector('.item-count');
          if (countEl) countEl.textContent = countText(value, item.required);
          updateFocusExtras(itemDiv, key);
        }
      }
      
      if (!skipUpdate) {
        updateAllStatuses();
        updateSummary();

        // Auto-advance: if all items in this category are now OK,
        // collapse it and open the next incomplete category.
        var areaName = parts[0];
        var catName = parts[1];
        if (value >= (item ? item.required : 0)) {
          autoCategoryAdvance(areaName, catName);
        }

        // Move the focus row on. When the category just completed,
        // autoCategoryAdvance already scrolls to the next category, so
        // only scroll here when focus stays within the same category.
        if (enableFocusRow) {
          advanceFocus(key, !isCategoryComplete(areaName, catName));
        }

        checkForCompletion();
      }
    }

    // Check if all items in a category are OK
    // An area whose items all sit in one top-level category (the data format
    // needs one; "General" or "Loose" by convention) shows no header for it:
    // the items sit right under the area header, which carries the "all"
    // pill. Groups inside the category keep their own headers. A parent area
    // keeps the header, because its own items render under the group header
    // and have no area header of their own to carry the pill.
    function loneCategoryOf(areaName) {
      var cats = INVENTORY[areaName];
      if (!cats || areaHierarchy[areaName]) return null;
      var lone = null;
      for (var c in cats) {
        var meta = categoryMeta[areaName + '::' + c] || { level: 0 };
        if (meta.level !== 0) continue;
        if (lone !== null) return null;
        lone = c;
      }
      return lone;
    }

    function isCategoryComplete(areaName, catName) {
      var items = INVENTORY[areaName] && INVENTORY[areaName][catName];
      if (!items) return true;
      for (var i = 0; i < items.length; i++) {
        var key = generateKey(areaName, catName, items[i].name);
        var actual = (itemStates[key] || { actual: 0 }).actual;
        if (actual < items[i].required) return false;
      }
      return true;
    }

    // Collapse current category and open next incomplete one
    function autoCategoryAdvance(areaName, catName) {
      if (!isCategoryComplete(areaName, catName)) return;

      // Also check subcategories if this is a parent category
      var meta = categoryMeta[areaName + '::' + catName] || { level: 0 };
      if (meta.level === 0) {
        for (var sub in INVENTORY[areaName]) {
          var subMeta = categoryMeta[areaName + '::' + sub];
          if (subMeta && subMeta.level === 1 && subMeta.parent === catName) {
            if (!isCategoryComplete(areaName, sub)) return;
          }
        }
      }

      // Collapse current category
      var catKey = areaName + '::' + catName;
      // If this is a subcategory, collapse the subcategory
      if (meta.level === 1 && meta.parent) {
        // Check if sibling subcategories under the same parent are complete
        var parentCat = meta.parent;
        var allSubsDone = isCategoryComplete(areaName, parentCat);
        if (allSubsDone) {
          for (var sub in INVENTORY[areaName]) {
            var subMeta = categoryMeta[areaName + '::' + sub];
            if (subMeta && subMeta.level === 1 && subMeta.parent === parentCat) {
              if (!isCategoryComplete(areaName, sub)) { allSubsDone = false; break; }
            }
          }
        }
        if (allSubsDone) {
          // Collapse the parent category and advance to next top-level
          catName = parentCat;
          catKey = areaName + '::' + catName;
        } else {
          // Just collapse this subcategory — more subs to do
          collapsedCategories[catKey] = true;
          var itemsDiv = document.getElementById('cat_items_' + catKey.replace(/[^a-zA-Z0-9]/g, '_'));
          if (itemsDiv) itemsDiv.style.display = 'none';
          var icon = document.getElementById('cat_icon_' + catKey.replace(/[^a-zA-Z0-9]/g, '_'));
          if (icon) icon.style.transform = 'rotate(0deg)';
          return;
        }
      }

      // Collapse this top-level category
      collapsedCategories[catKey] = true;
      var itemsDiv = document.getElementById('cat_items_' + catKey.replace(/[^a-zA-Z0-9]/g, '_'));
      if (itemsDiv) itemsDiv.style.display = 'none';
      var icon = document.getElementById('cat_icon_' + catKey.replace(/[^a-zA-Z0-9]/g, '_'));
      if (icon) icon.style.transform = 'rotate(0deg)';

      // Find next incomplete top-level category in this area
      var catOrder = [];
      for (var c in INVENTORY[areaName]) {
        var cMeta = categoryMeta[areaName + '::' + c] || { level: 0 };
        if (cMeta.level === 0) catOrder.push(c);
      }
      var foundCurrent = false;
      for (var ci = 0; ci < catOrder.length; ci++) {
        if (catOrder[ci] === catName) { foundCurrent = true; continue; }
        if (!foundCurrent) continue;

        var nextCat = catOrder[ci];
        var nextComplete = isCategoryComplete(areaName, nextCat);
        // Also check subcategories
        if (nextComplete) {
          for (var sub in INVENTORY[areaName]) {
            var subMeta = categoryMeta[areaName + '::' + sub];
            if (subMeta && subMeta.level === 1 && subMeta.parent === nextCat) {
              if (!isCategoryComplete(areaName, sub)) { nextComplete = false; break; }
            }
          }
        }
        if (!nextComplete) {
          // Open this category
          var nextKey = areaName + '::' + nextCat;
          collapsedCategories[nextKey] = false;
          var nextItemsDiv = document.getElementById('cat_items_' + nextKey.replace(/[^a-zA-Z0-9]/g, '_'));
          if (nextItemsDiv) nextItemsDiv.style.display = 'block';
          var nextIcon = document.getElementById('cat_icon_' + nextKey.replace(/[^a-zA-Z0-9]/g, '_'));
          if (nextIcon) nextIcon.style.transform = 'rotate(90deg)';

          // Scroll to it, accounting for sticky area header
          var nextHeader = nextItemsDiv ? nextItemsDiv.previousElementSibling : null;
          if (nextHeader) {
            // Use triple rAF to ensure reflow completes after collapsing
            // (especially important when collapsing categories with subcategories)
            requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                  // Find the actual scroll container
                  var scrollParent = null;
                  var el = nextHeader.parentElement;
                  while (el) {
                    var style = window.getComputedStyle(el);
                    if (style.overflowY === 'auto' || style.overflowY === 'scroll') {
                      scrollParent = el;
                      break;
                    }
                    el = el.parentElement;
                  }
                  if (!scrollParent) scrollParent = document.documentElement;

                  // Measure the sticky header stack: find the bottom edge of
                  // the lowest sticky area-header in the top region of the viewport.
                  // Headers stick at various top values (0, 45px, etc.) so we
                  // check if a header's top is within the top half of the viewport.
                  var stickyOffset = 0;
                  var scrollRect = scrollParent.getBoundingClientRect();
                  var halfHeight = scrollRect.height / 2;
                  var stickyHeaders = scrollParent.querySelectorAll('.area-header');
                  for (var sh = 0; sh < stickyHeaders.length; sh++) {
                    var shStyle = window.getComputedStyle(stickyHeaders[sh]);
                    if (shStyle.position === 'sticky') {
                      var shRect = stickyHeaders[sh].getBoundingClientRect();
                      var relTop = shRect.top - scrollRect.top;
                      // Header is in the sticky zone if its top is in the
                      // upper portion of the scroll container
                      if (relTop >= -1 && relTop < halfHeight) {
                        var bottom = relTop + shRect.height;
                        if (bottom > stickyOffset) stickyOffset = bottom;
                      }
                    }
                  }
                  // Fallback minimum
                  if (stickyOffset < 45) stickyOffset = 45;

                  var headerRect = nextHeader.getBoundingClientRect();
                  var headerTopInView = headerRect.top - scrollRect.top;

                  // Always scroll to position the next category header just below
                  // the sticky header stack, unless it's already exactly there
                  if (Math.abs(headerTopInView - stickyOffset) > 2) {
                    var targetScroll = scrollParent.scrollTop + headerTopInView - stickyOffset;
                    scrollParent.scrollTo({ top: Math.max(0, targetScroll), behavior: 'smooth' });
                  }
                });
              });
            });
          }
          return;
        }
      }
    }
    
    function adjustItem(key, delta) {
      var current = (itemStates[key] || { actual: 0 }).actual;
      setItemValue(key, current + delta);
    }
    
    function findItem(areaName, catName, itemName) {
      if (INVENTORY[areaName] && INVENTORY[areaName][catName]) {
        var items = INVENTORY[areaName][catName];
        for (var i = 0; i < items.length; i++) {
          if (items[i].name === itemName) return items[i];
        }
      }
      return null;
    }
    

    // =====================================================
    // TAGGED AREA FUNCTIONS
    // =====================================================

    // Clear item quantities for unsealed areas so they don't persist
    function clearUnsealedItemStates() {
      for (var areaName in INVENTORY) {
        if (taggedAreas[areaName]) continue; // keep sealed area states
        for (var catName in INVENTORY[areaName]) {
          var items = INVENTORY[areaName][catName];
          for (var i = 0; i < items.length; i++) {
            var key = generateKey(areaName, catName, items[i].name);
            delete itemStates[key];
            delete restockStatus[key];
          }
        }
      }
      // The oxygen check and question answers are per-session like item counts
      o2States = {};
      questionAnswers = {};
    }

    // Auto-break is intentionally NOT performed for overdue seals.
    // Instead, overdue seals display a prominent visual warning in the UI
    // (via isReviewOverdue), and the user must manually confirm breaking them
    // using the "Break Seal & Review" button. This function is kept as a
    // hook in case automatic behavior is desired in the future.
    function autoBreakOverdueSeals() {
      // No-op: overdue seals are handled visually, requiring user confirmation.
      return false;
    }

    function isAreaAllOk(areaName) {
      if (!INVENTORY[areaName]) return true;
      for (var catName in INVENTORY[areaName]) {
        var items = INVENTORY[areaName][catName];
        for (var i = 0; i < items.length; i++) {
          var key = generateKey(areaName, catName, items[i].name);
          var actual = (itemStates[key] || { actual: 0 }).actual;
          if (actual < items[i].required) return false;
        }
      }
      return true;
    }

    function isAreaSealable(areaName) {
      if (taggedAreas[areaName]) return false;

      // Everything sealable inside it must already be sealed
      if (unsealedSealableInside(areaName).length > 0) return false;

      // Own items must be OK or handled
      if (INVENTORY[areaName]) {
        for (var catName in INVENTORY[areaName]) {
          var items = INVENTORY[areaName][catName];
          for (var i = 0; i < items.length; i++) {
            var key = generateKey(areaName, catName, items[i].name);
            var actual = (itemStates[key] || { actual: 0 }).actual;
            if (actual >= items[i].required) continue;
            var status = restockStatus[key];
            if (status && (status.restocked || status.outOfStock)) continue;
            return false;
          }
        }
      }
      return true;
    }

    function sealAllAreas() {
      var sealed = 0;
      // Innermost areas first, so a container becomes sealable once what is inside it is sealed
      var list = orderedSealableAreas();
      for (var i = 0; i < list.length; i++) {
        var areaName = list[i];
        if (!taggedAreas[areaName] && isAreaSealable(areaName)) {
          var now = new Date();
          taggedAreas[areaName] = {
            taggedDate: now.toISOString().split('T')[0],
            taggedTimestamp: now.getTime(),
            checkedOn: localDateString(now)
          };
          sealed++;
        }
      }
      if (sealed > 0) {
        expandedArea = null;
        expandedGroup = null;
        buildUI();
        afterSealChange();
      }
    }

    // Sealable areas in display order, what is inside a container before the container itself
    function orderedSealableAreas() {
      var ordered = [];
      function visit(name) {
        var kids = areaHierarchy[name] || [];
        for (var i = 0; i < kids.length; i++) visit(kids[i]);
        if (sealableAreas[name]) ordered.push(name);
      }
      for (var areaName in INVENTORY) {
        if (!areaParent[areaName]) visit(areaName);
      }
      return ordered;
    }

    function countUnsealedSealableAreas() {
      if (!enableTaggedAreas) return 0;
      var list = orderedSealableAreas();
      var n = 0;
      for (var i = 0; i < list.length; i++) {
        if (!taggedAreas[list[i]]) n++;
      }
      return n;
    }

    // The seal step opens only once everything is counted and every shortage is handled
    function sealPhaseActive() {
      return enableTaggedAreas && stateReady && isEverythingComplete();
    }

    // One line saying why an area cannot be sealed yet
    function sealBlockReason(areaName) {
      var waiting = unsealedSealableInside(areaName).length;
      if (waiting > 0) return waiting === 1 ? 'Seal the area inside it first' : 'Seal the ' + waiting + ' areas inside it first';
      if (INVENTORY[areaName]) {
        for (var catName in INVENTORY[areaName]) {
          var items = INVENTORY[areaName][catName];
          for (var i = 0; i < items.length; i++) {
            var key = generateKey(areaName, catName, items[i].name);
            var st = itemStates[key] || { actual: 0 };
            if (st.actual >= items[i].required) continue;
            var status = restockStatus[key];
            if (status && (status.restocked || status.outOfStock)) continue;
            if (!st.touched && !st.actual) return 'Not counted yet: ' + items[i].name;
            return 'Short: ' + items[i].name + ' (' + st.actual + ' of ' + items[i].required + ')';
          }
        }
      }
      return 'Not ready';
    }

    function formatSealTime(ms) {
      var d = new Date(ms);
      var h = d.getHours();
      var m = d.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12; if (h === 0) h = 12;
      return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
    }

    function openSealSheet() {
      renderSealSheet();
      document.getElementById('sealOverlay').classList.add('open');
    }

    function closeSealSheet() {
      document.getElementById('sealOverlay').classList.remove('open');
    }

    function sealSheetOpen() {
      return document.getElementById('sealOverlay').classList.contains('open');
    }

    function renderSealSheet() {
      var body = document.getElementById('sealSheetContent');
      var footer = document.getElementById('sealSheetFooter');
      var list = orderedSealableAreas();
      var anyReady = false;
      var html = '';
      if (list.length === 0) {
        html = '<div class="summary-empty"><div class="icon">✓</div><div>Nothing to seal on this checklist.</div></div>';
      } else {
        html += '<div class="seal-intro">Seal each area once its contents are back in place.</div>';
        for (var i = 0; i < list.length; i++) {
          var name = list[i];
          var ancestors = areaAncestors(name);
          var parent = ancestors.length ? ancestors.join(' \u203A ') : null;
          var rowClass = 'seal-row';
          var statusHtml = '';
          var btnHtml = '';
          if (taggedAreas[name]) {
            rowClass += ' sealed';
            statusHtml = '<div class="seal-row-status sealed">Sealed at ' + formatSealTime(taggedAreas[name].taggedTimestamp) + '</div>';
          } else if (isAreaSealable(name)) {
            anyReady = true;
            statusHtml = '<div class="seal-row-status ready">Ready to seal</div>';
            btnHtml = '<button class="seal-row-btn" onclick="sealFromSheet(' + JSON.stringify(name).replace(/"/g, '&quot;') + ')">Seal</button>';
          } else {
            statusHtml = '<div class="seal-row-status blocked">' + escapeHtml(sealBlockReason(name)) + '</div>';
          }
          html += '<div class="' + rowClass + '" style="padding-left:' + (20 + ancestors.length * 14) + 'px"><div class="seal-row-info">' +
            '<div class="seal-row-name">' + escapeHtml(name) + '</div>' +
            (parent ? '<div class="seal-row-path">' + escapeHtml(parent) + '</div>' : '') +
            statusHtml + '</div>' + btnHtml + '</div>';
        }
      }
      body.innerHTML = html;
      footer.style.display = anyReady ? 'block' : 'none';
    }

    function sealFromSheet(areaName) {
      tagArea(areaName);
    }

    // After any seal: refresh the sheet if it is open; when nothing is left, finish
    function afterSealChange() {
      updateSummary();
      if (countUnsealedSealableAreas() === 0) {
        closeSealSheet();
        showCompletionPopup();
      } else if (sealSheetOpen()) {
        renderSealSheet();
      }
    }

    // After the last shortage is handled: leave the restock list and move to sealing
    function handleRestockComplete() {
      if (!isEverythingComplete()) return false;
      closeRestockModal();
      updateSummary();
      if (countUnsealedSealableAreas() > 0) {
        setTimeout(openSealSheet, 150);
      } else {
        showCompletionPopup();
      }
      return true;
    }

    function isEverythingComplete() {
      if (enableOxygenCheck && !isOxygenCheckComplete()) return false;
      var lowCyl = collectLowO2Cylinders();
      for (var lcI = 0; lcI < lowCyl.length; lcI++) {
        var lcStatus = restockStatus[lowCyl[lcI].key];
        if (!(lcStatus && (lcStatus.restocked || lcStatus.outOfStock))) return false;
      }
      if (!areRequiredQuestionsAnswered()) return false;
      for (var areaName in INVENTORY) {
        if (taggedAreas[areaName]) continue;
        for (var catName in INVENTORY[areaName]) {
          var items = INVENTORY[areaName][catName];
          for (var i = 0; i < items.length; i++) {
            var key = generateKey(areaName, catName, items[i].name);
            var actual = (itemStates[key] || { actual: 0 }).actual;
            if (actual >= items[i].required) continue;
            var status = restockStatus[key];
            if (status && (status.restocked || status.outOfStock)) continue;
            return false;
          }
        }
      }
      return true;
    }

    function showCompletionPopup() {
      var msgEl = document.getElementById('completionMessage');
      if (enableTaggedAreas) {
        msgEl.textContent = 'Please make sure all areas marked as sealed have been tied off before continuing.';
      } else {
        msgEl.textContent = 'Please press Next.';
      }
      document.getElementById('completionOverlay').classList.add('open');
    }

    function closeCompletionPopup() {
      document.getElementById('completionOverlay').classList.remove('open');
    }

    // =====================================================
    // RESET DIALOG
    // =====================================================

    var selectedResetOption = null;

    // =====================================================
    // CHANGELOG DIALOG
    // =====================================================

    function openChangelog() {
      var body = document.getElementById('changelogBody');
      var html = '';
      for (var i = 0; i < CHANGELOG.length; i++) {
        var entry = CHANGELOG[i];
        html += '<div class="changelog-version">';
        html += '<div class="changelog-version-header">';
        html += '<span class="changelog-version-number">v' + escapeHtml(entry.version) + '</span>';
        if (entry.date) {
          html += '<span class="changelog-version-date">' + escapeHtml(entry.date) + '</span>';
        }
        html += '</div>';
        html += '<ul class="changelog-changes">';
        for (var j = 0; j < entry.changes.length; j++) {
          html += '<li>' + escapeHtml(entry.changes[j]) + '</li>';
        }
        html += '</ul>';
        html += '</div>';
      }
      body.innerHTML = html;
      document.getElementById('changelogOverlay').classList.add('open');
    }

    function closeChangelog() {
      document.getElementById('changelogOverlay').classList.remove('open');
    }

    function initVersionDisplay() {
      var el = document.getElementById('versionDisplay');
      if (el) el.textContent = 'v' + VERSION;
    }

    // =====================================================
    // RESET DIALOG
    // =====================================================

    function openResetDialog() {
      selectedResetOption = null;
      var options = document.querySelectorAll('.reset-option');
      for (var i = 0; i < options.length; i++) {
        options[i].classList.remove('selected', 'restore');
        var radio = options[i].querySelector('input[type="radio"]');
        if (radio) radio.checked = false;
      }
      document.getElementById('resetConfirmBtn').classList.remove('enabled');
      // Show the "Restore from last submission" option only if a Jotform API key is configured
      var jfOption = document.getElementById('resetJotformOption');
      if (jfOption) {
        var hasApiKey = false;
        try {
          hasApiKey = typeof JFCustomWidget !== 'undefined' && !!JFCustomWidget.getWidgetSetting('jotformApiKey');
        } catch (e) {}
        jfOption.style.display = hasApiKey ? '' : 'none';
      }
      document.getElementById('resetOverlay').classList.add('open');
    }

    function closeResetDialog() {
      document.getElementById('resetOverlay').classList.remove('open');
      selectedResetOption = null;
    }

    function selectResetOption(option) {
      selectedResetOption = option;
      var options = document.querySelectorAll('.reset-option');
      for (var i = 0; i < options.length; i++) {
        var radio = options[i].querySelector('input');
        var isThis = radio && radio.value === option;
        options[i].classList.toggle('selected', isThis);
        options[i].classList.toggle('restore', isThis && option === 'jotform');
      }
      var confirmBtn = document.getElementById('resetConfirmBtn');
      confirmBtn.classList.add('enabled');
      // Change button text/color for restore vs destructive reset
      if (option === 'jotform') {
        confirmBtn.textContent = 'Restore';
        confirmBtn.style.background = '#0066cc';
      } else {
        confirmBtn.textContent = 'Reset';
        confirmBtn.style.background = '';
      }
    }

    function confirmReset() {
      if (!selectedResetOption) return;

      if (selectedResetOption === 'jotform') {
        // Restore sealed state from most recent Jotform submission
        var apiKey, apiBase, formID, qid;
        try {
          apiKey = JFCustomWidget.getWidgetSetting('jotformApiKey');
          apiBase = JFCustomWidget.getWidgetSetting('jotformApiBase') || 'https://api.jotform.com';
          var fp = getFormParams();
          formID = fp.formID || cachedFormID || null;
          qid = fp.qid || null;
        } catch (e) {
          alert('Unable to access Jotform widget settings.');
          return;
        }
        if (!apiKey || !formID) {
          alert('Unable to restore: Jotform API key or form ID not available.');
          return;
        }

        // Clear all local state first
        itemStates = {};
        restockStatus = {};
        brokenSeals = [];
        collapsedCategories = {};
        taggedAreas = {};
        o2States = {};
        questionAnswers = {};
        expandedArea = null;
        expandedGroup = null;
        try { localStorage.removeItem(getStorageKey()); } catch (e) {}
        try { localStorage.removeItem(getSealStorageKey()); } catch (e) {}

        closeResetDialog();

        // Fetch from server, forcing timestamp comparison to accept any remote data
        fetchLatestSealState(apiBase, formID, apiKey, qid, function(remote) {
          if (remote && remote.taggedAreas) {
            taggedAreas = remote.taggedAreas;
            if (remote.brokenSeals) brokenSeals = remote.brokenSeals;
          }
          // Rebuild regardless — either with restored seals or with a clean slate
          autoBreakOverdueSeals();
          clearUnsealedItemStates();
          buildUI();
          if (stateReady) {
            saveState();
            saveSealState();
          }
          resizeWidget();
          maybeStartSealCheck();
        });
        return;
      }

      if (selectedResetOption === 'all') {
        if (!confirm('This will break ALL seals and reset every item to zero. Are you sure?')) return;
        // Break all seals
        for (var areaName in taggedAreas) {
          brokenSeals.push({
            area: areaName,
            reason: 'manual_reset',
            taggedDate: taggedAreas[areaName].taggedDate,
            brokenTimestamp: Date.now()
          });
        }
        taggedAreas = {};
        itemStates = {};
        restockStatus = {};
        collapsedCategories = {};
        o2States = {};
        questionAnswers = {};
        try { localStorage.removeItem(getStorageKey()); } catch (e) {}
        try { localStorage.removeItem(getSealStorageKey()); } catch (e) {}
      } else {
        // Reset only unsealed areas
        for (var areaName in INVENTORY) {
          if (taggedAreas[areaName]) continue;
          for (var catName in INVENTORY[areaName]) {
            var items = INVENTORY[areaName][catName];
            for (var i = 0; i < items.length; i++) {
              var key = generateKey(areaName, catName, items[i].name);
              delete itemStates[key];
              delete restockStatus[key];
            }
          }
        }
        collapsedCategories = {};
        o2States = {};
        questionAnswers = {};
      }

      closeResetDialog();
      expandedArea = null;
      expandedGroup = null;
      buildUI();
      if (stateReady) saveState();
    }

    function toggleCategoryCollapse(areaName, catName) {
      var key = areaName + '::' + catName;
      collapsedCategories[key] = !collapsedCategories[key];
